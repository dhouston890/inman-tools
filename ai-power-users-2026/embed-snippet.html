<!-- =====================================================================
     Inman — "At real estate brokerages, power users are increasingly turning to AI agents"
     WordPress paste-in snippet (use a "Custom HTML" block, not the visual editor).
     Live tool: https://dhouston890.github.io/inman-tools/ai-power-users-2026/
     The ?embed flag makes the tool report its rendered height via postMessage;
     the listener below resizes the iframe so there is never an inner scrollbar.
     ===================================================================== -->
<div style="max-width:760px;margin:0 auto;">
  <iframe
    id="inman-ai-power-users-2026"
    src="https://dhouston890.github.io/inman-tools/ai-power-users-2026/?embed"
    title="AI power users compared with other agents — Inman"
    style="width:100%;border:0;height:1660px;display:block;"
    loading="lazy"
    scrolling="no"></iframe>
</div>
<script>
(function(){
  var frame = document.getElementById("inman-ai-power-users-2026");
  window.addEventListener("message", function(e){
    var d = e.data;
    if (frame && e.source === frame.contentWindow && d && d.type === "inman-embed-height" && d.height){
      frame.style.height = d.height + "px";
    }
  });
})();
</script>
