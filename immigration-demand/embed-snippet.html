<!-- Inman: "Who is buying" — immigrant homeowners and recent buyers by metro.
     Paste into a WordPress **Custom HTML** block, not the visual editor.
     The iframe reports its own height, so the fallback below only matters for
     the moment before the first message arrives. -->
<div style="max-width:960px;margin:0 auto;">
  <iframe
    id="inman-pums-map"
    src="https://dhouston890.github.io/inman-tools/immigration-demand/index.html?embed"
    title="Who is buying — immigrant homeowners by metro — Inman"
    style="width:100%;border:0;display:block;height:900px;"
    height="900"
    loading="lazy"
    scrolling="no"></iframe>
</div>
<script>
(function(){
  var frame = document.getElementById('inman-pums-map');
  window.addEventListener('message', function(e){
    if (!e.data || e.data.type !== 'inman-embed-height') return;
    if (frame.contentWindow !== e.source) return;
    var h = parseInt(e.data.height, 10);
    if (h > 0) frame.style.height = h + 'px';
  });
})();
</script>
