# Weekly refresh of pmms/pmms.json, the default mortgage rates (30-year and
# 15-year fixed, same week) for the Inman buying-vs-renting calculator
# (buy-vs-rent-condo/).
#
# Active since 2026-10-08 as .github/workflows/pmms-refresh.yml in the
# inman-tools repo, with a FRED_API_KEY repository secret. Source copy:
# active_workspace/viz/pmms/.github-workflow/. See pmms/README.md.
#
# Schedule (checked 2026-10-08). Freddie Mac releases the PMMS on Thursdays
# at 12 p.m. ET; "When a U.S. holiday falls on a Thursday, the PMMS will
# publish on the Wednesday of that week" (freddiemac.com/pmms/about-pmms).
# FRED posted the Oct. 8, 2026 reading at 11:02 a.m. CDT, two minutes after
# release. Cron times are UTC and don't follow daylight saving, so each
# release day has two runs an hour apart; one of them always lands at
# 1:17 p.m. ET:
#   - Thu 17:17 and 18:17 UTC: 1:17 and 2:17 p.m. EDT (summer), or 12:17 and
#     1:17 p.m. EST (winter). The main runs.
#   - Wed 17:17 and 18:17 UTC: the same, for holiday weeks when Freddie Mac
#     publishes on Wednesday; no-ops in normal weeks.
#   - Fri 14:17 and Mon 14:17 UTC (10:17 a.m. EDT / 9:17 a.m. EST):
#     backstops for a late Freddie Mac release, a slow FRED update, or a
#     GitHub run that was delayed or dropped (scheduled runs are best-effort
#     and can slip, most often at the top of the hour, hence minute 17).
# Extra runs are harmless: fetch_pmms.py commits only when the week changes,
# never rolls back to an older week, and uses the latest week both series
# report if one lags. Run it by hand from the Actions tab (workflow_dispatch)
# any time.

name: Refresh PMMS rate

on:
  schedule:
    - cron: "17 17,18 * * 3"
    - cron: "17 17,18 * * 4"
    - cron: "17 14 * * 5"
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pmms-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Fetch the latest MORTGAGE30US and MORTGAGE15US readings
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        # Exits nonzero (failing the run) on any error, leaving pmms.json as is.
        run: python3 pmms/fetch_pmms.py pmms/pmms.json

      - name: Commit pmms/pmms.json if it changed
        run: |
          if git diff --quiet -- pmms/pmms.json; then
            echo "pmms.json unchanged; nothing to commit."
            exit 0
          fi
          week=$(python3 -c "import json; print(json.load(open('pmms/pmms.json'))['week'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pmms/pmms.json
          git commit -m "Update PMMS rates to the week of ${week}"
          git push
