<!-- =====================================================================
     Inman — MBA purchase loan applications by year
     WordPress paste-in snippet (use a "Custom HTML" block, not the visual editor).
     Live tool (once published to inman-tools): https://dhouston890.github.io/inman-tools/mba-purchase-index/
     The ?embed flag makes the tool report its rendered height via postMessage;
     the listener below resizes the iframe so there is never an inner scrollbar.
     ===================================================================== -->
<div style="max-width:960px;margin:0 auto;">
  <iframe
    id="inman-mba-purchase-index"
    src="https://dhouston890.github.io/inman-tools/mba-purchase-index/?embed"
    title="Purchase loan applications by year — Inman"
    style="width:100%;border:0;height:900px;display:block;"
    loading="lazy"
    scrolling="no"></iframe>
</div>
<script>
(function(){
  var frame = document.getElementById('inman-mba-purchase-index');
  window.addEventListener('message', function(e){
    var d = e.data;
    if (d && d.type === 'inman-embed-height' && d.height && frame){
      frame.style.height = d.height + 'px';
    }
  });
})();
</script>
