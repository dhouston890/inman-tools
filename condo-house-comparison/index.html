const COLOR = { condo:"#0a84ff", sfr:"#da3832", band:"rgba(10,132,255,.16)",
                ink:"#1b1f3b", muted:"#5b6180", faint:"#8b91ad", grid:"#eef0f6", axis:"#ccd2e2" };
const FONT = "Libre Franklin, Helvetica Neue, Arial, sans-serif";

let D = null, chart = null, TOKENS = {}, metroChoices = null;
const BY_ID = {};
// view: values (the opening view: home values + days to pending) | supply
// (new listings + sales). metro: a CBSA code, a Florida-split id ("us-xfl",
// "fl"), or null for the United States view. A Florida-split row has the same
// shape as a metro row plus agg = true, so it is drawn exactly like a metro;
// agg only switches the wording (legend, tiles, notes, method).
const S = { view: "values", metro: null };
function curMetro(){ return S.metro ? BY_ID[S.metro] : null; }
// Series/legend wording for the selection: a Florida-split selection takes
// its condo and single-family labels from COPY.subsetView, the rest
// (the U.S. entries) from COPY.metroView.
function viewCopy(M){ return M && M.agg ? Object.assign({}, COPY.metroView, COPY.subsetView) : COPY.metroView; }
// Tokens for the selection's own wording (metro name; Florida-split market counts)
function selTokens(M){
  const t = { metro: M.n };
  if (M.agg) { t.sub_n_v = M.nn.v; t.sub_n_dt = M.nn.dt; t.sub_n_nl = M.nn.nl; t.sub_n_sa = M.nn.sa; }
  return t;
}

/* ---------------------------------------------------------------- helpers */
function monthLabel(ym){ return COPY.months[+ym.slice(5,7)-1] + " " + ym.slice(0,4); }
function fill(str, extra){
  const t = Object.assign({}, TOKENS, extra || {});
  return String(str).replace(/\{(\w+)\}/g, function(m, k){ return t[k] != null ? t[k] : m; });
}
function signed(v, d){
  d = d == null ? 1 : d;
  const s = Math.abs(v).toFixed(d);
  return (v > 0 ? "+" : v < 0 ? "−" : "") + s + "%";
}
// percentage change for axis, end and tooltip labels: "+12%", "−8%", "0%"
function pctLabel(v, d){
  const r = +v.toFixed(d == null ? 0 : d);
  return (r > 0 ? "+" : r < 0 ? "−" : "") + Math.abs(r).toFixed(d == null ? 0 : d) + "%";
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function setText(id, s){ const el = document.getElementById(id); if (el) el.textContent = s; }

/* ------------------------------------------------------------ static text */
function paintStatic(){
  document.title = COPY.pageTitle;
  setText("kicker", COPY.kicker);
  setText("title", COPY.title);
  setText("standfirst", fill(COPY.standfirst));
  setText("view-lab", COPY.viewLabel);
  setText("metro-lab", COPY.metroLabel);
  document.querySelectorAll("#view-seg button").forEach(function(b){
    b.textContent = COPY.views[b.dataset.view];
  });
  setText("credit", COPY.credit);
}

/* ---------------------------------------------------------------- readout */
function roCell(label, color, value, sub, us){
  return '<div class="ro"><div class="k">' +
    (color ? '<span class="sw" style="background:' + color + '"></span>' : '') +
    esc(label) + '</div><div class="v">' + esc(value) + '</div>' +
    '<div class="sub">' + esc(sub) + '</div>' +
    (us ? '<div class="us">' + esc(us) + '</div>' : '') + '</div>';
}
function paintReadout(){
  const k = D.key, el = document.getElementById("readout"), M = curMetro();
  if (S.view === "supply" && M){
    // metro view: the metro's figures, with the U.S. figure underneath
    const R = COPY.supply.readout, A = M.agg;
    const cell = function(label, color, part, key, sub, usTpl, usVal){
      const ok = part.st === "ok";
      return roCell(label, color, ok ? signed(part[key]) : R.notCharted,
                    ok ? fill(sub) : R.notChartedSub, fill(usTpl, { v: signed(usVal) }));
    };
    el.innerHTML =
      cell(A ? R.subNlCondo : R.metroNlCondo,       COLOR.condo, M.nl, "pc", R.nlSub,    R.usCondo, k.nl_condo_pct) +
      cell(A ? R.subNlSfr : R.metroNlSfr,           COLOR.sfr,   M.nl, "ps", R.nlSub,    R.usSfr,   k.nl_sfr_pct) +
      cell(A ? R.subSalesCondo : R.metroSalesCondo, COLOR.condo, M.sa, "pc", R.salesSub, R.usCondo, k.sales_condo_pct) +
      cell(A ? R.subSalesSfr : R.metroSalesSfr,     COLOR.sfr,   M.sa, "ps", R.salesSub, R.usSfr,   k.sales_sfr_pct);
  } else if (S.view === "supply"){
    const R = COPY.supply.readout;
    el.innerHTML =
      roCell(R.nlCondo,    COLOR.condo, signed(k.nl_condo_pct),    fill(R.nlSub)) +
      roCell(R.nlSfr,      COLOR.sfr,   signed(k.nl_sfr_pct),      fill(R.nlSub)) +
      roCell(R.salesCondo, COLOR.condo, signed(k.sales_condo_pct), fill(R.salesSub)) +
      roCell(R.salesSfr,   COLOR.sfr,   signed(k.sales_sfr_pct),   fill(R.salesSub));
  } else if (M){
    // values view, metro selected: the metro's figures (or "not charted"),
    // with the U.S. figure underneath, as in the supply view
    const R = COPY.values.readout, vk = D.values.key, dd = D.days, A = M.agg;
    const mV = M.v.st === "ok" ? M.v : null, mD = M.dt.st === "ok" ? M.dt.d : null;
    el.innerHTML =
      roCell(A ? R.subVCondo : R.metroVCondo, COLOR.condo, mV ? signed(mV.pc) : R.notCharted, mV ? fill(R.vSub) : R.notChartedSub,
             fill(R.usValue, { v: signed(vk.condo_pct) })) +
      roCell(A ? R.subVSfr : R.metroVSfr, COLOR.sfr, mV ? signed(mV.ps) : R.notCharted, mV ? fill(R.vSub) : R.notChartedSub,
             fill(R.usSfrValue, { v: signed(vk.sfr_pct) })) +
      roCell(A ? R.subDCondo : R.metroDCondo, COLOR.condo, mD ? fill(R.dCondoValue, { v: mD.c }) : R.notCharted,
             mD ? fill(R.dCondoSub, { base: mD.cb }) : R.notChartedSub, fill(R.usDays, { v: dd.condo })) +
      roCell(A ? R.subDSfr : R.metroDSfr, COLOR.sfr, mD ? fill(R.dSfrValue, { v: mD.s }) : R.notCharted,
             mD ? fill(R.dSfrSub, { base: mD.sb }) : R.notChartedSub, fill(R.usSfrDays, { v: dd.sfr }));
  } else {
    // values view, United States
    const R = COPY.values.readout, vk = D.values.key, dd = D.days;
    el.innerHTML =
      roCell(R.vCondo, COLOR.condo, signed(vk.condo_pct), fill(R.vSub)) +
      roCell(R.vSfr,   COLOR.sfr,   signed(vk.sfr_pct),   fill(R.vSub)) +
      roCell(R.dCondo, COLOR.condo, fill(R.dCondoValue, { v: dd.condo }), fill(R.dCondoSub, { base: dd.condo_base })) +
      roCell(R.dSfr,   COLOR.sfr,   fill(R.dSfrValue, { v: dd.sfr }),     fill(R.dSfrSub,   { base: dd.sfr_base }));
  }
}

/* ----------------------------------------------------------------- legend */
function legendItem(color, label, dashed){
  return '<span class="it"><span class="ln' + (dashed ? ' dash' : '') + '" style="' +
    (dashed ? 'border-color:' : 'background:') + color + '"></span>' + esc(label) + '</span>';
}
function bandItem(label){
  return '<span class="it"><span class="bd"></span>' + esc(label) + '</span>';
}
function paintLegend(){
  const M = curMetro();
  if (M){
    const V = viewCopy(M), t = { metro: M.n };
    let h = "";
    // metro entries only if at least one panel draws the metro's lines
    const any = S.view === "supply" ? (M.nl.st === "ok" || M.sa.st === "ok")
                                    : (M.v.st === "ok" || M.dt.st === "ok");
    if (any) h += legendItem(COLOR.condo, fill(V.condo, t)) + legendItem(COLOR.sfr, fill(V.sfr, t));
    h += legendItem(COLOR.condo, V.usCondo, true) + legendItem(COLOR.sfr, V.usSfrLegend, true);
    // values view: the band belongs to whichever condo days-to-pending line is
    // drawn with it (the metro's when charted, otherwise the U.S. line)
    if (S.view === "values") h += bandItem(M.dt.st === "ok" ? fill(COPY.dtp.bandMetro, t) : COPY.dtp.bandUS);
    document.getElementById("legend").innerHTML = h;
    return;
  }
  let h = '<span class="it"><span class="ln" style="background:' + COLOR.condo + '"></span>' + esc(COPY.condo) + '</span>' +
          '<span class="it"><span class="ln" style="background:' + COLOR.sfr + '"></span>' + esc(COPY.sfrLegend) + '</span>';
  if (S.view === "values") h += bandItem(COPY.dtp.band);
  document.getElementById("legend").innerHTML = h;
}

/* ------------------------------------------------------------ chart parts */
function axisText(extra){
  return Object.assign({ color: COLOR.muted, fontFamily: FONT, fontSize: 11 }, extra || {});
}
// Category x axis of "YYYY-MM" months, labelled at each January (every other
// January when the plot is narrow).
function monthAxis(months, gridIndex, narrow){
  const show = function(i, v){
    return v.slice(5,7) === "01" && (!narrow || (+v.slice(0,4)) % 2 === 1);
  };
  return {
    type: "category", gridIndex: gridIndex, data: months, boundaryGap: false,
    axisLine: { lineStyle: { color: COLOR.axis } },
    axisTick: { interval: show, lineStyle: { color: COLOR.axis } },
    axisLabel: axisText({ interval: show, formatter: function(v){ return v.slice(0,4); }, hideOverlap: true }),
    splitLine: { show: false },
    axisPointer: { label: { show: false } }
  };
}
// pct: the panel's data are indexes (base = 100) and are labelled as the
// percentage change from the base (index - 100), so 100 reads "0%".
function valueAxis(gridIndex, b, name, pct){
  return {
    type: "value", gridIndex: gridIndex, min: b.min, max: b.max, interval: b.step,
    axisLine: { show: false }, axisTick: { show: false },
    splitLine: { lineStyle: { color: COLOR.grid } },
    axisLabel: axisText(pct ? { formatter: function(v){ return pctLabel(v - 100, 0); } } : {}),
    name: name, nameLocation: "end", nameGap: 10,
    nameTextStyle: axisText({ color: COLOR.faint, fontSize: 10.5, align: "left", padding: [0,0,0,-28] })
  };
}
function niceBounds(vals, step){
  const v = vals.filter(function(x){ return x != null && isFinite(x); });
  const lo = Math.min.apply(null, v), hi = Math.max.apply(null, v);
  return { min: Math.floor((lo - step*0.3) / step) * step,
           max: Math.ceil((hi + step*0.3) / step) * step, step: step };
}
function line(name, data, color, xi, yi, endFmt, extra){
  return Object.assign({
    name: name, type: "line", data: data, xAxisIndex: xi, yAxisIndex: yi,
    showSymbol: false, symbol: "circle", symbolSize: 7, smooth: false,
    connectNulls: false, z: 3,
    lineStyle: { width: 2, color: color }, itemStyle: { color: color },
    emphasis: { disabled: true },
    // value in ink, identified by a bullet in the series colour beside it
    endLabel: { show: true, distance: 5,
                formatter: function(p){ return "{d|\u25CF} {v|" + endFmt(p) + "}"; },
                rich: { d: { color: color, fontSize: 10 },
                        v: { color: COLOR.ink, fontFamily: FONT, fontSize: 11.5, fontWeight: 600 } } },
    labelLayout: { moveOverlap: "shiftY" }
  }, extra || {});
}
function tipBox(){
  return {
    trigger: "axis", confine: true, axisPointer: { type: "line", lineStyle: { color: "#aab3cf" } },
    backgroundColor: "#fff", borderColor: "#ccd2e2", borderWidth: 1, padding: [7, 10],
    textStyle: { color: COLOR.ink, fontFamily: FONT, fontSize: 12 }
  };
}
function tipRow(color, label, value){
  return '<div style="display:flex;justify-content:space-between;gap:14px;align-items:center">' +
    '<span><span style="display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px;background:' +
    color + '"></span>' + esc(label) + '</span><span style="font-weight:600;font-variant-numeric:tabular-nums">' +
    esc(value) + '</span></div>';
}

/* ---------------------------------- two-panel layout (both views share it) */
// Plot widths of the two panels (side by side; stacked when narrow). Used to
// size the panel notes before the layout reserves their height.
function panelWidths(w, narrow){ return narrow ? [w - 80, w - 80] : [0.46 * w - 40, 0.445 * w - 48]; }
// Note over panel i: written and measured here so the layout can reserve its
// height (+10 px); 0 when the panel has no note, so the layout is unchanged.
function noteHeights(texts, gw){
  return texts.map(function(t, i){ return t ? measureNote(i, t, gw[i]) + 10 : 0; });
}
// Grid, title and note positions for two panels; nh = note heights. In the
// metro view (M set) the narrow layout leaves 6 px more under each subtitle, so
// the top axis label clears it when a metro widens the scale.
function twoPanelLayout(w, narrow, nh, M){
  const gw = panelWidths(w, narrow);
  let grids, titles, height, rects;
  if (narrow){
    const gh = 190, pd = M ? 6 : 0, n0 = nh[0] + pd, n1 = nh[1] + pd;
    grids  = [{ left: 36, right: 44, top: 44 + n0, height: gh },
              { left: 36, right: 44, top: 44 + gh + 74 + n0 + n1, height: gh }];
    titles = [{ left: 12, top: 8 }, { left: 12, top: 44 + gh + 38 + n0 }];
    height = 44 + gh + 74 + gh + 34 + n0 + n1;
    rects  = [{ left: 36, top: 42, width: gw[0] }, { left: 36, top: 44 + gh + 72 + n0, width: gw[1] }];
  } else {
    const nr = Math.max(nh[0], nh[1]);
    grids  = [{ left: 40, right: "54%", top: 56 + nr, bottom: 34 }, { left: "55.5%", right: 48, top: 56 + nr, bottom: 34 }];
    titles = [{ left: 12, top: 10 }, { left: "52%", top: 10 }];
    height = 400 + nr;
    rects  = [{ left: 40, top: 54, width: gw[0] }, { left: 0.555 * w, top: 54, width: gw[1] }];
  }
  return { grids: grids, titles: titles, height: height, rects: rects };
}
function panelTitle(pos, text, sub){
  return Object.assign({ text: text, subtext: sub, itemGap: 3,
    textStyle: { fontFamily: FONT, fontSize: 13, fontWeight: 700, color: COLOR.ink },
    subtextStyle: { fontFamily: FONT, fontSize: 11, color: COLOR.muted } }, pos);
}
// dashed reference at the base level (100, labelled 0%) of an indexed panel
const MARK100 = { silent: true, symbol: "none",
  lineStyle: { color: "#9aa2c0", type: "dashed", width: 1 },
  label: { show: false }, data: [{ yAxis: 100 }] };
// A U.S. line in the metro view: thinner, dashed, under the metro lines; end
// label only when the panel has no metro lines (labelled = true).
function usLine(id, name, data, color, xi, labelled, endFmt, extra){
  const o = Object.assign({ id: id, z: 2, lineStyle: { width: 1.3, color: color, type: "dashed" } }, extra || {});
  if (!labelled) o.endLabel = { show: false };
  return line(name, data, color, xi, xi, endFmt, o);
}

/* ------------------------------------------ panel 1: new listings + sales */
function supplyOption(w){
  const P = D.supply, C = COPY.supply, narrow = w < 600;
  // metro view: a measure's metro lines exist only where it passed the build's gate
  const M = curMetro();
  const mNL = M && M.nl.st === "ok" ? M.nl : null, mSA = M && M.sa.st === "ok" ? M.sa : null;
  const b = niceBounds([].concat(P.nl_condo, P.nl_sfr, P.sales_condo, P.sales_sfr, [100],
                                 mNL ? mNL.c.concat(mNL.s) : [], mSA ? mSA.c.concat(mSA.s) : []), 10);
  const idxLabel = function(p){ return pctLabel(p.value - 100, 0); };
  const mark100 = MARK100;
  // Metro view: a panel whose metro lines are withheld gets a note between its
  // subtitle and its plot; the plot moves down by the note's measured height
  // (no notes in the United States view, so that layout is unchanged).
  const notes = [M && !mNL ? supplyNoteText(0, M.nl.st) : null, M && !mSA ? supplyNoteText(1, M.sa.st) : null];
  const L = twoPanelLayout(w, narrow, noteHeights(notes, panelWidths(w, narrow)), M);
  const grids = L.grids, titles = L.titles, height = L.height, rects = L.rects;
  const ttl = panelTitle;
  const tip = tipBox();
  tip.formatter = function(ps){
    if (!ps.length) return "";
    const isSales = M ? String(ps[0].seriesId).indexOf("sa-") === 0
                      : (ps[0].axisIndex === 1 || ps[0].seriesIndex >= 2);
    let h = '<div style="font-weight:700">' + esc(fill(C.tipHead, { month: monthLabel(ps[0].axisValue) })) + '</div>' +
            '<div style="color:' + COLOR.faint + ';font-size:11px;margin:1px 0 5px">' +
            esc((isSales ? C.tipSales : C.tipListings) + " · " + C.tipVs) + '</div>';
    ps.forEach(function(p){
      if (p.value == null) return;
      h += tipRow(p.color, p.seriesName, pctLabel(p.value - 100, 1));
    });
    return h;
  };
  let series;
  if (!M){
    // United States view (default): exactly the previous four lines
    series = [
      line(COPY.condo, P.nl_condo,    COLOR.condo, 0, 0, idxLabel, { markLine: mark100 }),
      line(COPY.sfr,   P.nl_sfr,      COLOR.sfr,   0, 0, idxLabel),
      line(COPY.condo, P.sales_condo, COLOR.condo, 1, 1, idxLabel, { markLine: mark100 }),
      line(COPY.sfr,   P.sales_sfr,   COLOR.sfr,   1, 1, idxLabel)
    ];
  } else {
    // Metro view, per panel: the metro's lines (solid, labelled) where they
    // passed the gate, then the U.S. lines (thinner, dashed; end labels only
    // when the panel has no metro lines). Same colours by home type.
    const V = viewCopy(M), t = { metro: M.n };
    const us = function(id, name, data, color, xi, labelled, extra){
      return usLine(id, name, data, color, xi, labelled, idxLabel, extra);
    };
    const panel = function(pre, xi, m, uc, usf){
      const out = [];
      if (m){
        out.push(line(fill(V.condo, t), m.c, COLOR.condo, xi, xi, idxLabel, { id: pre + "m-c", z: 4 }));
        out.push(line(fill(V.sfr, t),   m.s, COLOR.sfr,   xi, xi, idxLabel, { id: pre + "m-s", z: 4 }));
      }
      out.push(us(pre + "us-c", V.usCondo, uc,  COLOR.condo, xi, !m, { markLine: mark100 }));
      out.push(us(pre + "us-s", V.usSfr,   usf, COLOR.sfr,   xi, !m));
      return out;
    };
    series = panel("nl-", 0, mNL, P.nl_condo, P.nl_sfr).concat(panel("sa-", 1, mSA, P.sales_condo, P.sales_sfr));
  }
  return {
    height: height,
    rects: rects,
    notes: notes,
    option: {
      animationDuration: 300,
      title: [ttl(titles[0], C.panelListings, C.panelListingsSub), ttl(titles[1], C.panelSales, C.panelSalesSub)],
      grid: grids,
      tooltip: tip,
      xAxis: [monthAxis(P.months, 0, narrow), monthAxis(P.sales_months, 1, narrow)],
      yAxis: [valueAxis(0, b, "", true), valueAxis(1, b, "", true)],
      series: series
    }
  };
}

/* ------------------------ values view: home values + days to pending */
// Left panel (grid 0): home values, 2018-19 = 100. Right panel (grid 1): days
// to pending, 12-month average, with the condo estimate band. Same layout as
// the supply view. With a metro selected, each panel draws the metro's lines
// (solid) where the build charted them, over the U.S. lines (dashed); the
// band follows the metro's condo line when it is drawn, else the U.S. one.
function valuesOption(w){
  const V = D.values, P = D.dtp, C = COPY.values, narrow = w < 600, M = curMetro();
  const mV = M && M.v.st === "ok" ? M.v : null, mD = M && M.dt.st === "ok" ? M.dt : null;
  const notes = [M && !mV ? C.panelNote.vGaps : null,
                 M && !mD ? (M.dt.st === "gaps" ? C.panelNote.dtGaps : C.panelNote.dtThin) : null];
  const L = twoPanelLayout(w, narrow, noteHeights(notes, panelWidths(w, narrow)), M);
  // side by side: the value panel's end labels have three digits (e.g. 158),
  // so its plot stops 10 px earlier than the supply view's, clear of the
  // days panel's axis labels
  if (!narrow) L.grids[0].right = Math.round(0.54 * w + 10);
  const bv = niceBounds([].concat(V.condo, V.sfr, [100], mV ? mV.c.concat(mV.s) : []), 10);
  // days axis: everything drawn (the U.S. band only when it is shown); 20-day
  // steps when a metro stretches the scale, so the ticks stay readable
  const dvals = [].concat(P.condo, P.sfr, mD ? mD.lo.concat(mD.hi, mD.s) : P.lo.concat(P.hi));
  const dspan = Math.max.apply(null, dvals) - Math.min.apply(null, dvals);
  const bd = niceBounds(dvals, dspan > 90 ? 20 : 10);
  const idxLabel = function(p){ return pctLabel(p.value - 100, 0); };
  // whole-day labels come from the build (rounded once from full precision)
  const dayFmt = function(arr){ return function(p){ return arr[p.dataIndex]; }; };
  // estimate band: an invisible lower edge plus a stacked width, which
  // ECharts honours on a category axis
  const band = function(lo, hi){
    const width = hi.map(function(h, i){ return h == null || lo[i] == null ? null : +(h - lo[i]).toFixed(1); });
    return [
      { id: "d-band-lo", name: "band-lo", type: "line", data: lo, stack: "band", silent: true, symbol: "none",
        xAxisIndex: 1, yAxisIndex: 1, lineStyle: { opacity: 0 }, emphasis: { disabled: true }, z: 1 },
      { id: "d-band", name: "band", type: "line", data: width, stack: "band", silent: true, symbol: "none",
        xAxisIndex: 1, yAxisIndex: 1, lineStyle: { opacity: 0 }, areaStyle: { color: COLOR.band, opacity: 1 },
        emphasis: { disabled: true }, z: 1 }
    ];
  };
  let series;
  if (!M){
    series = [
      line(COPY.condo, V.condo, COLOR.condo, 0, 0, idxLabel, { id: "v-c", markLine: MARK100 }),
      line(COPY.sfr,   V.sfr,   COLOR.sfr,   0, 0, idxLabel, { id: "v-s" })
    ].concat(band(P.lo, P.hi), [
      line(COPY.condo, P.condo, COLOR.condo, 1, 1, dayFmt(P.condo_d), { id: "d-c" }),
      line(COPY.sfr,   P.sfr,   COLOR.sfr,   1, 1, dayFmt(P.sfr_d),   { id: "d-s" })
    ]);
  } else {
    const MV = viewCopy(M), t = { metro: M.n };
    series = [];
    if (mV){
      series.push(line(fill(MV.condo, t), mV.c, COLOR.condo, 0, 0, idxLabel, { id: "v-m-c", z: 4 }));
      series.push(line(fill(MV.sfr, t),   mV.s, COLOR.sfr,   0, 0, idxLabel, { id: "v-m-s", z: 4 }));
    }
    series.push(usLine("v-us-c", MV.usCondo, V.condo, COLOR.condo, 0, !mV, idxLabel, { markLine: MARK100 }));
    series.push(usLine("v-us-s", MV.usSfr,   V.sfr,   COLOR.sfr,   0, !mV, idxLabel));
    if (mD){
      series = series.concat(band(mD.lo, mD.hi));
      series.push(line(fill(MV.condo, t), mD.c, COLOR.condo, 1, 1, dayFmt(mD.c_d), { id: "d-m-c", z: 4 }));
      series.push(line(fill(MV.sfr, t),   mD.s, COLOR.sfr,   1, 1, dayFmt(mD.s_d), { id: "d-m-s", z: 4 }));
    } else {
      series = series.concat(band(P.lo, P.hi));
    }
    series.push(usLine("d-us-c", MV.usCondo, P.condo, COLOR.condo, 1, !mD, dayFmt(P.condo_d)));
    series.push(usLine("d-us-s", MV.usSfr,   P.sfr,   COLOR.sfr,   1, !mD, dayFmt(P.sfr_d)));
  }
  const tip = tipBox();
  tip.formatter = function(ps){
    if (!ps.length) return "";
    const sub = function(s){ return '<div style="color:' + COLOR.faint + ';font-size:11px;margin:1px 0 5px">' + esc(s) + '</div>'; };
    const isDtp = ps.some(function(p){ return String(p.seriesId).indexOf("d-") === 0; });
    if (isDtp){
      const i = ps[0].dataIndex, D2 = COPY.dtp, MV = viewCopy(M);
      let h = '<div style="font-weight:700">' + esc(fill(D2.tipHead, { month: monthLabel(P.months[i]) })) + '</div>' + sub(C.tipDtp);
      const usC = fill(D2.tipCondo, { v: P.condo_d[i], lo: P.lo_d[i], hi: P.hi_d[i] }), usS = fill(D2.tipSfr, { v: P.sfr_d[i] });
      if (!M) return h + tipRow(COLOR.condo, COPY.condo, usC) + tipRow(COLOR.sfr, COPY.sfr, usS);
      if (mD){
        const t = { metro: M.n };
        h += tipRow(COLOR.condo, fill(MV.condo, t), fill(D2.tipCondo, { v: mD.c_d[i], lo: mD.lo_d[i], hi: mD.hi_d[i] })) +
             tipRow(COLOR.sfr, fill(MV.sfr, t), fill(D2.tipSfr, { v: mD.s_d[i] }));
      }
      return h + tipRow(COLOR.condo, MV.usCondo, usC) + tipRow(COLOR.sfr, MV.usSfr, usS);
    }
    let h = '<div style="font-weight:700">' + esc(monthLabel(ps[0].axisValue)) + '</div>' + sub(C.tipValues);
    ps.forEach(function(p){
      if (p.value == null) return;
      h += tipRow(p.color, p.seriesName, pctLabel(p.value - 100, 1));
    });
    return h;
  };
  return {
    height: L.height,
    rects: L.rects,
    notes: notes,
    option: {
      animationDuration: 300,
      title: [panelTitle(L.titles[0], C.panelValues, C.panelValuesSub), panelTitle(L.titles[1], C.panelDtp, C.panelDtpSub)],
      grid: L.grids,
      tooltip: tip,
      xAxis: [monthAxis(V.months, 0, narrow), monthAxis(P.months, 1, narrow)],
      yAxis: [valueAxis(0, bv, "", true), valueAxis(1, bd, "")],
      series: series
    }
  };
}

/* ----------------------------------------------------------------- render */
function render(){
  const el = document.getElementById("chart");
  const w = el.clientWidth || 600;
  const spec = S.view === "supply" ? supplyOption(w) : valuesOption(w);
  const M = curMetro(), C = COPY[S.view];
  el.style.height = spec.height + "px";
  el.setAttribute("aria-label", M ? fill(M.agg ? C.chartLabelSubset : C.chartLabelMetro, { metro: M.n }) : C.chartLabel);
  chart.resize();
  chart.dispatchAction({ type: "hideTip" });
  chart.setOption(spec.option, { notMerge: true });
  document.querySelectorAll("#view-seg button").forEach(function(b){
    const on = b.dataset.view === S.view;
    b.classList.toggle("active", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
  // Stat tiles (paintReadout, COPY.*.readout) removed from the page 2026-10-01
  // at Houston's request, to get readers to the charts sooner; kept in code.
  paintLegend();
  paintPanelNotes(spec);
  syncSelect();
}
// Supply view: the note for panel i (0 new listings, 1 sales) whose metro
// lines were withheld by the build's gate (status st).
function supplyNoteText(i, st){
  const C = COPY.supply;
  return fill(C.panelNote[st], i === 0 ? { measure: C.measureListings, units: C.unitsListings }
                                       : { measure: C.measureSales, units: C.unitsSales });
}
// Write and size the note for panel i, so the layout can reserve its height;
// placed by paintPanelNotes().
function measureNote(i, text, width){
  const el = document.getElementById("pnote-" + i);
  el.textContent = text;
  el.style.width = Math.round(width) + "px";
  el.hidden = false;
  return el.offsetHeight;
}
function paintPanelNotes(spec){
  [0, 1].forEach(function(i){
    const el = document.getElementById("pnote-" + i);
    const text = spec.notes && spec.notes[i];
    el.hidden = !text;
    if (!text) { el.textContent = ""; return; }
    const r = spec.rects[i];
    el.style.left = Math.round(r.left) + "px";
    el.style.top = Math.round(r.top) + "px";
  });
}
function syncSelect(){
  if (!metroChoices) return;
  const want = S.metro || "us";
  if (metroChoices.getValue(true) !== want) metroChoices.setChoiceByValue(want);
}
function paintNotes(){
  const M = curMetro();
  if (S.view === "supply"){
    if (M && M.agg){
      // Florida split: aggregate wording, and the split's method sentence
      setText("note", fill(COPY.supply.noteSubset, selTokens(M)));
      setText("method", COPY.method);
    } else if (M){
      const none = M.nl.st !== "ok" && M.sa.st !== "ok";
      setText("note", fill(none ? COPY.supply.noteMetroNone : COPY.supply.noteMetro, { metro: M.n }));
      setText("method", COPY.method);
    } else {
      setText("note", fill(COPY.supply.note));
      setText("method", COPY.method);
    }
    return;
  }
  const V = COPY.values;
  if (M && M.agg){
    setText("note", fill(V.noteSubset, Object.assign(selTokens(M), { err: M.dt.d.e })));
    setText("method", COPY.method);
  } else if (M){
    const mD = M.dt.st === "ok" ? M.dt : null;
    setText("note", fill(mD ? V.noteMetro : V.noteMetroNoDtp, { metro: M.n, err: mD ? mD.d.e : "" }));
    setText("method", COPY.method);
  } else {
    setText("note", fill(V.note) + " " + fill(COPY.dtp.note, { err: D.days.err }));
    setText("method", COPY.method);
  }
}

// Single entry point for any state change: redraw, rewrite the footnote, and
// only then report height, since both can change the page height.
function refresh(){
  render();
  paintNotes();
  if (window.__inmanEmbedSend) window.__inmanEmbedSend();
}

/* ------------------------------------------------------------------- init */
function init(){
  D = JSON.parse(document.getElementById("tool-data").textContent);
  const k = D.key;
  const abs1 = function(v){ return Math.abs(v).toFixed(1) + "%"; };
  TOKENS = {
    listings_month: monthLabel(D.meta.listings_through),
    sales_month:    monthLabel(D.meta.sales_through),
    n_nl: D.meta.n_nl, n_sales: D.meta.n_sales, n_dtp: D.meta.n_dtp,
    nl_condo_abs:       abs1(k.nl_condo_pct),
    nl_sfr_abs:         abs1(k.nl_sfr_pct),
    nl_sfr_conv_abs:    abs1(k.nl_sfr_conv_pct),
    sales_condo_abs:    abs1(k.sales_condo_pct),
    sales_sfr_abs:      abs1(k.sales_sfr_pct),
    sales_sfr_conv_abs: abs1(k.sales_sfr_conv_pct),
    dtp_condo: D.days.condo, dtp_condo_base: D.days.condo_base,
    dtp_sfr: D.days.sfr, dtp_sfr_base: D.days.sfr_base,
    dtp_sfr_conv: D.days.sfr_conv, dtp_sfr_conv_base: D.days.sfr_conv_base,
    floor_nl: D.metros.floor_nl, n_metros: D.metros.n, n_core: D.metros.n_core,
    n_metro_nl: D.metros.n_nl, n_metro_sa: D.metros.n_sa,
    // values view
    values_month: monthLabel(D.values.through), n_val: D.values.n,
    val_condo_abs:      abs1(D.values.key.condo_pct),
    val_sfr_abs:        abs1(D.values.key.sfr_pct),
    val_condo_conv_abs: abs1(D.values.key.conv_condo_pct),
    val_sfr_conv_abs:   abs1(D.values.key.conv_sfr_pct),
    dtp_tol: D.metros.dtp_tol, n_metro_dt: D.metros.n_dt,
    n_fl: D.subsets.n_fl
  };
  D.metros.rows.forEach(function(m){ BY_ID[m.id] = m; });
  // Florida split: registered like metros; the display name comes from COPY
  D.subsets.rows.forEach(function(m){ m.n = COPY.subsets[m.id].name; BY_ID[m.id] = m; });
  paintStatic();
  const ld = document.getElementById("loading"); if (ld) ld.remove();
  chart = echarts.init(document.getElementById("chart"), null, { renderer: "canvas" });

  document.querySelectorAll("#view-seg button").forEach(function(b){
    b.addEventListener("click", function(){
      if (b.dataset.view === S.view) return;
      S.view = b.dataset.view;
      refresh();
    });
  });
  // ?view=supply opens New listings and sales; anything else (including the
  // older ?view=dtp, and ?view=values) opens the default values view, which
  // now holds the days-to-pending panel.
  if (new URLSearchParams(location.search).get("view") === "supply") S.view = "supply";

  // Market selector: "United States" first, then the two Florida-split options
  // (2026-10-01), then the metros in the payload's order (households,
  // descending). The build lists only metros with at least one panel's lines
  // charted.
  const sel = document.getElementById("metro-select");
  metroChoices = new Choices(sel, {
    searchEnabled: true, searchResultLimit: 10, shouldSort: false, itemSelectText: "",
    allowHTML: false, searchPlaceholderValue: COPY.searchPlaceholder, noResultsText: COPY.noResults,
    fuseOptions: { includeScore: true, threshold: 0.3, ignoreLocation: true }
  });
  metroChoices.setChoices(
    [{ value: "us", label: COPY.metroUS, selected: true }].concat(D.subsets.rows.map(function(m){
      return { value: m.id, label: COPY.subsets[m.id].option };
    }), D.metros.rows.map(function(m){
      return { value: m.id, label: m.n };
    })), "value", "label", true);
  sel.addEventListener("change", function(){
    const v = sel.value && sel.value !== "us" && BY_ID[sel.value] ? sel.value : null;
    if (v === S.metro) return;
    S.metro = v;
    refresh();
  });
  const qm = new URLSearchParams(location.search).get("metro");      // ?metro=<CBSA code>, us-xfl or fl
  if (qm && BY_ID[qm]) S.metro = qm;

  refresh();
  // The panel notes are measured to lay out the metro view; measure again once
  // the web font has loaded (the fallback font sets text wider).
  if (document.fonts && document.fonts.ready)
    document.fonts.ready.then(function(){ if (S.metro) refresh(); });

  // Layout depends on width (side-by-side vs stacked panels), so a width
  // change goes back through refresh(), coalesced to one call per frame.
  // Watching the container (not just the window) also catches a scrollbar
  // appearing, which narrows the page without a window resize event.
  // Height changes (set by render itself) are ignored, so this cannot loop.
  const chartEl = document.getElementById("chart");
  let lastW = chartEl.clientWidth, raf = 0;
  const onWidth = function(){
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function(){
      const w = chartEl.clientWidth;
      if (Math.abs(w - lastW) > 1){ lastW = w; refresh(); }
    });
  };
  window.addEventListener("resize", onWidth);
  if (window.ResizeObserver) new ResizeObserver(onWidth).observe(chartEl);
}

/* ---------- self-sizing embed ----------
   House pattern (holiday-effect/index.html initEmbedHeight): the timed
   retries and the initial report call send() DIRECTLY, because browsers
   throttle requestAnimationFrame in an iframe that is not being painted
   (a below-the-fold loading="lazy" embed would otherwise never report).
   rAF is used only to coalesce high-frequency resize/observer events. */
function initEmbedHeight(){
  if(!document.documentElement.classList.contains('embed')) return;
  let last=0, raf=0;
  const send=()=>{ const h=Math.ceil(document.documentElement.getBoundingClientRect().height);
    if(h && Math.abs(h-last)>1){ last=h; try{ window.parent.postMessage({type:'inman-embed-height',height:h},'*'); }catch(e){} } };
  const schedule=()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(send); };
  window.addEventListener('resize',schedule);
  if(window.ResizeObserver) new ResizeObserver(schedule).observe(document.body);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(send);
  [0,300,800,1800,3000].forEach(ms=>setTimeout(send,ms));
  // exposed so a state change that alters page height can report immediately
  window.__inmanEmbedSend = send;
  send();
}

try { init(); }
catch (e) {
  const l = document.getElementById("loading");
  if (l) l.textContent = COPY.loadError;
  console.error(e);
}
initEmbedHeight();
})();
</script>
