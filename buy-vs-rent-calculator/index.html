             // holds (see AUTOPLAY) and a short event log for checking
             auto: true, autoWhy: null, dwellT: 0, dwellAt: 0, dwellLeft: AUTO_DWELL_MS, dwellStep: 0,
             holds: { hover: false, touch: false, focus: false, view: false, hidden: false, print: false }, log: [],
             // the step title's ellipsis (edit list 1): dots shown (0-3), and
             // whether the step's dots and frames have finished
             dots: 3, dotsDone: true, framesDone: true };

// ---- model: everything the chart draws, from the engine's yearly rows
function animModel(sim, N){
  // x-axis (Houston, 2026-10-06): the longest stay (30 years) unless the
  // trailing option pulls ahead after that, in which case the first
  // multiple of five after the crossover year. Late reversals: 30 years.
  const cx = sim.crossover, be = crossoverShown(cx, DEF.stayMax);
  const xMax = (cx.recross || be === null || be <= DEF.stayMax) ? Math.max(DEF.stayMax, N) : (Math.floor(be / 5) + 1) * 5;
  const rows = sim.years.slice(0, xMax);
  const nz = function(arr){ return arr.some(function(v){ return Math.abs(v) > 1e-7; }); };
  const slot = function(s){
    const o = s === "a" ? S.optA : S.optB, buy = isBuy(o), f = rows.map(function(r){ return r[s]; });
    const col = function(fn){ return f.map(fn); };
    // Cost components, cumulative to the year of sale. The full mortgage
    // payment (interest + principal) and the down payment count as costs;
    // the principal and down payment come back as equity.
    const comp = {
      down: col(z => z.down), closing: col(z => z.closing), agent: col(z => z.agent), points: col(z => z.points),
      mort: col(z => z.interest + z.principal),
      pmi: col(z => z.pmi), tax: col(z => z.tax), ins: col(z => z.ins), hoa: col(z => z.hoa),
      maint: col(z => z.maint), assess: col(z => z.assess), rent: col(z => z.rent), rins: col(z => z.rins),
      movein: col(z => z.moveIn), fees: col(z => z.fees)
    };
    // What comes back: equity = money put in (down payment + principal) +
    // appreciation (value - price); investment growth after tax; less the
    // costs to sell, paid from the sale (negative). Each layer LOWERS the
    // net cost by its amount (the costs to sell, negative, raise it).
    const pos = { putIn: col(z => buy ? z.putIn : 0), app: col(z => buy ? z.appreciation : 0),
                  growth: col(z => z.growth - z.gtax), sell: col(z => -z.selling) };
    // gains: anything stacks down from total paid (a purchase's equity, or
    // investment growth on money this option frees up)
    // cost: the net cost the chart plots, the engine's net with the sign
    // reversed (total paid - what comes back)
    // what the growth layer is: interest on savings, investment growth, or both
    const hasInv = f.some(z => z.basis > 0), hasSav = f.some(z => z.savBasis > 0);
    return { o: o, buy: buy, f: f, comp: comp, pos: pos, col: OPTION_COLOR[o], z: f[N - 1],
             growthKey: hasInv && hasSav ? "growthBoth" : (hasSav ? "growthSav" : "growth"),
             compList: COMP_KEYS.filter(k => nz(comp[k])), posList: POS_KEYS.filter(k => nz(pos[k])),
             gains: buy || nz(pos.growth), paid: col(z => z.paid), net: col(z => z.net), cost: col(z => -z.net) };
  };
  // gap = net A - net B (the engine's; > 0: A ahead); dgap = net cost A -
  // net cost B = -gap, the difference line of the last step (< 0: A ahead)
  const m = { N: N, xMax: xMax, be: be, cx: cx, rows: rows, years: rows.map(r => r.year), gap: rows.map(r => r.gap),
              dgap: rows.map(r => -r.gap), a: slot("a"), b: slot("b") };
  m.steps = stepList(m);
  // Shared drawing grid: each year, plus one point inside each segment (at
  // the crossing of the two nets if there is one, else the midpoint).
  m.xs = []; m.seg = [];
  for (let k = 0; k < rows.length; k++){
    m.xs.push(m.years[k]); m.seg.push([k, 0]);
    if (k < rows.length - 1){
      const g0 = m.gap[k], g1 = m.gap[k + 1];
      const w = (g0 > 0 && g1 < 0) || (g0 < 0 && g1 > 0) ? g0 / (g0 - g1) : 0.5;
      m.xs.push(m.years[k] + w); m.seg.push([k, w]);
    }
  }
  // Where the "Pulls ahead" line goes: the crossing inside the segment that
  // ends at the reported crossover year be (the trailing option is behind at
  // be - 1 and level or ahead at be), interpolated between the year-end
  // values. be is at least 2, since the trailing option is defined at year 1.
  m.beX = null;
  if (be !== null && be >= 2 && be <= rows.length){
    const g0 = m.gap[be - 2], g1 = m.gap[be - 1];
    m.beX = g0 === g1 ? be : (be - 1) + g0 / (g0 - g1);
  }
  // y-ranges: steps 1-5 span every layer edge of both options (the cost
  // stacks up to total paid, every partial stack of what comes back down
  // from it), both net costs and zero (niceRange starts from zero, so a net
  // gain below zero fits); step 6 spans the difference and zero.
  const all = [];
  [m.a, m.b].forEach(function(sl){
    let top = sl.paid.slice(); all.push(top, sl.cost);
    sl.posList.forEach(function(k){ top = top.map((t, i) => t - sl.pos[k][i]); all.push(top); });
  });
  m.y19 = niceRange(all); m.y10 = niceRange([m.dgap]);
  return m;
}
function niceRange(arrs){
  let lo = 0, hi = 0;
  arrs.forEach(a => a.forEach(v => { if (v < lo) lo = v; if (v > hi) hi = v; }));
  const span0 = Math.max(hi - lo, 1000);
  if (hi > 0) hi += 0.03 * span0;          // headroom, but never push an all-negative chart above zero
  if (lo < 0) lo -= 0.03 * span0;
  const raw = Math.max(hi - lo, 1000) / 5, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(f => f * mag).filter(s => s >= raw)[0];
  return { min: Math.floor(lo / step) * step, max: Math.max(Math.ceil(hi / step) * step, lo >= 0 ? step : 0), interval: step };
}
// A per-year array on the shared drawing grid (linear between years).
function fineArr(m, arr){ return m.seg.map(p => p[1] === 0 ? arr[p[0]] : arr[p[0]] * (1 - p[1]) + arr[p[0] + 1] * p[1]); }

// ---- the step list: one kind per step (see SKIPPED "TOTAL" STEP above)
function stepList(m){
  const L = ["aCosts"];
  if (m.a.gains) L.push("aBack");
  L.push("bCosts");
  if (m.b.gains) L.push("bBack");
  return L.concat(["compare", "diff"]);
}
function nSteps(){ return AN.m ? AN.m.steps.length : MAX_STEPS; }

// ---- frames: what each step plays, phase by phase
// A frame: a / b = [phase, bands in], cmp = comparison layers (0 none, 1
// shading, 2 + vertical lines, 3 + takeaway box), diff = the difference
// view; dur = the tween into it, gap = the wait before the next frame.
function frame(pa, ka, pb, kb, cmp, dur, gap){
  return { a: [pa, ka], b: [pb, kb], cmp: cmp, diff: false, dur: dur, gap: gap };
}
const EMPTY_FRAME = frame(1, 0, 0, 0, 0, STEP_MS, 0);   // before step 1 plays
function stepFrames(m, st){
  const F = [], nA = m.a.compList.length, pA = m.a.posList.length, nB = m.b.compList.length, pB = m.b.posList.length;
  const kind = m.steps[Math.max(0, Math.min(st, m.steps.length) - 1)];
  let k;
  if (kind === "aCosts"){
    for (k = 1; k <= nA; k++) F.push(frame(1, k, 0, 0, 0, SUB_MS, SUB_GAP));
    if (!m.a.gains) F.push(frame(4, 0, 0, 0, 0, PHASE_MS, PHASE_GAP));      // no gains: merge straight into A's net
  } else if (kind === "aBack"){
    F.push(frame(2, 0, 0, 0, 0, PHASE_MS, PHASE_GAP));                      // merge into Total paid
    for (k = 1; k <= pA; k++) F.push(frame(3, k, 0, 0, 0, SUB_MS, SUB_GAP)); // gains stack up
  } else if (kind === "bCosts"){
    if (m.a.gains) F.push(frame(4, 0, 0, 0, 0, PHASE_MS, PHASE_GAP));       // A collapses into its net
    for (k = 1; k <= nB; k++) F.push(frame(4, 0, 1, k, 0, SUB_MS, SUB_GAP)); // B's costs drop in
    if (!m.b.gains) F.push(frame(4, 0, 4, 0, 0, PHASE_MS, PHASE_GAP));      // no gains: merge straight into B's net
  } else if (kind === "bBack"){
    F.push(frame(4, 0, 2, 0, 0, PHASE_MS, PHASE_GAP));
    for (k = 1; k <= pB; k++) F.push(frame(4, 0, 3, k, 0, SUB_MS, SUB_GAP));
  } else if (kind === "compare"){
    if (m.b.gains) F.push(frame(4, 0, 4, 0, 0, PHASE_MS, PHASE_GAP));       // B collapses into its net
    F.push(frame(4, 0, 4, 0, 1, PHASE_MS, PHASE_GAP));                      // shading
    F.push(frame(4, 0, 4, 0, 2, PHASE_MS, PHASE_GAP));                      // Pulls ahead / Your stay
    F.push(frame(4, 0, 4, 0, 3, PHASE_MS, PHASE_GAP));                      // takeaway box
  } else {
    F.push({ a: ["diff", 0], b: ["diff", 0], cmp: 3, diff: true, dur: STEP_MS, gap: 0 });
  }
  return F;
}
function sameFrame(f, g){
  return f.a[0] === g.a[0] && f.a[1] === g.a[1] && f.b[0] === g.b[0] && f.b[1] === g.b[1] && f.cmp === g.cmp && f.diff === g.diff;
}
function frameAt(m, st, pi){
  if (st === 1 && pi === -1) return EMPTY_FRAME;
  const F = stepFrames(m, st);
  return pi == null ? F[F.length - 1] : F[Math.max(0, Math.min(pi, F.length - 1))];
}
function curFrame(){ return frameAt(AN.m, AN.step, AN.pi); }

// ---- geometry of one option at a phase: per-year lower/upper edge of every
// band, the option's line, the Total paid line, and which labels show.
// Hidden bands sit at zero thickness on the edge they will grow from (or
// have collapsed into); hidden lines sit there too, transparent.
// Net-cost orientation (2026-10-07): cost bands stack UP from zero (lo = the
// running total, hi = lo + the component); what comes back stacks DOWN from
// total paid (hi = the edge it hangs from, lo = hi - the layer, so hi - lo
// is the layer's signed amount; the costs to sell, negative, have lo > hi
// and push the line back up).
function slotGeom(m, s, ph, kk){
  const sl = m[s], Y = m.rows.length, g = { layer: {}, line: null, lineOp: 1, paid: null, paidOp: 0, labels: {} };
  const zeros = new Array(Y).fill(0);
  const at = arr => ({ lo: arr.slice(), hi: arr.slice() });
  const park = function(keys, arr){ keys.forEach(k => { if (!g.layer[k]) g.layer[k] = at(arr); }); };
  if (ph === 0){
    park(COMP_KEYS.concat(["total"], POS_KEYS), zeros); g.line = zeros.slice(); g.lineOp = 0; g.paid = zeros.slice();
  } else if (ph === 1){
    let cum = zeros.slice();
    sl.compList.forEach(function(k, j){
      if (j >= kk) return;
      const hi = cum.map((c, i) => c + sl.comp[k][i]);
      g.layer[k] = { lo: cum, hi: hi }; cum = hi; g.labels[k] = true;
    });
    park(COMP_KEYS, cum); g.layer.total = at(zeros); park(POS_KEYS, cum);
    g.line = cum.slice(); g.lineOp = kk > 0 ? 1 : 0; g.paid = cum.slice();
  } else if (ph === 2 || ph === 3){
    // The components merge into one block and the Total paid line, which
    // stays (labelled) while what comes back stacks down from it. The
    // option's own line fades out at the merge and returns at the bottom of
    // the stack, on the net cost.
    const P = sl.paid.slice();
    g.layer.total = { lo: zeros.slice(), hi: P };
    g.paid = P.slice(); g.paidOp = 1; g.labels.paid = true;
    park(COMP_KEYS, P);
    let top = P.slice();
    if (ph === 3){
      sl.posList.forEach(function(k, j){
        if (j >= kk) return;
        const lo = top.map((t, i) => t - sl.pos[k][i]);
        g.layer[k] = { lo: lo, hi: top }; top = lo; g.labels[k] = true;
      });
      if (kk >= sl.posList.length) g.labels.net = true;
    }
    park(POS_KEYS, top); g.line = top.slice(); g.lineOp = ph === 3 ? 1 : 0;
  } else {
    const T = ph === "diff" ? (s === "a" ? m.dgap.slice() : zeros.slice()) : sl.cost.slice();
    park(COMP_KEYS.concat(["total"], POS_KEYS), T); g.line = T; g.paid = T.slice();
    if (ph === 4) g.labels.net = true; else if (s === "a") g.labels.diff = true;
  }
  return g;
}

// ---- label helpers
let measureCtx = null;
function textWidth(t, font){
  if (!measureCtx) measureCtx = document.createElement("canvas").getContext("2d");
  measureCtx.font = font; return measureCtx.measureText(t).width;
}
function wrapText(t, font, maxW){
  const words = String(t).split(" "), lines = [];
  let cur = "";
  words.forEach(function(w){
    const nxt = cur ? cur + " " + w : w;
    if (cur && textWidth(nxt, font) > maxW){ lines.push(cur); cur = w; } else cur = nxt;
  });
  if (cur) lines.push(cur);
  return lines;
}
// Spread visible labels vertically so none overlap (keeps their order).
function spreadLabels(items, top, bottom){
  items.sort((p, q) => p.y0 - q.y0);
  for (let i = 0; i < items.length; i++){
    const min = i === 0 ? top + items[i].h / 2 : items[i - 1].ly + (items[i - 1].h + items[i].h) / 2 + 2;
    items[i].ly = Math.max(items[i].y0, min);
  }
  for (let i = items.length - 1; i >= 0; i--){
    const max = i === items.length - 1 ? bottom - items[i].h / 2 : items[i + 1].ly - (items[i].h + items[i + 1].h) / 2 - 2;
    items[i].ly = Math.min(items[i].ly, max);
  }
}
function compactMoney(v){
  const a = Math.abs(v), sgn = v < 0 ? "−" : "";
  if (a === 0) return "$0";
  return a >= 1e6 ? sgn + "$" + (+(a / 1e6).toFixed(a % 1e6 === 0 ? 0 : 1)) + "M" : sgn + "$" + Math.round(a / 1e3) + "K";
}
function roundAmt(v){ return moneyRound(v, DEF.round); }
// A net cost, rounded, for captions and the takeaway box: "$463,000", or
// "−$12,000 (a net gain)" below zero (COPY.anim.costAmt / gainAmt).
function costAmt(v){
  const r = Math.round(Math.abs(v) / DEF.round) * DEF.round;
  return fill(r > 0 && v < 0 ? COPY.anim.gainAmt : COPY.anim.costAmt, { amt: roundAmt(v) });
}
// The same, to the dollar, for the tooltip.
function costTip(v){ return fill(Math.round(v) < 0 ? COPY.anim.gainAmt : COPY.anim.costAmt, { amt: money(v) }); }
function signedAmt(v){
  const r = Math.round(Math.abs(v) / DEF.round) * DEF.round;
  return (r === 0 ? "" : (v < 0 ? "−\u2060" : "+\u2060")) + "$" + r.toLocaleString("en-US");
}
// Are both options on the chart in this frame? (Then band labels name their option.)
function bothShown(fr){ return fr.a[0] !== 0 && fr.b[0] !== 0; }
// A band's label: the plain layer name, or "Rent apartment: rent" when both options are shown.
function layerName(sl, k, both){
  const A = COPY.anim, kk = k === "growth" ? sl.growthKey : k;
  return both ? fill(A.layerLabel, { Col: optCopy(sl.o).col, layer: A.layer[kk] }) : A.labels[kk];
}
function posColor(sl, k){
  if (k === "growth") return GROWTH_COLOR;
  if (k === "sell") return sellFill();
  return EQUITY_COLOR[sl.o] ? EQUITY_COLOR[sl.o][k] : TOTAL_COLOR;
}

// ---- the marker labels above the plot (Houston, 2026-10-07)
// "Your stay" and "{Col} pulls ahead" share the strip above the plot, with
// the y-axis name at the left end of its first row. Each label gets a left
// edge and a row (0 nearest the plot, 1 above it). Candidates per label:
// right of its line, left of it, or centred over it and slid sideways to fit;
// on row 0 or row 1. Hard rules: inside [2, plotR], i.e. clear of the canvas
// edge and of the line labels in the right margin (inside [2, W - 2] only if
// nothing else fits); on row 0, clear of the left margin, where the axis
// name and the top tick label sit, and 6px past the axis so it never reads
// as one phrase with the name (row 1 is above both and may use it); and
// at least MARK_GAP px from the other label when they share a row. Of the
// layouts that pass, the cheapest wins: 1 for not taking the side away from
// the other line, 2 for centring, about 5 for a second row (it lowers the
// plot top by MARK_ROW px), and 2.5 for reaching into the left margin on row
// 1 (stacked over the axis name, it reads as a heading for it); "Your stay"
// pays a little more to move up, since it shows in every step. The
// crossing's label is laid out whenever the crossing is on the chart, even
// in the steps before it shows, so neither label moves when it appears.
// HINT_H is the height of a corner hint's box (see placeTakeaway()).
const MARK_ROW = 16, MARK_GAP = 8, HINT_H = 18;   // 16: row 1 clears the axis name below it
const X_NAME_H = 42;                               // the plot's bottom margin: tick labels (26px) + the x-axis name
const MARK_FONT = "600 11px " + CHART_FONT;
function markLayout(m, N, beOk, stayTxt, beTxt, px, plotL, plotR, W){
  const later = beOk && m.beX > N;
  const items = [{ x: px(N), w: textWidth(stayTxt, MARK_FONT), pref: later ? -1 : 1, up: 5.5 }];
  if (beOk) items.push({ x: px(m.beX), w: textWidth(beTxt, MARK_FONT), pref: later ? 1 : -1, up: 5 });
  const solve = function(maxR){
    const C = items.map(function(it){
      const out = [];
      [1, -1, 0].forEach(function(sd){
        const l = sd > 0 ? it.x + 4 : (sd < 0 ? it.x - 4 - it.w : Math.min(Math.max(it.x - it.w / 2, 2), maxR - it.w));
        if (l < 2 - 1e-6 || l + it.w > maxR + 1e-6) return;
        [0, 1].forEach(function(row){
          if (!row && l < plotL + 6) return;   // row 0 stays out of the left margin (the axis name, the top tick label)
          out.push({ l: l, r: l + it.w, row: row,
                     cost: (sd === 0 ? 2 : (sd === it.pref ? 0 : 1)) + (row ? it.up : 0) + (row && l < plotL ? 2.5 : 0) });
        });
      });
      return out;
    });
    let best = null;
    const walk = function(i, picked, cost){
      if (i === items.length){ if (!best || cost < best.cost - 1e-9) best = { cost: cost, picked: picked.slice() }; return; }
      C[i].forEach(function(c){
        if (picked.some(p => p.row === c.row && c.l < p.r + MARK_GAP && p.l < c.r + MARK_GAP)) return;
        picked.push(c); walk(i + 1, picked, cost + c.cost); picked.pop();
      });
    };
    walk(0, [], 0);
    return best;
  };
  const best = solve(plotR) || solve(W - 2);
  // last resort (a chart too narrow for either rule): one row each, centred
  const lay = best ? best.picked.map(c => ({ l: c.l, row: c.row }))
                   : items.map((it, i) => ({ l: Math.max(2, Math.min(it.x - it.w / 2, W - 2 - it.w)), row: i }));
  lay.forEach(c => { c.intoMargin = c.row === 0 && c.l < plotL; });
  return { stay: lay[0], be: lay[1] || lay[0], rows: 1 + Math.max.apply(null, lay.map(c => c.row)) };
}

// ---- render the current frame (AN.step, AN.pi) with a tween of `dur` ms
function animRender(dur){
  if (!chart || !AN.m || $("outputs").hidden) return;
  const m = AN.m, fr = curFrame(), N = m.N, W = chart.getWidth(), H = chart.getHeight(), A = COPY.anim;
  if (!W || !H) return;
  const narrow = W < 480;
  const gridL = 58, gridR = narrow ? 94 : 136, plotL = gridL, plotR = W - gridR;
  const px = x => plotL + x / m.xMax * (plotR - plotL);
  // The marker labels above the plot ("Your stay", "{Col} pulls ahead") are
  // laid out first: when they need two rows, the plot starts one row lower.
  // The layout depends only on the inputs and the width, never on the step,
  // so the plot top and the labels hold still through every step.
  const beX = m.beX;
  const beOk = beX !== null && beX <= m.xMax && Math.abs(beX - N) > 1e-9;
  const overSl = m.cx.overtaker === "A" ? m.a : m.b;
  const stayTxt = COPY.chart.markStay, beTxt = fill(COPY.chart.markBe, { Col: optCopy(overSl.o).col });
  const mk = markLayout(m, N, beOk, stayTxt, beTxt, px, plotL, plotR, W);
  // bottom: the tick labels plus the x-axis name, "Years after purchase"
  // (edit list 1), centred under the plot
  const grid = { left: gridL, right: gridR, top: 24 + (mk.rows > 1 ? MARK_ROW : 0), bottom: X_NAME_H };
  const R = fr.diff ? m.y10 : m.y19;
  const plotT = grid.top, plotB = H - grid.bottom;
  const py = v => plotT + (R.max - v) / (R.max - R.min) * (plotB - plotT);
  const geo = { a: slotGeom(m, "a", fr.a[0], fr.a[1]), b: slotGeom(m, "b", fr.b[0], fr.b[1]) };
  const last = m.rows.length - 1, fx = m.xs, T = ["shape", "style"], TXY = ["x", "y", "shape", "style"];
  const ink = "#1b1f3b";

  // labels at the right-hand end, laid out together so none overlap
  const labs = {};
  const addLab = function(series, o){ (labs[series] = labs[series] || []).push(o); return o; };
  const mkLab = function(series, text, color, isLine, vis, anchor, textInk){
    const fs = isLine ? 11.5 : 11, fw = isLine ? 700 : 500, lh = isLine ? 14 : 13;
    const font = fw + " " + fs + "px " + CHART_FONT;
    const lines = wrapText(text, font, grid.right - 8 - 14 - 2);
    return addLab(series, { text: lines.join("\n"), h: lines.length * lh, color: color, line: isLine, vis: vis, op: vis ? 1 : 0,
                            y0: py(anchor), ink: textInk || ink, fs: fs, fw: fw, lh: lh });
  };
  ["a", "b"].forEach(function(s){
    const g = geo[s], sl = m[s], mid = L => (L.lo[last] + L.hi[last]) / 2, both = bothShown(fr), Col = optCopy(sl.o).col;
    COMP_KEYS.forEach(k => mkLab(s + "_" + k, layerName(sl, k, both), COST_COLOR[k], false, !!g.labels[k], mid(g.layer[k])));
    POS_KEYS.forEach(k => mkLab(s + "_" + k, layerName(sl, k, both), posColor(sl, k), false, !!g.labels[k], mid(g.layer[k])));
    mkLab(s + "_paid", fill(A.paidLabel, { Col: Col }), PAID_COLOR, true, !!g.labels.paid, g.paid[last], PAID_COLOR);
    mkLab(s + "_line", fill(sl.gains ? A.netLabel : A.netPaidLabel, { Col: Col }), sl.col, true, !!g.labels.net, g.line[last], sl.col);
    if (s === "a") mkLab("a_line", fill(A.diffLabel, { A: Col, b: optCopy(m.b.o).col.toLowerCase() }), sl.col, true, !!g.labels.diff, g.line[last], sl.col);
  });
  const vis = [];
  Object.keys(labs).forEach(id => labs[id].forEach(L => { L.x = plotR + 8; if (L.vis) vis.push(L); else L.ly = Math.min(Math.max(L.y0, 6), H - 6); }));
  spreadLabels(vis, 4, plotB + 10);
  const labelEl = function(L){
    return { type: "group", x: L.x, y: L.ly, transition: ["x", "y"], children: [
      { type: "rect", shape: L.line ? { x: 0, y: -1.5, width: 10, height: 3 } : { x: 0.5, y: -4.5, width: 9, height: 9 },
        style: { fill: L.color, stroke: L.line ? null : "rgba(22,26,72,.3)", lineWidth: L.line ? 0 : 0.6, opacity: L.op }, transition: T },
      { type: "text", x: 14, y: 0, style: { text: L.text, fill: L.ink, fontFamily: CHART_FONT, fontSize: L.fs, fontWeight: L.fw,
          lineHeight: L.lh, verticalAlign: "middle", align: "left", opacity: L.op }, transition: T } ] };
  };
  const coordPts = (api, arr) => arr.map((v, i) => api.coord([fx[i], v]));
  const base = { type: "custom", silent: true, clip: false, tooltip: { show: false } };

  // a band: per-year edges as data (read back by checkAnim), drawn on the shared grid
  const band = function(id, z, lo, hi, color, op, loF, hiF){
    loF = loF || fineArr(m, lo); hiF = hiF || fineArr(m, hi);
    return Object.assign({ id: id, z: z, data: m.years.map((y, i) => [y, lo[i], hi[i]]),
      renderItem: function(p, api){
        if (p.dataIndex !== 0) return null;
        return { type: "group", children: [{ type: "polygon", shape: { points: coordPts(api, hiF).concat(coordPts(api, loF).reverse()) },
          style: { fill: color, opacity: op }, transition: T }].concat((labs[id] || []).map(labelEl)) };
      } }, base);
  };
  const lineSer = function(id, z, v, color, op, width, dash){
    const vF = fineArr(m, v);
    return Object.assign({ id: id, z: z, data: m.years.map((y, i) => [y, v[i]]),
      renderItem: function(p, api){
        if (p.dataIndex !== 0) return null;
        return { type: "group", children: [{ type: "polyline", shape: { points: coordPts(api, vF) },
          style: { stroke: color, lineWidth: width, fill: null, opacity: op, lineJoin: "round", lineCap: dash ? "butt" : "round",
                   lineDash: dash || null }, transition: T }]
          .concat((labs[id] || []).map(labelEl)) };
      } }, base);
  };
  const dotSer = function(id, z, v, color, op){
    return Object.assign({ id: id, z: z, data: [[N, v]],
      renderItem: function(p, api){
        const c = api.coord([N, v]);
        return { type: "circle", shape: { cx: c[0], cy: c[1], r: 4.5 }, style: { fill: color, stroke: "#fff", lineWidth: 1.5, opacity: op }, transition: T };
      } }, base);
  };

  const series = [];
  // shading between the two net-cost lines, in the colour of the option
  // ahead, i.e. the LOWER line (step 5 from its second phase, and step 6):
  // band_a runs from A's line up to the higher line, so it has thickness
  // only where A is lower; band_b likewise for B
  const laF = fineArr(m, geo.a.line), lbF = fineArr(m, geo.b.line);
  const hiF = laF.map((v, i) => Math.max(v, lbF[i]));
  const hiY = geo.a.line.map((v, i) => Math.max(v, geo.b.line[i]));
  const shade = fr.cmp >= 1 ? 0.2 : 0;
  series.push(band("band_a", 1, geo.a.line, hiY, m.a.col, shade, laF, hiF));
  series.push(band("band_b", 1, geo.b.line, hiY, m.b.col, shade, lbF, hiF));
  ["a", "b"].forEach(function(s){
    const g = geo[s], sl = m[s];
    COMP_KEYS.forEach(k => series.push(band(s + "_" + k, 2, g.layer[k].lo, g.layer[k].hi, COST_COLOR[k], 1)));
    series.push(band(s + "_total", 2, g.layer.total.lo, g.layer.total.hi, TOTAL_COLOR, 1));
    POS_KEYS.forEach(k => series.push(band(s + "_" + k, 2, g.layer[k].lo, g.layer[k].hi, posColor(sl, k), 1)));
  });
  // zero line
  series.push(Object.assign({ id: "zero", z: 3, data: [[0, 0]],
    renderItem: function(p, api){
      const a = api.coord([0, 0]), b = api.coord([m.xMax, 0]);
      return { type: "polyline", shape: { points: [a, b] }, style: { stroke: "#9aa0b8", lineWidth: 1, fill: null }, transition: T };
    } }, base));
  // last step: "A costs more" in the top-left corner and "A costs less" in
  // the bottom-left corner (the line is net cost A - net cost B), above the
  // lines on a white backing (a hint only shows when its side of zero is on
  // the chart). Each hint takes the colour of the shading on its side of
  // zero (Houston, 2026-10-07): above zero B is cheaper, so B's colour;
  // below zero, A's. As text, through OPTION_INK (4.5:1 or better on white).
  // Their boxes are passed to placeTakeaway(), which keeps the box off them.
  const hintFont = "600 10.5px " + CHART_FONT, colA = optCopy(m.a.o).col;
  const hints = [
    { txt: fill(A.zoneA, { Col: colA }), col: OPTION_INK[m.b.o], y: plotT + 3, va: "top", on: R.max > 0 },
    { txt: fill(A.zoneB, { Col: colA }), col: OPTION_INK[m.a.o], y: plotB - 3, va: "bottom", on: R.min < 0 }];
  hints.forEach(function(h){
    const w = textWidth(h.txt, hintFont) + 8;
    h.box = { l: plotL + 5, r: plotL + 5 + w, t: h.va === "top" ? h.y : h.y - HINT_H, b: h.va === "top" ? h.y + HINT_H : h.y };
  });
  series.push(Object.assign({ id: "zones", z: 7, data: [[0, 0]],
    renderItem: function(){
      const hint = h => ({ type: "text", x: plotL + 5, y: h.y, transition: TXY,
        style: { text: h.txt, fill: h.col, fontFamily: CHART_FONT, fontSize: 10.5, fontWeight: 600, verticalAlign: h.va, align: "left",
                 opacity: fr.diff && h.on ? 1 : 0, backgroundColor: "rgba(255,255,255,.88)", padding: [2, 4] } });
      return { type: "group", children: hints.map(hint) };
    } }, base));
  // vertical lines: the reader's sale year (all steps; full strength from
  // step 5's third phase) and the crossing (from then on, when shown and
  // within range), at the interpolated crossing point, not a whole year.
  // Each label sits where markLayout() put it: lay.l is its left edge (in
  // pixels), lay.row its row above the plot (0 nearest the plot).
  const beCol = m.cx.overtaker === "A" ? m.a.col : (m.cx.overtaker === "B" ? m.b.col : "#5b6180");
  const mark = function(id, x, color, op, dash, txt, lay){
    return Object.assign({ id: id, z: 3, data: [[x, 0]],
      renderItem: function(p, api){
        const t = api.coord([x, R.max]), b = api.coord([x, R.min]);
        return { type: "group", children: [
          { type: "line", shape: { x1: t[0], y1: t[1], x2: b[0], y2: b[1] }, style: { stroke: color, lineWidth: 1, lineDash: dash, opacity: op }, transition: T },
          { type: "text", x: lay.l, y: t[1] - 5 - lay.row * MARK_ROW, transition: TXY,
            style: { text: txt, fill: color, fontFamily: CHART_FONT, fontSize: 11, fontWeight: 600, align: "left",
                     verticalAlign: "bottom", opacity: op } }] };
      } }, base);
  };
  // The y-axis name sits in the left margin, level with the marker labels'
  // first row: it fades out while a shown marker label on that row reaches
  // into the margin. Since 2026-10-07 markLayout() keeps row 0 out of the
  // margin, so this only fires on its last-resort layout (a chart too
  // narrow for any other), kept as a safety net.
  const nameHidden = mk.stay.intoMargin || (fr.cmp >= 2 && beOk && mk.be.intoMargin);
  // the name itself, right-aligned at the axis: its gap to the axis (4px)
  // shrinks so a long name ("Difference" on a phone) stays inside the canvas
  const axisName = fr.diff ? A.axisDiff : ([fr.a[0], fr.b[0]].every(ph => ph === 0 || ph === 1 || ph === 2) ? A.axisCost : A.axisNet);
  const namePad = Math.max(0, Math.min(4, Math.floor(plotL - 2 - textWidth(axisName, MARK_FONT))));
  series.push(mark("mk_stay", N, "#161a48", fr.cmp >= 2 ? 1 : 0.45, null, stayTxt, mk.stay));
  series.push(mark("mk_cross", beOk ? beX : N, beCol, fr.cmp >= 2 && beOk ? 1 : 0, [4, 3], beTxt, mk.be));
  // the two option lines (running total, then net), the two Total paid
  // lines (dashed, above the bands and the option lines), and the
  // sale-year dots
  ["a", "b"].forEach(function(s){
    const g = geo[s], sl = m[s], diffB = s === "b" && fr.diff;
    series.push(lineSer(s + "_line", 4, g.line, sl.col, g.lineOp, diffB ? 2 : 2.5));
  });
  ["a", "b"].forEach(function(s){
    const g = geo[s];
    series.push(lineSer(s + "_paid", 5, g.paid, PAID_COLOR, g.paidOp, 2, [6, 4]));
  });
  ["a", "b"].forEach(function(s){
    const g = geo[s], sl = m[s];
    series.push(dotSer(s + "_dot", 6, g.line[N - 1], sl.col, s === "b" && fr.diff ? 0 : g.lineOp));
  });
  // invisible carrier for the axis tooltip
  series.push({ id: "tip", type: "line", z: 0, data: m.years.map(y => [y, 0]), symbol: "none", lineStyle: { opacity: 0 },
                emphasis: { disabled: true }, animation: false });

  const grey = "#5b6180";
  chart.setOption({
    animation: !AN.reduced && dur > 0,
    animationDuration: dur, animationDurationUpdate: dur, animationEasing: ANIM_EASE, animationEasingUpdate: ANIM_EASE,
    textStyle: { fontFamily: CHART_FONT },
    grid: grid,
    tooltip: { trigger: "axis", confine: true, axisPointer: { type: "line", lineStyle: { color: "#c5cbda" } },
               formatter: function(ps){
                 const t = (ps || []).filter(p => p.seriesId === "tip")[0];
                 return t ? animTip(t.value[0]) : "";
               } },
    xAxis: { type: "value", min: 0, max: m.xMax, interval: m.xMax > 40 ? 10 : 5,
             name: COPY.chart.axisX, nameLocation: "middle", nameGap: 23,
             nameTextStyle: { color: grey, fontSize: 11, fontWeight: 600 },
             axisLabel: { color: grey }, axisLine: { onZero: false, lineStyle: { color: "#ccd2e2" } }, axisTick: { lineStyle: { color: "#ccd2e2" } },
             splitLine: { show: false } },
    // y-axis name: "Cost" while only costs are on the chart (every shown
    // option in phase 1 or 2), "Net cost" once a net-cost line is shown,
    // "Difference" in the last step; right-aligned above the tick labels, in
    // the left margin
    yAxis: { type: "value", min: R.min, max: R.max, interval: R.interval,
             name: axisName,
             nameLocation: "end", nameGap: 9,
             nameTextStyle: { color: nameHidden ? "rgba(91,97,128,0)" : grey, fontSize: 11, fontWeight: 600, align: "right", padding: [0, namePad, 0, 0] },
             axisLabel: { color: grey, formatter: compactMoney }, splitLine: { lineStyle: { color: "#eef0f5" } } },
    series: series
  }, { notMerge: false });
  placeTakeaway(px, py, plotL, plotR, plotT, plotB, W, dur, fr.diff ? hints.filter(h => h.on).map(h => h.box) : []);
  checkAnim();
}

// The takeaway box at the sale year (step 5's last phase, and step 6). It is
// always positioned, so it fades in where it belongs. `keep` lists boxes it
// must stay off ({l, r, t, b} in pixels): the corner hints shown in the last
// step.
function placeTakeaway(px, py, plotL, plotR, plotT, plotB, W, dur, keep){
  const m = AN.m, N = m.N, fr = curFrame(), tk = $("takeaway"), B = COPY.anim.box, z = m.rows[N - 1];
  const oa = optCopy(m.a.o), ob = optCopy(m.b.o), gap = z.gap, wash = Math.abs(gap) < washBand(z);
  const leadSl = gap >= 0 ? m.a : m.b;
  const row = (sl, oc, v) => '<div class="tk-r"><span><span class="sw" style="background:' + sl.col + '"></span>' + esc(oc.col) +
    '</span><span>' + esc(costAmt(v)) + '</span></div>';
  // each option's net cost; the leader is the lower one (gap >= 0: A)
  tk.innerHTML = '<div class="tk-h">' + esc(fill(B.head, { n: N, yrs: yrsWord(N) })) + '</div>' +
    row(m.a, oa, -z.a.net) + row(m.b, ob, -z.b.net) +
    '<div class="tk-m" style="color:' + (wash ? "#1b1f3b" : leadSl.col) + '">' +
    esc(wash ? B.even : fill(B.ahead, { Col: optCopy(leadSl.o).col, amt: roundAmt(gap) })) + '</div>';
  tk.style.borderLeftColor = wash ? "#5b6180" : leadSl.col;
  tk.classList.toggle("on", fr.cmp >= 3);
  const w = tk.offsetWidth, h = tk.offsetHeight, xN = px(N);
  // Candidate spots (Houston, 2026-10-07): either side of the sale-year
  // line, against either edge of the plot, or just right of the corner
  // hints; at the top, the bottom, just inside a corner hint, or on a 12px
  // ladder in between; kept inside the plot (clear of the line labels on the
  // right). Each spot is scored, lowest first: covering a line at the sale
  // year (either dot; never, if any spot avoids it), covering a corner hint
  // (likewise), then the number of points of the two lines (as drawn in step
  // 5 or 6) it covers. Ties go to the spot nearest an edge of the plot and
  // the sale-year line (12px from the line counting the same as 12px from
  // the edge). On phones the box spans most of the plot's width, so it
  // mostly moves up and down; on desktop it can also sit beside a hint.
  keep = keep || [];
  const la = fineArr(m, fr.diff ? m.dgap : m.a.cost), lb = fineArr(m, fr.diff ? m.dgap.map(() => 0) : m.b.cost);
  const pts = [];
  m.xs.forEach((x, i) => { pts.push([px(x), py(la[i])], [px(x), py(lb[i])]); });
  const stay = [[xN, py(la[m.xs.indexOf(N)])], [xN, py(lb[m.xs.indexOf(N)])]];
  const loX = plotL + 2, hiX = Math.max(loX, plotR - 2 - w);
  const topLo = plotT + 4, topHi = Math.max(topLo, plotB - h - 4);
  const clampX = x => Math.min(Math.max(x, loX), hiX), clampY = y => Math.min(Math.max(y, topLo), topHi);
  const xsC = [xN + 10, xN - 10 - w, loX, hiX].concat(keep.map(k => k.r + 6)).map(clampX);
  const ysC = [topLo, topHi];
  keep.forEach(k => { ysC.push(clampY(k.b + 4), clampY(k.t - 4 - h)); });
  for (let y = topLo + 12; y < topHi; y += 12) ysC.push(y);
  const inBox = (p, left, top, pad) => p[0] >= left - pad && p[0] <= left + w + pad && p[1] >= top - pad && p[1] <= top + h + pad;
  let best = null;
  xsC.forEach(function(left){
    ysC.forEach(function(top){
      const onStay = stay.filter(p => inBox(p, left, top, 8)).length;
      const onHint = keep.filter(k => left < k.r + 4 && k.l < left + w + 4 && top < k.b + 4 && k.t < top + h + 4).length;
      const hit = pts.filter(p => inBox(p, left, top, 4)).length;
      const cost = onStay * 1e6 + onHint * 1e4 + hit;
      const tie = Math.min(top - topLo, topHi - top) + Math.min(Math.abs(left - xN), Math.abs(left + w - xN));
      if (!best || cost < best.cost || (cost === best.cost && tie < best.tie)) best = { left: left, top: top, cost: cost, tie: tie };
    });
  });
  const left = best.left, top = best.top;
  // first placement, resizes and reduced motion: jump straight there
  const jump = !tk.dataset.placed || !dur || AN.reduced;
  if (jump) tk.style.transition = "none";
  tk.style.transform = "translate(" + Math.round(left) + "px," + Math.round(top) + "px)";
  if (jump){ void tk.offsetWidth; tk.style.transition = ""; }
  tk.dataset.placed = "1";
}

// Tooltip: what the current frame shows, for the hovered year. Net-cost
// orientation: costs and total paid are plain amounts; each layer of what
// comes back is signed by how it moves the line (money put in "−$X", the
// costs to sell "+$X"); a net cost is plain, or "−$X (a net gain)"; the
// difference is signed (below zero: A costs less).
function animTip(year){
  const m = AN.m, fr = curFrame(), i = year - 1, r = m.rows[i], A = COPY.anim, C = COPY.chart;
  if (!r) return "";
  const out = ["<b>" + esc(fill(C.tipYear, { y: year })) + "</b>"];
  const item = (col, label, txt) => out.push('<span style="display:inline-block;width:8px;height:8px;border-radius:1px;margin-right:5px;background:' +
    (typeof col === "string" ? col : "repeating-linear-gradient(45deg,#161a48 0 1px,#fff 1px 3px)") + '"></span>' +
    esc(label) + ": " + esc(txt));
  const both = bothShown(fr);
  ["a", "b"].forEach(function(s){
    const ph = fr[s][0], kk = fr[s][1], sl = m[s], oc = optCopy(sl.o);
    if (ph === 0 || ph === "diff") return;
    if (ph === 1) sl.compList.forEach((k, j) => { if (j < kk) item(COST_COLOR[k], layerName(sl, k, both), money(sl.comp[k][i])); });
    if (ph === 2 || ph === 3) item(PAID_COLOR, fill(A.paidLabel, { Col: oc.col }), money(sl.paid[i]));
    if (ph === 3) sl.posList.forEach((k, j) => { if (j < kk) item(posColor(sl, k), layerName(sl, k, both), signedMoney(-sl.pos[k][i])); });
    if ((ph === 3 && kk >= sl.posList.length) || ph === 4) item(sl.col, fill(sl.gains ? A.netLabel : A.netPaidLabel, { Col: oc.col }), costTip(sl.cost[i]));
  });
  // the option ahead is the one with the lower net cost (gap >= 0: A)
  if (fr.cmp >= 1 && !fr.diff) out.push(esc(Math.round(r.gap) === 0 ? C.tipEven : fill(C.tipAhead, { A: optCopy(r.gap >= 0 ? m.a.o : m.b.o).col, amt: money(r.gap) })));
  if (fr.diff) item(m.a.col, fill(A.tip.diff, { A: optCopy(m.a.o).col, B: optCopy(m.b.o).col.toLowerCase() }), signedMoney(m.dgap[i]));
  return out.join("<br>");
}

// ---- captions (COPY.anim), one per step, covering every phase it plays
function joinList(items){
  if (items.length <= 1) return items.join("");
  return items.slice(0, -1).join(", ") + " " + COPY.anim.and + " " + items[items.length - 1];
}
// "What comes back" for one option (steps 2 and 4): its total paid, then
// each layer that stacks down from it, the money left over, and the net cost.
function backCopy(sl, N, Y){
  const A = COPY.anim, z = sl.z, S1 = cap(optCopy(sl.o).gerund);
  let text = fill(A.total, { paidLabel: fill(A.paidLabel, { Col: optCopy(sl.o).col }), paid: roundAmt(z.paid), n: N, yrs: Y });
  text += sl.buy ? fill(A.backBuy, { putIn: roundAmt(z.putIn), app: signedAmt(z.appreciation) }) : fill(A.backRent, { S: S1 });
  const g = z.growth - z.gtax;
  // a growth layer can exist in later years while the sale-year amount rounds to $0: say so rather than "adds $0"
  const up = sl.growthKey === "growthBoth" ? A.growthUpBoth : (sl.growthKey === "growthSav" ? A.growthUpSav : A.growthUp);
  // (money freed up by the sale whose growth still rounds to $0: say what was done with it)
  if (sl.posList.indexOf("growth") >= 0) text += Math.round(Math.abs(g) / DEF.round) !== 0
    ? fill(useWord({ t: g >= 0 ? up : A.growthDown }, "t"), { growth: roundAmt(g) })
    : (z.basis > 0 || z.savBasis > 0 ? fill(A.growthSmall, { use: useWord(A.growthUse, sl.growthKey), amt: money(DEF.round) }) : A.growthLater);
  else if (!sl.buy) text += A.nothingBack;
  if (sl.posList.indexOf("sell") >= 0) text += fill(A.sellCut, { sell: roundAmt(z.selling) });
  text += leftCopy(sl);
  if (sl.posList.length) text += fill(A.backNet, { net: costAmt(-z.net) });
  return text;
}
// The money left over by one option, if any: spent (z.cash, the engine's
// cash kept, is always 0 now that the page no longer offers it; added in
// anyway, since it would be counted the same way).
function leftCopy(sl){
  const A = COPY.anim, z = sl.z, left = z.cash + z.spent;
  // nothing to say when it rounds to $0 (2026-10-07: was "Money left over: $0")
  if (Math.round(left / DEF.round) === 0) return "";
  return fill(A.leftover, { left: roundAmt(left), use: A.leftSpent });
}
// An option with nothing coming back: its bands merge straight into its
// net-cost line, in the step its costs build up.
function mergeCopy(sl){
  const A = COPY.anim;
  return fill(A.mergeNet, { label: fill(A.netPaidLabel, { Col: optCopy(sl.o).col }), S: cap(optCopy(sl.o).gerund),
                            net: costAmt(-sl.z.net) }) + leftCopy(sl);
}
// One option's net cost in words (a net gain if below zero).
function netCopy(sl, N, Y, short){
  const A = COPY.anim, cost = -sl.z.net, r = Math.round(Math.abs(cost) / DEF.round) * DEF.round;
  const t = short ? [A.netEvenShort, A.netCostShort, A.netGainShort] : [A.netEven, A.netCost, A.netGain];
  return fill(r === 0 ? t[0] : (cost > 0 ? t[1] : t[2]), { S: cap(optCopy(sl.o).gerund), amt: roundAmt(cost), n: N, yrs: Y });
}
// A step's title in parts (edit list 1): main, then the ellipsis (dots:
// "anim" = its dots appear one by one as the step plays, "static" = all
// shown, null = none), then rest. title = the same as plain text.
function stepTitle(m, st){
  const Tt = COPY.anim.titles, kind = m.steps[st - 1];
  const sl = kind === "aCosts" || kind === "aBack" ? m.a : (kind === "bCosts" || kind === "bBack" ? m.b : null);
  let parts;
  if (!sl) parts = { main: kind === "compare" ? Tt.compare : Tt.diff, dots: null, rest: "" };
  else {
    const main = fill(Tt.pay, { S: cap(optCopy(sl.o).gerund) });
    // costs step: an ellipsis that fills in, unless nothing offsets this
    // option (a no-gains rental merged straight into its net: no ellipsis)
    if (kind === "aCosts" || kind === "bCosts") parts = { main: main, dots: sl.gains ? "anim" : null, rest: "" };
    else parts = { main: main, dots: "static", rest: Tt.offset };
  }
  parts.title = parts.main + (parts.dots ? " " + Tt.ell : "") + (parts.rest ? " " + parts.rest : "");
  return parts;
}
function stepCopy(st){
  const m = AN.m, N = m.N, Y = yrsWord(N), A = COPY.anim, kind = m.steps[st - 1];
  const oa = optCopy(m.a.o), ob = optCopy(m.b.o), z = m.rows[N - 1], T = stepTitle(m, st);
  const out = function(text){ return { title: T.title, parts: T, text: text }; };
  // text: the step's explanation, visually hidden since edit list 1 (for
  // screen readers and the chart's aria-label)
  const costs = sl => fill(A.costs, { list: joinList(sl.compList.map(k => A.list[k])), n: N, yrs: Y, paid: roundAmt(sl.z.paid) });
  if (kind === "aCosts") return out(costs(m.a) + (m.a.gains ? "" : mergeCopy(m.a)));
  if (kind === "aBack") return out(backCopy(m.a, N, Y));
  if (kind === "bCosts") return out(netCopy(m.a, N, Y, false) + A.stays + fill(A.costsB, { b: ob.gerund, list: joinList(m.b.compList.map(k => A.list[k])),
                                                                  paid: roundAmt(m.b.z.paid), n: N, yrs: Y }) +
                                    (m.b.gains ? "" : mergeCopy(m.b)));
  if (kind === "bBack") return out(backCopy(m.b, N, Y));
  if (kind === "compare"){
    const band = washBand(z), wash = Math.abs(z.gap) < band, lead = z.gap >= 0 ? oa : ob, trail = z.gap >= 0 ? ob : oa;
    return out(fill(wash ? A.compareWash : A.compare,
      { netB: netCopy(m.b, N, Y, true), Lead: cap(lead.gerund), trail: trail.gerund, amt: roundAmt(z.gap), n: N, yrs: Y,
        band: roundAmt(band), cross: AN.cross }).trim());
  }
  // the difference line is net cost A - net cost B = -gap
  return out(fill(A.diff, { a: oa.gerund, b: ob.gerund, n: N, yrs: Y, amt: signedAmt(-z.gap) }));
}
// Short label for a step on the track.
function trackLabel(st){
  const m = AN.m, Tk = COPY.anim.track, kind = m.steps[st - 1];
  const back = function(sl){
    const tag = optCopy(sl.o).tag;
    return fill(sl.buy ? Tk.equity : (sl.posList.indexOf("growth") >= 0 ? (sl.growthKey === "growthSav" ? Tk.savings : Tk.invest) : Tk.total), { Tag: tag });
  };
  const costs = sl => fill(sl.gains ? Tk.costs : Tk.costsNet, { Tag: optCopy(sl.o).tag });
  if (kind === "aCosts") return costs(m.a);
  if (kind === "aBack") return back(m.a);
  if (kind === "bCosts") return costs(m.b);
  if (kind === "bBack") return back(m.b);
  return kind === "compare" ? Tk.compare : Tk.diff;
}
// The title is built from its parts: the ellipsis is three dot spans
// (aria-hidden), shown by #step-cap's data-dots (see setDots()) or all at
// once when static.
function setCaption(el, st){
  const c = stepCopy(st), P = c.parts, t = el.querySelector(".stitle");
  el.querySelector(".snum").textContent = fill(COPY.anim.stepOf, { i: st, n: nSteps() });
  t.textContent = P.main;
  if (P.dots){
    const e = document.createElement("span");
    e.className = "ell" + (P.dots === "static" ? " static" : "");
    e.setAttribute("aria-hidden", "true");
    for (let k = 0; k < 3; k++){ const d = document.createElement("i"); d.textContent = COPY.anim.titles.ellDot; e.appendChild(d); }
    t.appendChild(document.createTextNode(" ")); t.appendChild(e);
  }
  if (P.rest) t.appendChild(document.createTextNode(" " + P.rest));
  el.querySelector(".stext").textContent = c.text;

}
function animCaption(){
  // at a step's end state the ellipsis is complete; before step 1 plays it
  // is empty (it fills in as the step plays: startDots())
  if (AN.pi === -1) setDots(0);
  else if (AN.pi === null && !AN.playing){ AN.dotsDone = true; setDots(3); }
  const c = setCaption($("step-cap"), AN.step);
  $("chart").setAttribute("aria-label", fill(COPY.anim.stepOf, { i: AN.step, n: nSteps() }) + ". " + c.title + ". " + c.text);
}
// ---- the title's ellipsis (edit list 1). Part of the step's sequence: its
// dots appear DOT_DELAY_MS after the step starts, DOT_MS apart, on the
// step's own timers (AN.timers), and the step only counts as finished
// (AN.playing false, so autoplay's dwell starts) once both its frames and
// its dots are done. Reduced motion: all three at once.
const DOT_DELAY_MS = 300, DOT_MS = 250;
function setDots(n){ AN.dots = n; $("step-cap").dataset.dots = n; }
function startDots(){
  AN.framesDone = false; AN.dotsDone = true;
  if (AN.reduced || stepTitle(AN.m, AN.step).dots !== "anim"){ setDots(3); return; }
  AN.dotsDone = false; setDots(0);
  [1, 2, 3].forEach(function(k){
    AN.timers.push(setTimeout(function(){
      setDots(k);
      if (k === 3){ AN.dotsDone = true; if (AN.framesDone && AN.playing) onPlayEnd(); }
    }, DOT_DELAY_MS + (k - 1) * DOT_MS));
  });
}
// The step's timers were cleared before its dots finished: show them all.
function finishDots(){ if (!AN.dotsDone){ AN.dotsDone = true; } setDots(3); }
// The caption box is as tall as its tallest step, so stepping never changes
// the page height (and the embed height).
function sizeCaption(){
  const cap0 = $("step-cap"), w = cap0.clientWidth;
  if (!w || !AN.m) return;
  const clone = cap0.cloneNode(true);
  clone.removeAttribute("id"); clone.removeAttribute("aria-live");
  clone.querySelectorAll("[id]").forEach(e => e.removeAttribute("id"));
  clone.style.cssText = "position:absolute;visibility:hidden;left:-9999px;top:0;min-height:0;width:" + w + "px";
  document.body.appendChild(clone);
  let h = 0;
  for (let st = 1; st <= nSteps(); st++){ setCaption(clone, st); h = Math.max(h, Math.ceil(clone.getBoundingClientRect().height)); }
  clone.remove();
  cap0.style.minHeight = h + "px";
}
// Buttons, the track (done / current, filling as its phases play / to
// come) and the attention cue.
function animControls(){
  const st = AN.step, A = COPY.anim;
  $("step-back").disabled = st <= 1;
  $("step-next").disabled = st >= nSteps();
  // Skip to comparison: off once the Compare step has finished, or past it
  const cI = AN.m ? AN.m.steps.indexOf("compare") + 1 : 0;
  $("step-skip").disabled = !AN.m || st > cI || (st === cI && !AN.playing && !AN.finishing && AN.pi === null);
  let prog = 1;
  if (AN.pi === -1) prog = 0;
  else if (AN.pi != null && AN.m) prog = (AN.pi + 1) / stepFrames(AN.m, st).length;
  document.querySelectorAll("#step-track .tseg").forEach(function(d){
    const i = Number(d.dataset.step);
    d.classList.toggle("on", i === st); d.classList.toggle("done", i < st); d.classList.toggle("up", i > st);
    d.style.setProperty("--u", Math.max(0, i - st - 1));
    d.querySelector(".tfill").style.width = (i < st ? 100 : (i === st ? Math.round(prog * 100) : 0)) + "%";
    if (i === st) d.setAttribute("aria-current", "step"); else d.removeAttribute("aria-current");
    if (AN.m){
      const lab = trackLabel(i);
      d.querySelector(".tlab").textContent = lab;
      d.setAttribute("aria-label", fill(A.dotLabel, { i: i, n: nSteps(), title: stepCopy(i).title }));
      d.title = lab;
    }
  });
  if (AN.m){
    const cur = $("step-cur");
    cur.textContent = "";
    const b = document.createElement("b"); b.textContent = fill(A.trackCur, { i: st, n: nSteps() });
    cur.appendChild(b); cur.appendChild(document.createTextNode(" " + trackLabel(st)));
  }

}
// The attention cue: until the reader's first advance, and again after
// CUE_IDLE_MS without one, while a step is not playing and more steps
// remain. Never under reduced motion, and only while autoplay is off (its
// countdown on Next is the cue while it runs; 2026-10-07).
function updateCue(){
  clearTimeout(AN.cueTimer);
  const idle = Date.now() - AN.lastAct;
  const can = !AN.reduced && !AN.auto && AN.m && AN.step < nSteps() && !AN.playing && !AN.finishing;
  const on = !!(can && (!AN.advanced || idle >= CUE_IDLE_MS - 50));
  $("stepper").classList.toggle("cue", on);
  if (can && !on) AN.cueTimer = setTimeout(updateCue, CUE_IDLE_MS - idle + 20);
}

// ---- self-check: plotted values against the engine, every year
// (net-cost orientation, 2026-10-07: cost = -net, the difference = -gap)
function checkAnim(){
  const m = AN.m, fr = curFrame(), ser = {};
  chart.getOption().series.forEach(x => { ser[x.id] = x.data; });
  let n = 0, bad = 0;
  const eq = function(p, q){ n++; if (!(Math.abs(p - q) <= 1e-6)) bad++; };
  ["a", "b"].forEach(function(s){
    const ph = fr[s][0], sl = m[s], kAll = ph === 1 ? sl.compList.length : (ph === 3 ? sl.posList.length : 0);
    const kk = Math.min(fr[s][1], kAll);
    const lo = (k, i) => ser[s + "_" + k][i][1], hi = (k, i) => ser[s + "_" + k][i][2];
    const line = i => ser[s + "_line"][i][1], paid = i => ser[s + "_paid"][i][1];
    m.rows.forEach(function(r, i){
      const z = r[s], cost = -z.net;
      eq(sl.cost[i], cost);                                             // the plotted series is -net
      // the engine's cost components add up to its total paid
      if (ph === 1 || ph === 2) eq(COMP_KEYS.reduce((t, k) => t + sl.comp[k][i], 0), z.paid);
      if (ph === 1){
        // costs stack upward from zero, each band its component
        let top = 0;
        sl.compList.forEach(function(k, j){
          if (j >= kk) return;
          eq(lo(k, i), top); eq(hi(k, i) - lo(k, i), sl.comp[k][i]); top = hi(k, i);
        });
        eq(line(i), top);
        if (kk === sl.compList.length) eq(top, z.paid);                 // all bands = total paid
      }
      if (ph === 2 || ph === 3){
        eq(lo("total", i), 0); eq(hi("total", i), z.paid);
        eq(paid(i), z.paid);                                            // the Total paid line
      }
      if (ph === 3){
        // what comes back stacks down from total paid; selling costs push up
        let top = z.paid;
        sl.posList.forEach(function(k, j){
          if (j >= kk) return;
          eq(hi(k, i), top); eq(hi(k, i) - lo(k, i), sl.pos[k][i]); top = lo(k, i);
        });
        eq(line(i), top);
        // total paid - what comes back + selling costs = net cost
        if (kk === sl.posList.length){
          eq(top, cost);
          eq(z.paid - (sl.pos.putIn[i] + sl.pos.app[i]) - sl.pos.growth[i] - sl.pos.sell[i], cost);
        }
      }
      if (ph === 4){
        eq(line(i), cost);
        // every band has collapsed: zero thickness, parked on the net-cost line
        COMP_KEYS.concat(["total"], POS_KEYS).forEach(function(k){ eq(hi(k, i) - lo(k, i), 0); eq(lo(k, i), cost); });
        // an option with no gains (merged straight from its costs): its one
        // line is both its total paid and its net cost, its components add
        // up to that total, and nothing stacks on it (no equity, no
        // investment growth, no selling costs)
        if (!sl.gains){
          eq(line(i), z.paid); eq(cost, z.paid);
          eq(COMP_KEYS.reduce((t, k) => t + sl.comp[k][i], 0), z.paid);
          POS_KEYS.forEach(k => eq(sl.pos[k][i], 0));
        }
      }
      // the difference: net cost A - net cost B, with B on the zero line
      if (ph === "diff") eq(line(i), s === "a" ? (-r.a.net) - (-r.b.net) : 0);
      if (ph === "diff" && s === "a") eq(line(i), -r.gap);
    });
  });
  // engine identities, every year (to the cent): money freed up reconciles
  // with total paid; net = kept after selling costs - total paid +
  // investment growth after tax; and net cost = total paid - equity at sale
  // + selling costs - investment growth after tax
  const eqc = function(p, q){ n++; if (!(Math.abs(p - q) < 0.005)) bad++; };
  m.rows.forEach(function(r){
    eqc(r.a.paid - r.b.paid, r.b.freedTotal - r.a.freedTotal);
    ["a", "b"].forEach(s => eqc(r[s].net, r[s].equityNet - r[s].paid + r[s].growth - r[s].gtax));
    ["a", "b"].forEach(s => eqc(-r[s].net, r[s].paid - r[s].equity + r[s].selling - (r[s].growth - r[s].gtax)));
  });
  // the shading spans the gap between the lines, in the colour of the lower
  // line: band_a (A's colour) only where A is lower, band_b where B is
  if (fr.cmp >= 1) m.rows.forEach(function(r, i){
    const la = ser.a_line[i][1], lb = ser.b_line[i][1];
    const ta = ser.band_a[i][2] - ser.band_a[i][1], tb = ser.band_b[i][2] - ser.band_b[i][1];
    eq(ta + tb, Math.abs(la - lb)); eq(ta, Math.max(0, lb - la)); eq(tb, Math.max(0, la - lb));
  });
  // the crossing marker sits where the plotted lines cross
  if (fr.cmp >= 2 && m.beX !== null){
    const k = Math.floor(m.beX - 1e-9), w = m.beX - k, i0 = k - 1;
    const g0 = m.gap[i0], g1 = m.gap[i0 + 1];
    // A - B interpolated at the marker is zero (relative to the segment's swing)
    if (i0 >= 0 && i0 + 1 < m.rows.length) eq((g0 * (1 - w) + g1 * w) / (Math.abs(g0) + Math.abs(g1) + 1), 0);
  }
  // the step list matches the options: a "back" step exactly for each option with gains
  n++; if (stepList(m).join() !== m.steps.join() || (m.steps.indexOf("aBack") >= 0) !== m.a.gains ||
           (m.steps.indexOf("bBack") >= 0) !== m.b.gains || m.steps.length !== 4 + (m.a.gains ? 1 : 0) + (m.b.gains ? 1 : 0)) bad++;
  window.__chartCheck = { step: AN.step, pi: AN.pi, steps: m.steps.join(" "), years: m.rows.length, checks: n, mismatches: bad };
  if (bad) console.error("Chart check failed at step " + AN.step + ": " + bad + " plotted value(s) differ from the engine");
}

// ---- navigation
function animClearTimers(){ AN.timers.forEach(clearTimeout); AN.timers = []; }
function stopIntro(){ if (AN.io){ AN.io.disconnect(); AN.io = null; } }
function clampStep(st){ return Math.max(1, Math.min(nSteps(), st)); }
function animAfterStep(){
  animCaption(); animControls();
  scheduleUrlSync();
  if (window.__inmanEmbedSend) window.__inmanEmbedSend();     // height is fixed; reported anyway
}
// A step's sequence has finished (or was skipped): restart the idle clock
// for the attention cue; animControls() -> autoSync() starts the autoplay
// dwell.
function onPlayEnd(){ AN.playing = false; AN.lastAct = Date.now(); autoLog("settled"); animControls(); }
// Play the current step from frame pi, one frame per timer.
// Frame 0 also starts the title's dots (startDots()); after the last frame
// the step waits for them, if they are still appearing, before it ends.
function playFrom(pi){
  if (!AN.m) return;
  const F = stepFrames(AN.m, AN.step);
  pi = Math.max(0, Math.min(pi, F.length - 1));
  if (pi === 0) startDots();
  AN.pi = pi; AN.playing = pi < F.length - 1;
  animRender(F[pi].dur);
  if (AN.playing){ AN.timers.push(setTimeout(function(){ playFrom(pi + 1); }, F[pi].gap)); animControls(); }
  else {
    AN.pi = null; AN.framesDone = true;
    if (AN.dotsDone) onPlayEnd();
    else { AN.playing = true; animControls(); }        // the dots' last timer ends the step
  }
}
// Play step st from its first phase (reduced motion: show its end state).
function startStep(st){
  if (!AN.m) return;
  animClearTimers(); stopIntro();
  AN.step = clampStep(st); AN.started = true; AN.finishing = false;
  if (AN.reduced){ AN.pi = null; animRender(0); onPlayEnd(); }
  else playFrom(0);
  animAfterStep();
}
// Show step st's end state, tweened (Back, the track, Home / End).
function showEnd(st, dur){
  if (!AN.m) return;
  animClearTimers(); stopIntro();
  AN.step = clampStep(st); AN.pi = null; AN.started = true; AN.finishing = false;
  finishDots();
  animRender(dur == null ? STEP_MS : dur);
  onPlayEnd(); animAfterStep();
}
function userAct(advance){ AN.lastAct = Date.now(); if (advance) AN.advanced = true; }
// Next (the button, the Right arrow, Enter on the chart): moves on and
// resumes autoplay (2026-10-07).
function animNext(){
  if (!AN.m) return;
  nextStep();
  autoResume();
}
// Moving on. Mid-sequence (or before step 1 has played), the current step's
// remaining phases finish in one quick tween, then the next step plays; a
// second Next during that quick tween moves on at once.
function nextStep(){
  userAct(true);
  if (AN.finishing){ startStep(AN.step + 1); return; }
  const mid = AN.playing || AN.pi !== null || !AN.started;
  if (mid && !AN.reduced){
    animClearTimers(); stopIntro();
    AN.pi = null; AN.playing = false; AN.started = true;
    finishDots();
    animRender(FINISH_MS);
    if (AN.step >= nSteps()){ onPlayEnd(); return; }
    AN.finishing = true; animControls();
    AN.timers.push(setTimeout(function(){ AN.finishing = false; startStep(AN.step + 1); }, FINISH_MS + 40));
    return;
  }
  if (AN.step < nSteps()) startStep(AN.step + 1);
}
// Skip to comparison (2026-10-07): a tweened jump to the Compare step's end
// state, as the track does (reduced motion: at once). Pauses autoplay.
function animSkip(){
  if (!AN.m) return;
  const c = AN.m.steps.indexOf("compare") + 1;
  if (AN.step > c) return;
  userAct(true); autoPause();
  showEnd(c, AN.step === c ? FINISH_MS : STEP_MS);
}
// Back (the button, the Left arrow): the end state of the previous step.
// Pauses autoplay.
function animBack(){
  if (!AN.m || AN.step <= 1) return;
  userAct(false); autoPause();
  showEnd(AN.step - 1);
}
// A track segment: the next step plays as Next does; any other step shows
// its end state (the current one, if it is still playing, finishes). Any
// segment pauses autoplay, the next one included: choosing a step says the
// reader wants to study it (2026-10-07).
function animTrack(i){
  if (!AN.m) return;
  autoPause();
  if (i === AN.step + 1){ nextStep(); return; }
  userAct(i > AN.step);
  if (i !== AN.step || AN.playing || AN.finishing || AN.pi !== null) showEnd(i, i === AN.step ? FINISH_MS : STEP_MS);
}
// Replay: everything folds back to the empty chart, then step 1 plays;
// autoplay resumes.
function animReplay(){
  if (!AN.m) return;
  autoResume();
  animClearTimers(); stopIntro(); userAct(false);
  AN.step = 1; AN.started = true; AN.finishing = false;
  if (AN.reduced){ AN.pi = null; animRender(0); onPlayEnd(); animAfterStep(); return; }
  AN.pi = -1; AN.playing = true; animRender(STEP_MS); animAfterStep();
  AN.timers.push(setTimeout(function(){ playFrom(0); }, STEP_MS + 60));
}
// Home / End / Enter on the stepper and the chart (the arrows are handled
// page-wide by animArrows). Home and End pause autoplay; Enter on the chart
// is Next.
function animKey(e){
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key;
  if (k === "Home"){ userAct(false); autoPause(); showEnd(1); }
  else if (k === "End"){ userAct(true); autoPause(); showEnd(nSteps()); }
  else if (k === "Enter" && e.currentTarget.id === "chart") animNext();
  else return;
  e.preventDefault();
}
// Right / Left arrow = Next / Back whenever the chart is in view or focus is
// in the chart card; never while typing in a field, a select or the metro
// search box (or on the stay slider, which uses the arrows itself). The
// default is prevented, so the page never scrolls on these keys.
function animArrows(e){
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || e.defaultPrevented || !AN.m || $("outputs").hidden) return;
  const t = e.target;
  if (t && t.closest && t.closest('input, textarea, select, [contenteditable]:not([contenteditable="false"]), .choices')) return;
  const card = $("chart").closest(".card");
  if (!AN.inView && !(card && card.contains(document.activeElement))) return;
  e.preventDefault();
  if (e.key === "ArrowRight") animNext(); else animBack();
}
function setReduced(){
  const mq = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
  AN.reduced = AN.forceReduced || !!(mq && mq.matches);
  document.documentElement.classList.toggle("rm", AN.reduced);
  if (AN.m) updateCue();
}

// ---- autoplay (Houston, 2026-10-07; see AUTOPLAY above)
function autoLog(ev){
  AN.log.push({ t: Math.round(window.performance ? performance.now() : Date.now()), ev: ev, step: AN.step });
  if (AN.log.length > 120) AN.log.shift();
}
// Screen-reader announcement (#auto-status, polite). Cleared first, so the
// same message is announced again.
function autoAnnounce(t){
  const el = $("auto-status"); el.textContent = "";
  setTimeout(function(){ el.textContent = t; }, 80);
}
// A step is "settled" when its own phases have finished and there is a
// next step to move to.
function autoSettled(){
  return !!AN.m && AN.started && !AN.playing && !AN.finishing && AN.pi === null && AN.step < nSteps() &&
         !$("outputs").hidden && !printSaved;
}
function autoHeld(){ const h = AN.holds; return h.hover || h.touch || h.focus || h.view || h.hidden || h.print; }
// Stop the countdown, keeping what was left of it.
function autoStop(){
  if (!AN.dwellT) return;
  clearTimeout(AN.dwellT); AN.dwellT = 0;
  AN.dwellLeft = Math.max(0, AN.dwellLeft - (Date.now() - AN.dwellAt));
  autoLog("dwell-stop " + Math.round(AN.dwellLeft));
}
// Bring the countdown in line with the state; called on every
// animControls(), so after every step change, phase, toggle and hold.
// Idempotent. A countdown belongs to one step: a new step starts afresh.
function autoSync(){
  if (AN.dwellStep !== AN.step){
    if (AN.dwellT){ clearTimeout(AN.dwellT); AN.dwellT = 0; }
    AN.dwellLeft = AUTO_DWELL_MS; AN.dwellStep = AN.step;
  }
  const settled = autoSettled(), want = AN.auto && settled && !autoHeld();
  if (!want) autoStop();
  if (!AN.auto || !settled) AN.dwellLeft = AUTO_DWELL_MS;
  if (want && !AN.dwellT){
    AN.dwellAt = Date.now(); AN.dwellT = setTimeout(autoFire, AN.dwellLeft);
    autoLog("dwell-start " + Math.round(AN.dwellLeft));
  }
  paintAuto();
}
// The countdown ran out: play the next step (as Next does when a step has
// finished; the step's own phases then play and the dwell restarts).
function autoFire(){
  AN.dwellT = 0;
  if (!(AN.auto && autoSettled() && !autoHeld())){ AN.dwellLeft = AUTO_DWELL_MS; autoSync(); return; }
  autoLog("advance");
  startStep(AN.step + 1);
}
// Turn autoplay on or off. why (off only): "user", "param", "link" or
// "reduced". A change is announced to screen readers and written to the
// address bar (?autoplay=0, see shareQuery()).
function autoSet(on, why){
  const was = AN.auto;
  AN.auto = !!on; AN.autoWhy = on ? null : (why || "user");
  if (was !== AN.auto){
    autoLog(on ? "resume" : "pause:" + AN.autoWhy);
    autoAnnounce(fill(on ? COPY.anim.autoOn : COPY.anim.autoOff, { s: AUTO_DWELL_MS / 1000 }));
  }
  if (AN.m) animControls(); else paintAuto();
  scheduleUrlSync();
}
// Back, the Left arrow, the track, Home / End and Skip pause autoplay.
// (Already off: a link-opened pause becomes the reader's own; reduced
// motion and ?autoplay=0 keep their reason.)
function autoPause(){ if (AN.auto) autoSet(false, "user"); else if (AN.autoWhy === "link") AN.autoWhy = "user"; }
// Next, the Right arrow and Replay resume it, unless it was never on
// because of reduced motion (then only Play turns it on).
function autoResume(){ if (!AN.auto && AN.autoWhy !== "reduced") autoSet(true); }
// The Pause / Play button. On the last step, where autoplay has nothing
// left to do, Play starts again from step 1 with autoplay on.
function autoToggle(){
  if (AN.auto && !(AN.m && AN.step >= nSteps())){ autoSet(false, "user"); return; }
  autoSet(true);
  if (AN.m && AN.step >= nSteps()) animReplay();
}
// Holds: the countdown waits without autoplay being paused. Away holds
// (out of view, hidden tab, printing) start the full dwell again on
// release; engagement holds (hover, touch tooltip, focus) resume with what
// was left, at least AUTO_RESUME_MIN_MS.
const AUTO_AWAY = { view: true, hidden: true, print: true };
function autoHold(k, on){
  on = !!on;
  if (AN.holds[k] === on) return;
  AN.holds[k] = on; autoLog((on ? "hold:" : "release:") + k);
  if (on){ autoStop(); if (AUTO_AWAY[k]) AN.dwellLeft = AUTO_DWELL_MS; }
  else if (!AUTO_AWAY[k]) AN.dwellLeft = Math.max(AN.dwellLeft, AUTO_RESUME_MIN_MS);
  autoSync();
}
// An input edit (any refresh): same step, full dwell again.
function autoRestart(){
  if (AN.dwellT){ clearTimeout(AN.dwellT); AN.dwellT = 0; }
  AN.dwellLeft = AUTO_DWELL_MS; autoLog("restart");
  autoSync();
}
// The button (label, icon, accessible name) and the countdown bar on Next:
// from what is left of the dwell, filling linearly to full while it runs;
// frozen and dimmed while held; hidden while autoplay is off or a step is
// still playing. Redrawn only when its state changes.
let autoPaintKey = "";
function paintAuto(){
  const A = COPY.anim, btn = $("step-auto");
  const atEnd = !!AN.m && AN.step >= nSteps(), on = AN.auto && !atEnd;
  btn.classList.toggle("paused", !on);
  $("step-auto-lab").textContent = on ? A.autoPause : A.autoPlay;
  const lab = on ? A.autoPauseLabel : fill(atEnd ? A.autoRestartLabel : A.autoPlayLabel, { s: AUTO_DWELL_MS / 1000 });
  btn.setAttribute("aria-label", lab); btn.title = lab;
  const box = $("step-count"), bar = box.firstElementChild;
  const show = AN.auto && autoSettled(), run = !!AN.dwellT;
  const key = [show, run, AN.dwellAt, Math.round(AN.dwellLeft), AN.step].join("|");
  if (key === autoPaintKey) return;
  autoPaintKey = key;
  box.classList.toggle("on", show); box.classList.toggle("held", show && !run);
  bar.style.transition = "none";
  bar.style.transform = "scaleX(" + (show ? Math.max(0, Math.min(1, 1 - AN.dwellLeft / AUTO_DWELL_MS)) : 0) + ")";
  if (show && run){
    void bar.offsetWidth;
    bar.style.transition = "transform " + Math.round(AN.dwellLeft) + "ms linear";
    bar.style.transform = "scaleX(1)";
  }
}
// Keyboard focus in the chart card, outside the step navigation (whose own
// buttons say what the reader wants), holds the countdown. Mouse focus
// (a clicked summary) doesn't: hover covers the pointer.
function autoFocusCheck(){
  const a = document.activeElement, card = $("chart").closest(".card");
  let kb = true;
  try { kb = !!a && a.matches(":focus-visible"); } catch (e){}
  autoHold("focus", !!(a && card && card.contains(a) && !a.closest("#stepper, #step-skip") && kb));
}
function initAutoplay(q){
  AN.auto = !AN.reduced && !q.step && !q.autoplayOff;
  AN.autoWhy = AN.auto ? null : (q.autoplayOff ? "param" : (q.step ? "link" : "reduced"));
  autoLog(AN.auto ? "init:on" : "init:off:" + AN.autoWhy);
  $("step-auto").addEventListener("click", autoToggle);
  // away holds: the tab hidden (out-of-view is in paintAnim's observer;
  // printing in preparePrint / restorePrint)
  AN.holds.hidden = !!document.hidden;
  document.addEventListener("visibilitychange", function(){ autoHold("hidden", document.hidden); });
  // engagement holds: the pointer over the chart; a touch on it (its
  // tooltip stays open) until the next touch elsewhere; keyboard focus
  const box = $("chart").closest(".chartbox"), card = $("chart").closest(".card");
  box.addEventListener("pointerenter", function(e){ if (e.pointerType !== "touch") autoHold("hover", true); });
  box.addEventListener("pointerleave", function(e){ if (e.pointerType !== "touch") autoHold("hover", false); });
  box.addEventListener("pointerdown", function(e){ if (e.pointerType === "touch") autoHold("touch", true); });
  document.addEventListener("pointerdown", function(e){ if (AN.holds.touch && !box.contains(e.target)) autoHold("touch", false); }, true);
  card.addEventListener("focusin", autoFocusCheck);
  card.addEventListener("focusout", function(){ setTimeout(autoFocusCheck, 0); });
  paintAuto();
}

// The step list changed under the reader (a toggle gave a rental investment
// growth or took it away, or the pair changed): stay on the same kind of
// step, at the frame with the same content (same phase for each option, same
// comparison layers) where the new step has one. A frame the new step lacks
// maps to its end state if it was the old step's last frame (a merge that is
// now a separate step), else to the same position (a collapse phase that is
// no longer needed). A "back" step that no longer exists maps to the end of
// that option's costs step, which now merges into its net. A sequence that
// is playing carries on from the mapped frame; the caller re-renders in
// place, tweened.
function remapStep(old){
  const m = AN.m, kind = old.steps[AN.step - 1];
  let st = m.steps.indexOf(kind) + 1, pi = AN.pi;
  if (pi === -1){ AN.step = st || 1; return; }       // before step 1 plays (always aCosts): the intro timer goes on
  if (!st){
    st = m.steps.indexOf(kind === "aBack" ? "aCosts" : "bCosts") + 1; pi = null;
  } else if (pi != null){
    const oF = stepFrames(old, AN.step), nF = stepFrames(m, st), f = oF[Math.min(pi, oF.length - 1)];
    let j = -1;
    nF.forEach(function(g, i){ if (j < 0 && sameFrame(g, f)) j = i; });
    pi = j >= 0 ? j : (pi >= oF.length - 1 ? null : Math.min(pi, nF.length - 1));
    if (pi === nF.length - 1) pi = null;
  }
  AN.step = st; AN.pi = pi;
  if (AN.playing){
    animClearTimers(); finishDots();                  // the dots' timers went with the others
    if (pi === null){ AN.playing = false; AN.lastAct = Date.now(); }
    else AN.timers.push(setTimeout(function(){ playFrom(pi + 1); }, stepFrames(m, st)[pi].gap));
  }
}
// Show one track segment per step (built for MAX_STEPS; the rest hidden).
function syncTrack(){
  const n = nSteps();
  document.querySelectorAll("#step-track .tseg").forEach(function(d){ d.parentNode.hidden = Number(d.dataset.step) > n; });
}

// Called by paintResults() on every refresh: rebuild the model and re-render
// the current frame in place (tweened), recomputing the ranges. A step that
// is playing carries on with the new numbers. If the step list changed,
// remapStep() moves to the equivalent step first.
function paintAnim(sim, N, crossText){
  if (!window.echarts) return;
  if (!chart) chart = echarts.init($("chart"), null, { renderer: "svg" });
  const old = AN.m;
  AN.m = animModel(sim, N); AN.cross = crossText;
  if (!old) AN.step = clampStep(AN.step);              // ?step=N / ?chart=diff, now the step count is known
  else if (old.steps.join() !== AN.m.steps.join()) remapStep(old);
  syncTrack();
  if (AN.pi != null && AN.pi >= 0){
    const F = stepFrames(AN.m, AN.step);
    if (AN.pi > F.length - 1) AN.pi = F.length - 1;
  }
  const edit = !!chart.__drawn;
  animRender(edit ? 600 : 0);
  chart.__drawn = true;
  animCaption(); sizeCaption(); animControls();
  // an input edit keeps the step and restarts its autoplay dwell (it does
  // not pause autoplay; 2026-10-07)
  if (edit) autoRestart();
  $("chart-note").textContent = COPY.chart.note + " " + fill(COPY.chart.noteAuto, { s: AUTO_DWELL_MS / 1000 });
  // Is the chart in view? (for the arrow keys, and autoplay's out-of-view
  // hold: the countdown waits while less than 30% of the chart shows)
  if (!AN.viewIO && "IntersectionObserver" in window){
    AN.viewIO = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ AN.inView = e.isIntersecting && e.intersectionRatio >= 0.3; });
      autoHold("view", !AN.inView);
    }, { threshold: [0, 0.3, 0.6, 1] });
    AN.viewIO.observe($("chart"));
  } else if (!("IntersectionObserver" in window)) AN.inView = true;
  // Start step 1 when the chart scrolls into view (once).
  if (!AN.started && !AN.io){
    if ("IntersectionObserver" in window){
      AN.io = new IntersectionObserver(function(entries){
        if (AN.started || !entries.some(e => e.isIntersecting)) return;
        stopIntro(); AN.started = true;
        if (AN.reduced){ AN.pi = null; animRender(0); onPlayEnd(); animAfterStep(); }
        else { AN.playing = true; animControls(); AN.timers.push(setTimeout(function(){ playFrom(0); }, 150)); }
      }, { threshold: 0.4 });
      AN.io.observe($("chart"));
    } else { AN.started = true; AN.pi = null; animRender(0); onPlayEnd(); }
  }
}
function animResize(){
  if (!chart) return;
  chart.resize();
  animRender(0); sizeCaption();
}
function initAnim(q){
  AN.forceReduced = !!q.reduceMotion; setReduced();
  if (window.matchMedia){
    const mq = window.matchMedia("(prefers-reduced-motion: reduce)");
    // turning reduced motion on mid-visit also turns autoplay off
    const on = function(){ const was = AN.reduced; setReduced(); if (AN.reduced && !was && AN.auto) autoSet(false, "reduced"); };
    if (mq.addEventListener) mq.addEventListener("change", on); else if (mq.addListener) mq.addListener(on);
  }
  // ?step=N / ?chart=diff: open on that step, complete, with no intro (and
  // autoplay paused: initAutoplay()).
  if (q.step){ AN.step = q.step; AN.pi = null; AN.started = true; }
  AN.lastAct = Date.now();
  initAutoplay(q);
  const track = $("step-track");
  for (let i = 1; i <= MAX_STEPS; i++){
    const li = document.createElement("li"), d = document.createElement("button");
    d.type = "button"; d.className = "tseg"; d.dataset.step = i;
    d.innerHTML = '<span class="tbar"><span class="tfill"></span></span><span class="tlab"></span>';
    d.addEventListener("click", function(){ animTrack(i); });
    li.appendChild(d); track.appendChild(li);
  }
  $("stepper").setAttribute("aria-label", COPY.anim.groupLabel);
  $("step-next").title = COPY.anim.nextHint;
  $("step-back").title = COPY.anim.backHint;
  $("step-next").addEventListener("click", animNext);
  $("step-back").addEventListener("click", animBack);
  $("step-replay").addEventListener("click", animReplay);
  $("step-skip").addEventListener("click", animSkip);
  $("step-skip").title = COPY.anim.skipHint;
  $("stepper").addEventListener("keydown", animKey);
  $("chart").addEventListener("keydown", animKey);
  document.addEventListener("keydown", animArrows);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if (AN.m){ animRender(0); sizeCaption(); } });
  // debugging / verification hook
  window.__anim = { go: function(st, play){ if (play) startStep(st); else showEnd(st); }, next: animNext, back: animBack, replay: animReplay,
                    state: function(){ return { step: AN.step, pi: AN.pi, playing: AN.playing, finishing: AN.finishing, started: AN.started,
                                                reduced: AN.reduced, inView: AN.inView, cue: $("stepper").classList.contains("cue"),
                                                dots: AN.dots, dotsDone: AN.dotsDone, framesDone: AN.framesDone }; },
                    frames: function(st){ return stepFrames(AN.m, st || AN.step); },
                    steps: function(){ return AN.m ? AN.m.steps.slice() : []; },
                    skip: animSkip,
                    labels: function(){ return AN.m ? AN.m.steps.map((k, i) => trackLabel(i + 1)) : []; },
                    model: function(){ return AN.m; },
                    // autoplay (2026-10-07): its state, the event log, the
                    // button, and a hold (for checks only)
                    auto: function(){ return { on: AN.auto, why: AN.autoWhy, running: !!AN.dwellT, settled: autoSettled(),
                                               left: AN.dwellT ? Math.max(0, AN.dwellLeft - (Date.now() - AN.dwellAt)) : AN.dwellLeft,
                                               holds: Object.assign({}, AN.holds), step: AN.step, dwellMs: AUTO_DWELL_MS }; },
                    log: function(){ return AN.log.slice(); },
                    toggleAuto: autoToggle, hold: autoHold };
}

// "How this calculator works" (edit list 1): three short paragraphs, the
// sources (including the default sources that used to sit under the main
// inputs; the rate's week is the rate in use, S.rate), and the thin-market
// note when buying a condo is in the pair.
function paintMethod(){
  const el = $("method"), M = COPY.method;
  const v = {
    pmiBelow: pctTxt(DEF.pmiBelow), closing: pctTxt(DEF.closing), selling: pctTxt(DEF.selling),
    startYear: DEF.startYear, month: fmtMonth(META.valuesMonth), week: fmtWeek(S.rate.week),
    down: pctTxt(DEF.down), stay: DEF.stay,
    growth: pctTxt(DEF.app), app: pctTxt(DEF.app), rga: pctTxt(DEF.rgApartment), rgh: pctTxt(DEF.rgHouse)
  };
  // one growth line when the three default rates agree (flat growth, 2026-10-08)
  const oneRate = DEF.app === DEF.rgApartment && DEF.app === DEF.rgHouse;
  el.innerHTML = "";
  const para = function(t, cls){ const p = document.createElement("p"); p.textContent = t; if (cls) p.className = cls; el.appendChild(p); return p; };
  [M.what, M.how, M.caveats].forEach(function(t){ para(fill(t, v)); });
  const h = para(""), sp = document.createElement("span");
  sp.className = "mh"; sp.textContent = M.sourcesHead; h.appendChild(sp);
  const ul = document.createElement("ul");
  M.sources.forEach(function(t){
    const li = document.createElement("li");
    li.textContent = fill(!oneRate && t.indexOf("{growth}") >= 0 ? M.growthMixed : t, v); ul.appendChild(li); });
  el.appendChild(ul);
  // edit list 10: the condo fee's default source (the HOA field moved to the
  // main row, which has no help lines), from the help paintStatic() wrote
  if (pairHasCondo()){
    const csl = S.optA === "buy_condo" ? "a" : "b";
    para(fill(M.fee, { help: sentences($("help-" + csl + "-hoa").textContent, "").trim() }));
  }
  if (pairHasCondo()) para(M.thin);
}

// Single entry point for every state change: recompute, redraw (chart
// included), rewrite the footnotes, and only then report height, since
// all of them can change the page height.
function refresh(){
  if (!S.built) return;
  resolveLock();       // a live match re-solves from the current inputs first (edit list 8)
  paintStatic();
  const inp = readInputs();
  paintResults(inp);
  paintMethod();
  scheduleUrlSync();
  if (window.__inmanEmbedSend) window.__inmanEmbedSend();
}

  return METROS.slice().sort(function(a, b){ return a.o - b.o; })
    .map(function(m){ return { value: String(m.id), label: metroLabel(m), selected: String(m.id) === String(S.metroId) }; });

function syncMetroPicker(){

  if (metroChoices){
