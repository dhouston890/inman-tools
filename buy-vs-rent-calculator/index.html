  const ok = isFinite(v) && v >= f.min && v <= f.max && (f.zeroOk || v > 0) && (!f.int || v === Math.round(v));
  return ok ? v : NaN;
}

// ------------------------------------------------------------------ state
// The pair, metro, the two "use" toggles and the account are the only state
// outside the input fields; the fields hold every number the math uses.
const S = {
  optA: "buy_condo", optB: "rent_apartment", metroId: null,   // set from DEF / the URL at load
  downUse: "spend", diffUse: "spend", // "spend" | "save" | "invest" (set from DEF at load; never "cash", see pageUse())
  account: "brokerage",               // "brokerage" | "retirement" (Retirement: the invested monthly cost difference untaxed)
  taxUnit: { a: "pct", b: "pct" },    // property tax entered as "pct" (% of value) or "usd" ($ a year), per slot
  term: 30,            // loan term in years: 30 or 15 (edit list 4; set from DEF.term at load)
  downUnit: "pct",     // down payment entered as "pct" or "usd" (edit list 5)
  matchLock: null,     // "a" | "b": that slot's price or rent is matched live (edit list 8)
  lockMsg: null,       // the lock's current message { why, amt } ("Can't match" / "Closest"), null when it matches
  downConv: null,      // the last % -> $ conversion { pct, usd, price }, so $ -> % can restore the exact %
  rate: null,          // { rate (30-year), rate15, week, status: "pending" | "live" | "fallback" }
  rateEdited: false,   // the reader typed a rate: the live fetch must not overwrite it
  pmiEdited: false,    // the reader typed a PMI rate: it stops following the down payment's band (pass 2)
  built: false
};
let chart = null;

// Metro-specific defaults for one option.
// The dollar tax field is filled with the same bill: the rate times the
// price, to the dollar.
function metroDefaults(m, o){
  if (o === "buy_condo") return { price: m.bc.v, tax: Math.round(m.bc.t * 1e6) / 1e4, taxusd: Math.round(m.bc.t * m.bc.v), ins: m.bc.i, hoa: m.bc.h };
  if (o === "buy_house") return { price: m.bh.v, tax: Math.round(m.bh.t * 1e6) / 1e4, taxusd: Math.round(m.bh.t * m.bh.v), ins: m.bh.i, hoa: 0 };
  if (o === "rent_apartment") return { rent: m.ra.r };
  return { rent: m.rh.r };
}
// Option-level defaults: maintenance follows the purchase type, rent growth
// the rental type, home value growth (one flat rate, DEF.app) every purchase.
function optionDefaults(o){
  if (o === "buy_condo") return { maint: DEF.maintCondo, app: DEF.app, assess: DEF.assessUsd };
  if (o === "buy_house") return { maint: DEF.maintSfr, app: DEF.app, assess: DEF.assessUsd };
  return { rg: o === "rent_apartment" ? DEF.rgApartment : DEF.rgHouse, movein: DEF.rentMoveIn, fees: DEF.rentFees };
}
// One slot: scope "metro" = the metro's price/rent, tax, insurance and HOA;
// scope "option" = those plus the option-level defaults.
function applySlotDefaults(slot, scope){
  const o = slot === "a" ? S.optA : S.optB, m = metroById(S.metroId);
  const set = function(vals){ Object.keys(vals).forEach(function(k){ setField(slot + "_" + k, vals[k]); }); };
  set(metroDefaults(m, o));
  if (scope === "option"){ set(optionDefaults(o)); S.taxUnit[slot] = "pct"; }
}
// scope "metro": both slots' metro values (metro change).
// scope "all":   everything, for first load and Reset (the pair and metro stay).
function applyDefaults(scope){
  applySlotDefaults("a", scope === "all" ? "option" : "metro");
  applySlotDefaults("b", scope === "all" ? "option" : "metro");
  if (scope === "all"){
    setField("down", DEF.down); setField("years", DEF.stay);
    setField("ret", DEF.ret); setField("sav", DEF.savYield);
    S.downUse = pageUse(DEF.downUse) || "spend"; S.diffUse = pageUse(DEF.diffUse) || "spend";
    S.account = DEF.accountRetirement ? "retirement" : "brokerage";
    setField("cgt", DEF.cgt);
    setField("closing", DEF.closing); setField("selling", DEF.selling);
    setField("agent", DEF.agent); setField("condoadd", DEF.condoAdd);   // (no points field since edit list 10)
    setField("insg", DEF.insG); setField("hoag", DEF.hoaG);
    setField("pmi", defaultPmi(DEF.down)); S.pmiEdited = false;
    S.term = DEF.term;                                  // Reset returns to the 30-year term
    S.downUnit = "pct"; S.downConv = null;              // ... and to the down payment in % (edit list 5)
    $("in-budget").value = "";                          // ... and clears the optional budget (edit list 6)
    unlockMatch();                                      // ... and ends a live match (edit list 8)
    syncPmiToDown();                                    // PMI from the 30-year grid again (edit list 7)
    setField("rate", termRate(S.term)); S.rateEdited = false;
  }
}

// Loan term (edit list 4, 2026-10-08): 30- or 15-year fixed. termRate() is
// that term's PMMS default (S.rate: the build-week reading, or the live file
// once it is active). Switching the term moves the rate field to the new
// term's default when the field still holds the old term's default (or the
// reader never typed a rate); a rate the reader typed stays.
const TERMS = [30, 15];
function termRate(t){ return t === 15 ? S.rate.rate15 : S.rate.rate; }
function setTerm(t){
  if (TERMS.indexOf(t) < 0 || t === S.term) return;
  const cur = readField("rate"), old = termRate(S.term);
  S.term = t;
  if (!S.rateEdited || (isFinite(cur) && Math.abs(cur - old) < 1e-9)){ setField("rate", termRate(t)); S.rateEdited = false; }
  syncPmiToDown();                 // the PMI field follows the new term's grid unless typed (edit list 7)
}

// PMI default (pass 2, 2026-10-07): the Enact band rate for the down
// payment (pmiBand(), MATH block). The PMI field follows the down payment
// until the reader types in it (S.pmiEdited); from then the typed rate
// sticks until Reset.
function defaultPmi(down){ return pmiBand(down, 12 * S.term, DEF.pmiEdges, DEF.pmiRates, DEF.pmiRates15); }   // the term's grid (edit list 7)
function syncPmiToDown(){
  if (S.pmiEdited) return;
  const d = refDownPct();
  if (isFinite(d)) setField("pmi", defaultPmi(d));
}

// Down payment in dollars (Houston, edit list 5, 2026-10-08). In $ mode one
// dollar amount applies to every purchase in the pair, so each purchase's
// share is dollars / its own price (two purchases: two shares, each with
// its own PMI band unless the reader typed a PMI rate). The reference
// purchase (the PMI field's band, the % <-> $ conversion) is option A if it
// is a purchase, else B.
function buySlots(){ return ["a", "b"].filter(function(sl){ return isBuy(sl === "a" ? S.optA : S.optB); }); }
function refSlot(){ return buySlots()[0]; }
// Each purchase slot's down share (% of its price); NaN if not valid. In $
// mode an amount at or above the price is not valid.
function downShares(){
  const out = {};
  buySlots().forEach(function(sl){
    if (S.downUnit === "pct"){ out[sl] = readField("down"); return; }
    const u = readField("downusd"), p = readField(sl + "_price");
    out[sl] = isFinite(u) && isFinite(p) && p > 0 && u < p ? u / p * 100 : NaN;
  });
  return out;
}
function refDownPct(){ return downShares()[refSlot()]; }
// % -> $: the reference price x the share, to the nearest $1,000 (the
// prices are prefilled to the nearest $1,000), or the nearest $100 under
// $5,000 so a small down payment doesn't round to $0 or double. $ -> %:
// the exact % the reader had if neither the dollars nor the reference price
// changed since, else dollars / price to two decimals.
function roundDownUsd(v){ return v < 5000 ? Math.round(v / 100) * 100 : Math.round(v / 1000) * 1000; }
function setDownUnit(u){
  if (S.downUnit === u) return;
  const price = readField(refSlot() + "_price");
  if (u === "usd"){
    const d = readField("down");
    if (isFinite(d) && isFinite(price)){ const usd = roundDownUsd(d / 100 * price); setField("downusd", usd); S.downConv = { pct: d, usd: usd, price: price }; }
  } else {
    const usd = readField("downusd"), c = S.downConv;
    if (c && usd === c.usd && price === c.price) setField("down", c.pct);
    else if (isFinite(usd) && isFinite(price) && price > 0) setField("down", Math.min(100, Math.round(usd / price * 1e4) / 100));
  }
  S.downUnit = u;
  syncPmiToDown();
}
// One decimal for the share line, the chip and the print list.
function pct1(v){ return (Math.round(v * 10) / 10).toFixed(1); }
// "11.6% of the condo price" / "9.0% condo · 6.6% house" (fill keys for the
// chip and print variants too); null when not valid.
function downShareVars(){
  const sh = downShares(), sl = buySlots();
  const nm = function(s){ return optCopy(s === "a" ? S.optA : S.optB).noun; };
  if (sl.some(function(s){ return !isFinite(sh[s]); })) return null;
  return sl.length === 1 ? { two: false, v: pct1(sh[sl[0]]), noun: nm(sl[0]) }
    : { two: true, v1: pct1(sh.a), n1: nm("a"), v2: pct1(sh.b), n2: nm("b") };
}

// Account (Houston, 2026-10-07; revised 2026-10-07). Retirement applies to
// the invested MONTHLY cost difference only: it is taxed at DEF.cgtRetirement
// (0%). Invested money not used up front is a lump sum that can't go into
// a retirement account in one year, so it is always taxed at the brokerage
// rate in the tax field, which therefore stays editable under either
// setting. Since edit list 1 the switch sits on top of that field's box.
function setAccount(a){ S.account = a; }
function useFlags(u){ return { invest: u === "invest", spend: u === "spend", save: u === "save" }; }
// The money toggles' choices on the page (Houston, 2026-10-07): Spend it |
// Save it | Invest it. The engine's fourth use, cash at 0%, is no longer
// offered; a "cash" from an old link (up=, mo=, use=) or from the defaults
// file is read as "spend", which gives identical numbers: cash earning
// nothing and money spent are both counted at face value, already in the
// option's lower costs (60_build_pitch2_data.R checks spent = cash for every
// metro, pair and setting). Anything else unknown is null (ignored).
const PAGE_USES = ["spend", "save", "invest"];
function pageUse(u){ return u === "cash" ? "spend" : (PAGE_USES.indexOf(u) >= 0 ? u : null); }
// A choice's wording with the rates filled in ({sav} / {ret}, as entered).
function useWord(map, u){
  const r = function(k){ const v = readField(k); return isFinite(v) ? pctTxt(v) : $(FIELDS[k].id).value; };
  return fill(map[u], { sav: r("sav"), ret: r("ret") });
}
// Property tax unit switch (2026-10-07): converts the value already in the
// field, so the bill stays the same: % -> $ = rate x price, to the dollar;
// $ -> % = bill / price, to four decimals (a hundredth of a basis point).
function setTaxUnit(sl, u){
  if (S.taxUnit[sl] === u) return;
  const price = readField(sl + "_price");
  if (u === "usd"){
    const t = readField(sl + "_tax");
    if (isFinite(t) && isFinite(price)) setField(sl + "_taxusd", Math.round(t / 100 * price));
  } else {
    const d = readField(sl + "_taxusd");
    if (isFinite(d) && isFinite(price) && price > 0) setField(sl + "_tax", Math.round(d / price * 100 * 1e4) / 1e4);
  }
  S.taxUnit[sl] = u;
}

// ------------------------------------------------------------- compute
// Only the fields that apply to the chosen pair are read and validated.
function readInputs(){
  const v = {}, bad = [];
  Object.keys(FIELDS).forEach(function(k){
    const el = $(FIELDS[k].id);
    if (!fieldApplies(k)){ el.parentNode.classList.remove("bad"); return; }
    v[k] = readField(k);
    el.parentNode.classList.toggle("bad", !isFinite(v[k]));
    if (!isFinite(v[k])) bad.push(k);
  });
  // a dollar down payment at or above a purchase's price is not valid (edit list 5)
  if (S.downUnit === "usd" && isFinite(v.downusd) && buySlots().some(function(sl){
        const p = v[sl + "_price"]; return isFinite(p) && v.downusd >= p; })){
    $("in-downusd").parentNode.classList.add("bad"); bad.push("downusd");
  }
  const mt = metroById(S.metroId), shares = downShares(), ref = shares[refSlot()];
  const opt = function(sl){
    const o = sl === "a" ? S.optA : S.optB, g = function(k){ return fieldApplies(sl + "_" + k) ? v[sl + "_" + k] : 0; };
    // Property tax entered in dollars (2026-10-07) becomes a rate on the
    // purchase price (bill / price x 100); the engine then charges that
    // rate on the current value, as for a rate typed in directly.
    const taxPct = isBuy(o) && S.taxUnit[sl] === "usd" ? g("taxusd") / g("price") * 100 : g("tax");
    return { option: o, price: g("price"), rent: g("rent"), taxPct: taxPct, ins: g("ins"), hoa: g("hoa"),
             maintPct: g("maint"),
             // pass 2: the metro's structure share (kept when the reader types
             // a price) and the house maintenance cap (a condo has none)
             structShare: isBuy(o) ? mt.ss : 0, maintCap: o === "buy_house" ? DEF.maintCapSfr : 0,
             // the engine keeps one rate per year (years 1, 2, 3 on); the
             // page's single box fills all three (edit list 3, 2026-10-08)
             app: [g("app"), g("app"), g("app")], rg: [g("rg"), g("rg"), g("rg")],
             // the condo add-on, condo purchases only, and only when a condo is
             // compared with a house (edit list 10); otherwise its default (0)
             rateAddPct: o === "buy_condo" ? (fieldApplies("condoadd") ? v.condoadd : DEF.condoAdd) : 0,
             // the assessment is paid in year DEF.assessYear (1; edit list 10
             // removed the year field), so it always falls within the stay
             assessUsd: g("assess"), assessYear: DEF.assessYear,
             // renter-side costs (edit list 4): a rental's, else 0
             moveInUsd: g("movein"), feesUsd: g("fees"),
             // this option's down share and PMI rate (edit list 5): its own
             // share of its price in $ mode (a rental: the reference share,
             // unused); a typed PMI rate (or % mode, where the field follows
             // the one share) applies to both, else its own share's band
             downPct: isBuy(o) ? shares[sl] : ref,
             pmiPct: S.pmiEdited || S.downUnit === "pct" || !isBuy(o) ? v.pmi : defaultPmi(shares[sl]) };
  };
  const x = {
    a: opt("a"), b: opt("b"),
    // the term in months, and PMI's final month at that term's midpoint (edit list 4)
    downRefPct: ref,    // the reference purchase's share (display only; the engine reads a.downPct / b.downPct)
    ratePct: v.rate, term: 12 * S.term,
    closingPct: v.closing, sellingPct: v.selling, insGPct: v.insg,
    hoaGPct: v.hoag,    // every allowed pair has a purchase, and any purchase can carry an HOA fee
    costSwitch: DEF.costSwitch, pmiBelowPct: DEF.pmiBelow,
    pmiCancelPct: DEF.pmiCancel, pmiFinalMonth: S.term === 15 ? DEF.pmiFinal15 : DEF.pmiFinal,
    // renters insurance (edit list 9): NAIC dollar premium growing at CPI; the share-of-rent term is 0
    rentersPct: DEF.rentersPct, rentersUsd: DEF.rentersUsd, rinsGPct: DEF.cpi,
    // points: the default (0) since edit list 10 removed the field
    agentPct: v.agent, pointsPct: DEF.points, costFloorPct: DEF.costFloor, maintCapGPct: DEF.cpi,
    retPct: v.ret, savPct: v.sav,
    // up-front pot always brokerage; monthly pot at the retirement rate
    // under Retirement (2026-10-07)
    cgtDownPct: v.cgt, cgtDiffPct: S.account === "retirement" ? DEF.cgtRetirement : v.cgt,
    investDown: useFlags(S.downUse).invest, spendDown: useFlags(S.downUse).spend, saveDown: useFlags(S.downUse).save,
    investDiff: useFlags(S.diffUse).invest, spendDiff: useFlags(S.diffUse).spend, saveDiff: useFlags(S.diffUse).save
  };
  return { x: x, years: v.years, bad: bad };
}

// -------------------------------------------------------------- render
function condoTier(m){ return m.tb ? "condoB" : "condoA"; }
function metroLabel(m){ return metroName(m) + (pairHasCondo() && m.th ? "*" : ""); }
function defVars(){
  return { pmiBelow: pctTxt(DEF.pmiBelow), pmiCancel: pctTxt(DEF.pmiCancel), stay: DEF.stay,
           startYear: DEF.startYear, hoaG: pctTxt(DEF.hoaG), insG: pctTxt(DEF.insG), down: pctTxt(DEF.down),
           hoaIdx: pctTxt(DEF.hoaIdx), flX: pctTxt(DEF.flX), flFrom: DEF.flFrom,
           pmi: pctTxt(defaultPmi(DEF.down)), cpi: pctTxt(DEF.costFloor), stayMax: DEF.stayMax };
}
// The wash band (review L1, 2026-10-07): max(DEF.wash, DEF.washPct% of the
// larger of the two options' total paid at the stay); z = that year's row.
function washBand(z){ return Math.max(DEF.wash, DEF.washPct / 100 * Math.max(z.a.paid, z.b.paid)); }
function nameVars(){
  const A = optCopy(S.optA), B = optCopy(S.optB);
  return { A: cap(A.gerund), a: A.gerund, B: cap(B.gerund), b: B.gerund };
}

// The pair picker's two lists. B excludes A, and both rentals when A is a
// rental.
function syncPairPicker(){
  const fillSel = function(sel, keys, cur){
    sel.innerHTML = "";
    keys.forEach(function(k){
      const op = document.createElement("option");
      op.value = k; op.textContent = optCopy(k).name; op.selected = k === cur; sel.appendChild(op);
    });
  };
  fillSel($("opt-a"), OPTION_KEYS, S.optA);
  fillSel($("opt-b"), OPTION_KEYS.filter(function(k){ return validPair(S.optA, k); }), S.optB);
  $("sw-a").style.background = OPTION_COLOR[S.optA];
  $("sw-b").style.background = OPTION_COLOR[S.optB];
}

// The HOA fee box (edit list 10, 2026-10-08): one box per slot, #ctl-a-hoa /
// #ctl-b-hoa, holding the one HOA field. For a condo purchase it sits in the
// main row right after that slot's price (Houston: the fee is a first-order
// input for a condo); for a house it sits in Adjust costs, where it always
// was (default $0), at its marker #hoa-home-a / -b. Moving the box keeps its
// value, its share-link parameter (af / bf) and every reference by id. Moved
// only when it is in the wrong place (a pair change, a swap or load), so a
// focused field is never moved by typing.
function placeHoa(){
  ["a", "b"].forEach(function(sl){
    const ctl = $("ctl-" + sl + "-hoa"), o = sl === "a" ? S.optA : S.optB;
    const inMain = o === "buy_condo", after = inMain ? $("ctl-" + sl + "-price") : $("hoa-home-" + sl);
    if (after.nextElementSibling !== ctl) after.after(ctl);
    ctl.classList.toggle("optsec", inMain);
  });
}
function paintStatic(){
  const m = metroById(S.metroId), dv = defVars();
  [["down-seg", "use", S.downUse], ["diff-seg", "use", S.diffUse], ["acct-seg", "acct", S.account], ["term-seg", "term", String(S.term)]].forEach(function(g){
    document.querySelectorAll("#" + g[0] + " button").forEach(function(b){
      const on = b.dataset[g[1]] === g[2];
      b.classList.toggle("active", on); b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  });
  // show only the blocks that apply to each slot's option
  document.querySelectorAll("[data-slot]").forEach(function(el){
    el.hidden = !slotUses(el.dataset.slot, el.dataset.for);
  });
  document.querySelectorAll("[data-for-pair]").forEach(function(el){ el.hidden = el.dataset.forPair === "condoHouse" ? !pairCondoHouse() : !pairHasCondo(); });
  placeHoa();          // a condo's HOA fee in the main row, a house's in Adjust costs (edit list 10)
  // the main row's column count: one per visible option field (3 or 4)
  const nopt = Array.prototype.filter.call($("optrow").children, function(el){ return el.classList.contains("ctl") && !el.hidden; }).length;
  $("optrow").style.setProperty("--nopt", nopt); $("optrow").dataset.n = nopt;
  document.querySelectorAll("[data-sw]").forEach(function(el){
    el.style.background = OPTION_COLOR[el.dataset.sw === "a" ? S.optA : S.optB];
  });
  $("acct-seg").setAttribute("aria-label", COPY.account.label);
  $("term-seg").setAttribute("aria-label", COPY.term.label);
  document.querySelectorAll("#term-seg button").forEach(function(b){
    b.setAttribute("aria-label", COPY.term[b.dataset.term === "15" ? "y15" : "y30"]);
  });
  const F = COPY.fields;
  // down payment unit switch, field, label and share line (edit list 5)
  document.querySelectorAll("#downunit button").forEach(function(b){
    const on = b.dataset.unit === S.downUnit;
    b.classList.toggle("active", on); b.setAttribute("aria-pressed", on ? "true" : "false");
    b.setAttribute("aria-label", b.dataset.unit === "pct" ? F.down.unitPctLabel : F.down.unitUsdLabel);
  });
  document.querySelectorAll("#down-ctl [data-downunit]").forEach(function(el){ el.hidden = el.dataset.downunit !== S.downUnit; });
  $("lab-down").setAttribute("for", S.downUnit === "usd" ? "in-downusd" : "in-down");
  const dn = $("down-note"), dsv = S.downUnit === "usd" ? downShareVars() : null;
  if (S.downUnit !== "usd"){ dn.textContent = ""; dn.className = "downnote off"; }
  else if (dsv){ dn.textContent = fill(dsv.two ? F.down.noteTwo : F.down.noteOne, dsv); dn.className = "downnote"; }
  else {
    const u = readField("downusd"), over = buySlots().filter(function(sl){ const p = readField(sl + "_price"); return isFinite(u) && isFinite(p) && u >= p; })[0];
    dn.textContent = over ? fill(F.down.noteOver, { noun: optCopy(over === "a" ? S.optA : S.optB).noun }) : "";
    dn.className = "downnote warn";
  }
  // property tax unit switches and fields
  ["a", "b"].forEach(function(sl){
    document.querySelectorAll("#" + sl + "-taxunit button").forEach(function(b){
      const on = b.dataset.unit === S.taxUnit[sl];
      b.classList.toggle("active", on); b.setAttribute("aria-pressed", on ? "true" : "false");
      b.setAttribute("aria-label", b.dataset.unit === "pct" ? F.tax.unitPctLabel : F.tax.unitUsdLabel);
    });
    const ctl = $("in-" + sl + "-tax").closest(".ctl");
    ctl.querySelectorAll("[data-taxunit]").forEach(function(el){ el.hidden = el.dataset.taxunit !== S.taxUnit[sl]; });
    $("lab-" + sl + "-tax").setAttribute("for", S.taxUnit[sl] === "usd" ? "in-" + sl + "-taxusd" : "in-" + sl + "-tax");
  });
  // per-slot labels, headings and help
  ["a", "b"].forEach(function(sl){
    const o = sl === "a" ? S.optA : S.optB, oc = optCopy(o), nv = { Noun: cap(oc.noun), noun: oc.noun };
    if (isBuy(o)){
      // help-text key: condo tier A / B or house, or the national (US) variants
      const tk = m.us ? (o === "buy_condo" ? "condoUS" : "houseUS") : (o === "buy_condo" ? condoTier(m) : "house");
      $("lab-" + sl + "-price").textContent = fill(F.price.label, nv);
      $("lab-" + sl + "-app").textContent = fill(F.app.label, nv);
      $("head-" + sl + "-cost").textContent = fill(COPY.costHead, nv);
      if (S.taxUnit[sl] === "usd"){
        const dl = readField(sl + "_taxusd"), pr = readField(sl + "_price");

// ---- "Match monthly cost" (Houston, edit list 6, 2026-10-08), LIVE since
// edit list 8 (2026-10-08). Under each option's price or rent: matching sets
// that field so the option's first-month recurring cost equals the other
// option's, to the dollar shown in the card, AND locks it there
// (S.matchLock = "a" | "b"): refresh() re-solves the locked field from the
// current inputs before every render (resolveLock()), so it follows any
// other change (rate, term, down payment, taxes, fees, metro, the other
// option's price or rent). Only one side can be locked; the other side's
// button is hidden meanwhile. The locked field is read-only, tinted, with a
// link icon. Its button reads "Back to typical ...", which unlocks and
// restores the metro's prefilled value; Reset and a pair change also

// Unlocked, a value that differs from the typical one (typed) offers the

function slotMainKey(sl){ return isBuy(sl === "a" ? S.optA : S.optB) ? "price" : "rent"; }
function typicalVal(sl){ return metroDefaults(metroById(S.metroId), sl === "a" ? S.optA : S.optB)[slotMainKey(sl)]; }
// The two options' first-month recurring costs from the page's own inputs
// and engine (null if an input is invalid).
function m1Costs(){
  const inp = readInputs();
  if (inp.bad.length) return null;
  const sim = simulatePair(inp.x, 1);
  return { a: sim.month1.a.cost, b: sim.month1.b.cost };

const matchTimers = {};
// A "Can't match" / "Closest" message (edit list 9: short forms): why =

// list of forms runs longest first; fitMsg() shows the longest that fits on

function msgForms(why, amt){ return COPY.match.cant[why].map(function(t){ return fill(t, { amt: money(amt || 0) }); }); }
function fitMsg(m, forms){

  }

// shows a message in place of the button (forms = null clears it); temporary
// (6 s) unless held, as for a lock that can't match
function matchMsg(sl, k, forms, hold){
  const btn = $("match-" + sl + "-" + k), m = $("matchmsg-" + sl + "-" + k);
  clearTimeout(matchTimers[sl + k]);
  btn.style.display = forms ? "none" : "";
  if (forms) fitMsg(m, forms); else { m.textContent = ""; m.title = ""; }
  if (forms && !hold) matchTimers[sl + k] = setTimeout(function(){ matchMsg(sl, k, null); }, 6000);

// Solves slot sl's price or rent so its first-month cost equals the other
// option's, writing trial values into the field (the page's own cost
// function). Returns { val, msg, ok }: val = the value to hold (null if the
// inputs are invalid), ok = false when no value matches (val is then the
// closest feasible one), msg = "" or the "Can't match" / "Closest" text.
function solveMatch(sl){
  const k = slotMainKey(sl), other = sl === "a" ? "b" : "a", key = sl + "_" + k, M = COPY.match;
  const c0 = m1Costs(); if (!c0) return { val: null, msg: "", ok: false };
  const T = c0[other], TR = Math.round(T);
  const costAt = function(v){ setField(key, v); const c = m1Costs(); return c ? c[sl] : NaN; };
  if (k === "rent"){
    // first-month cost = rent x (1 + renters insurance share) + other fees:
    // solved directly, then the whole-dollar (else cent) rent whose total
    // shows the same dollar figure
    const fees = fieldApplies(sl + "_fees") && isFinite(readField(sl + "_fees")) ? readField(sl + "_fees") : 0;
    const exact = (T - fees - DEF.rentersUsd) / (1 + DEF.rentersPct / 100);   // year-1 renters insurance in $ (edit list 9)
    if (!(exact >= 1)) return { val: 1, why: "rent", ok: false };
    const cands = [Math.round(exact), Math.floor(exact), Math.ceil(exact), Math.round(exact * 100) / 100];
    for (let i = 0; i < cands.length; i++) if (cands[i] > 0 && Math.round(costAt(cands[i])) === TR) return { val: cands[i], why: "", ok: true };
    return { val: Math.round(exact * 100) / 100, why: "", ok: true };
  }
  // price: bisection on the page's own first-month cost (P&I, PMI band,
  // tax, insurance, maintenance with the house cap, HOA), which rises with
  // the price, to the nearest $1; with a dollar down payment the price
  // must stay above it
  const usd = S.downUnit === "usd" ? readField("downusd") : NaN;
  let lo = isFinite(usd) ? Math.floor(usd) + 1 : 1, hi = FIELDS[key].max;
  if (!(costAt(lo) <= T)) return { val: lo, why: isFinite(usd) ? "down" : "fixed", ok: false };
  if (!(costAt(hi) >= T)) return { val: hi, why: "fixed", ok: false };
  while (hi - lo > 1){ const mid = Math.floor((lo + hi) / 2); if (costAt(mid) >= T) hi = mid; else lo = mid; }
  // hi: the smallest whole-dollar price whose cost reaches the target
  const ch = costAt(hi), cl = costAt(lo);
  if (Math.round(ch) === TR) return { val: hi, why: "", ok: true };
  if (Math.round(cl) === TR) return { val: lo, why: "", ok: true };
  // a PMI band jump: the closer of the two, and say so
  const val = Math.abs(ch - T) <= Math.abs(cl - T) ? hi : lo;

// The lock's re-solve, run by refresh() before every render. Its time is

function resolveLock(){

  const r = solveMatch(sl);

  st.n++; st.last = ms; st.max = Math.max(st.max, ms); st.total += ms;

  // also reverts) until a value matches again (edit list 9); paintMatch() shows it
  if (r.val !== null) S.lockMsg = r.why ? { why: r.why, amt: r.amt } : null;

  const r = solveMatch(sl);
  // nothing to match at all (the other option's cost is out of reach): no lock

    el.value = old; refresh(); if (r.why) matchMsg(sl, k, msgForms(r.why, r.amt)); return;

}
function unlockMatch(){

}
function backToTypical(sl){

// Labels, visibility and the lock's look, after every render (ok = the

function paintResults(inp){
  const bad = inp.bad;
  $("invalid").hidden = bad.length === 0;
  $("outputs").hidden = bad.length > 0;
  if (bad.length){
    paintMatch(false);
    const k = bad[0], f = FIELDS[k], lab = document.querySelector('label[for="' + f.id + '"]');
    const lbl = lab ? labText(lab) : k;        // growth labels name their option (2026-10-08)
    $("invalid").textContent = fill(COPY.invalid, { field: lbl });
    return;
  }
  const x = inp.x, N = inp.years, H = COPY.hero, nv = nameVars();
  const sim = simulatePair(x, DEF.beHorizon), yN = sim.years[N - 1];
  const band = washBand(yN);
  ROWCHK = [];
  const oc = { A: optCopy(S.optA), B: optCopy(S.optB) };

  // (1) headline: the option ahead at the stay (the lower net cost; the
  // engine's gap = net gain A - net gain B = net cost B - net cost A)
  const gap = yN.gap, wash = Math.abs(gap) < band;
  const lead = gap >= 0 ? "A" : "B", trail = lead === "A" ? "B" : "A";
  const hero = $("hero");
  hero.classList.toggle("wash", wash);
  hero.style.borderLeftColor = wash ? "" : OPTION_COLOR[lead === "A" ? S.optA : S.optB];
  // two purchases: a cost statement, not "better off" (review M7)
  const twoBuys = isBuy(S.optA) && isBuy(S.optB);
  $("hero-main").textContent = wash ? fill(H.wash, { n: N, yrs: yrsWord(N), band: verdictAmt(band), a: oc.A.gerund, b: oc.B.gerund })
    : fill(twoBuys ? H.costsLess : H.ahead, { n: N, yrs: yrsWord(N), amt: verdictAmt(gap), lead: oc[lead].gerund,
                                              Lead: cap(oc[lead].gerund), trail: oc[trail].gerund });
  // home-sale exclusion warnings (review L2): a stay under the ownership
  // test, or a modeled gain (value - price) above the single exclusion
  const warns = [];
  if (N < DEF.exclMinYears) warns.push(fill(H.warnShort, { min: DEF.exclMinYears }));
  [["a", S.optA], ["b", S.optB]].forEach(function(p){
    if (isBuy(p[1]) && yN[p[0]].appreciation > DEF.exclSingle)
      warns.push(fill(H.warnGain, { noun: optCopy(p[1]).noun, amt: verdictAmt(yN[p[0]].appreciation),
                                    single: money(DEF.exclSingle), joint: money(DEF.exclJoint) }));
  });
  $("hero-warn").hidden = !warns.length; $("hero-warn").textContent = warns.join(" ");
  paintAssume(x, N);
  // crossover as shown (display rule: a late reversal with its crossover
  // after stayMax years reads "doesn't pull ahead within stayMax years")
  const cx = sim.crossover, shown = crossoverShown(cx, DEF.stayMax), payoffYears = x.term / 12;
  if (cx.leader1 === "tie") $("hero-be").textContent = H.tieYear1;
  else {
    const over = oc[cx.overtaker], under = oc[cx.leader1];
    const ov = { Over: cap(over.gerund), under: under.gerund };
    const overOpt = cx.overtaker === "A" ? S.optA : S.optB;
    $("hero-be").textContent = shown === null
      ? (cx.year === null ? fill(H.crossNever, Object.assign({ max: DEF.beHorizon }, ov)) : fill(H.crossNotWithin, Object.assign({ stayMax: DEF.stayMax }, ov)))
      : (isBuy(overOpt) && shown > payoffYears
          ? fill(H.crossAfterPayoff, Object.assign({ y: shown, z: shown - payoffYears, zyrs: yrsWord(shown - payoffYears) }, ov))
          : fill(H.cross, Object.assign({ y: shown, yrs: yrsWord(shown) }, ov)));
  }

  // (2) the first month's RECURRING costs, two option columns (edit list 4,
  // 2026-10-08: relabelled; the up-front costs are in the totals over the
  // stay, which the note under the table says)
  const M1 = COPY.month1, ma = sim.month1.a, mb = sim.month1.b, R = M1.rows;
  const d1 = sim.month1.diff;
  $("m1-verdict").textContent = Math.round(Math.abs(d1)) === 0 ? fill(M1.even, nv) : fill(d1 > 0 ? M1.more : M1.less, Object.assign({ amt: money(d1) }, nv));
  $("m1-upfront").textContent = fill(M1.upfront, { n: N, yrs: yrsWord(N) });
  const bA = isBuy(S.optA), bB = isBuy(S.optB);
  const pick = function(isB, v){ return isB ? v : null; };
  let html = head2(), sumA = 0, sumB = 0;
  const m1rows = [["pi", true], ["pmi", ma.pmi > 0 || mb.pmi > 0], ["tax", true], ["ins", true],
                  ["hoa", ma.hoa > 0 || mb.hoa > 0], ["maint", true], ["assess", ma.assess > 0 || mb.assess > 0]];
  // the HOA fee row shows when either purchase has a fee (a house defaults to $0)
  if (bA || bB) m1rows.forEach(function(r){
    if (!r[1]) return;
    const va = pick(bA, ma[r[0]]), vb = pick(bB, mb[r[0]]);
    html += row2(R[r[0]], va, vb); sumA += va === null ? 0 : Math.round(va); sumB += vb === null ? 0 : Math.round(vb);
  });
  // a rental's other monthly fees show even at $0 (edit list 4)
  if (!bA || !bB) [["rent"], ["rins"], ["fees"]].forEach(function(r){
    const va = pick(!bA, ma[r[0]]), vb = pick(!bB, mb[r[0]]);
    html += row2(R[r[0]], va, vb); sumA += va === null ? 0 : Math.round(va); sumB += vb === null ? 0 : Math.round(vb);
  });
  html += row2(R.total, ma.cost, mb.cost, "total");
  // over the optional monthly budget (edit list 6): a flag under that
  // column's total, with the option named for screen readers
  const ob = overBudget(ma, mb), B = COPY.budget;
  if (ob.a > 0 || ob.b > 0){
    const flag = function(amt, o){ return amt > 0 ? '<span class="sr">' + esc(fill(B.flagSr, { Col: optCopy(o).col })) + '</span>' +
      esc(fill(B.flag, { amt: money(amt) })) : ""; };
    html += '<tr class="overbud"><td></td><td class="amt">' + flag(ob.a, S.optA) + '</td><td class="amt">' + flag(ob.b, S.optB) + '</td></tr>';
  }
  const hb = $("hero-budget");
  hb.hidden = !(ob.a > 0 || ob.b > 0);
  hb.textContent = ob.a > 0 && ob.b > 0
    ? fill(B.both, { bud: money(ob.bud), a: oc.A.gerund, b: oc.B.gerund, amtA: money(ob.a), amtB: money(ob.b) })
    : (ob.a > 0 || ob.b > 0 ? fill(B.one, { A: cap((ob.a > 0 ? oc.A : oc.B).gerund), amt: money(ob.a > 0 ? ob.a : ob.b), bud: money(ob.bud) }) : "");
  $("m1-table").innerHTML = html;
  // edit list 1: the general note is gone; the rounding note shows only
  // when the rows don't add to the totals
  const rounding = sumA !== Math.round(ma.cost) || sumB !== Math.round(mb.cost);
  $("m1-note").textContent = rounding ? M1.roundingNote : "";
  $("m1-note").hidden = !rounding;
  paintMatch(true, ma, mb);

  // (3) ledger over N years: what each option pays and keeps, its net cost
  // (Houston, 2026-10-07: total paid - what you keep - investment growth
  // after tax, the engine's net with the sign reversed), and the money it
  // frees up (Houston, 2026-10-07)
  const Lg = COPY.ledger, LR = Lg.rows, a = yN.a, b = yN.b;
  $("ledger-heading").textContent = fill(Lg.heading, { n: N, yrs: yrsWord(N) });
  let t = head2();
  t += '<tr class="sec"><td colspan="3">' + esc(Lg.paid) + '</td></tr>';
  const lrow = function(label, va, vb, show){
    if (show === false) return;
    t += row2(label, va, vb);
  };
  if (bA || bB){
    lrow(LR.down, pick(bA, a.down), pick(bB, b.down));
    lrow(LR.closing, pick(bA, a.closing), pick(bB, b.closing));
    // 2026-10-07: rows only when nonzero for either option
    lrow(LR.agent, pick(bA, a.agent), pick(bB, b.agent), a.agent > 0 || b.agent > 0);
    lrow(LR.points, pick(bA, a.points), pick(bB, b.points), a.points > 0 || b.points > 0);
    lrow(LR.pi, pick(bA, a.interest + a.principal), pick(bB, b.interest + b.principal));
    lrow(LR.pmi, pick(bA, a.pmi), pick(bB, b.pmi), a.pmi > 0 || b.pmi > 0);
    lrow(LR.tax, pick(bA, a.tax), pick(bB, b.tax));
    lrow(LR.ins, pick(bA, a.ins), pick(bB, b.ins));
    lrow(LR.hoa, pick(bA, a.hoa), pick(bB, b.hoa), a.hoa > 0 || b.hoa > 0);
    lrow(LR.maint, pick(bA, a.maint), pick(bB, b.maint));
    lrow(LR.assess, pick(bA, a.assess), pick(bB, b.assess), a.assess > 0 || b.assess > 0);
  }
  if (!bA || !bB){
    // a rental's move-in costs and other fees show even at $0, so readers see
    // the calculator counts them (edit list 4, 2026-10-08)
    lrow(LR.movein, pick(!bA, a.moveIn), pick(!bB, b.moveIn));
    lrow(LR.rent, pick(!bA, a.rent), pick(!bB, b.rent));
    lrow(LR.rins, pick(!bA, a.rins), pick(!bB, b.rins));
    lrow(LR.fees, pick(!bA, a.fees), pick(!bB, b.fees));
  }
  t += row2(LR.paidTotal, a.paid, b.paid, "total");
  t += '<tr class="sec"><td colspan="3">' + esc(Lg.keep) + '</td></tr>';
  // equity after the costs to sell, with the two parts as indented sub-lines
  if (bA || bB){
    // signed: negative equity (underwater, or selling costs above equity)
    // shows a minus sign (review H2, 2026-10-07)
    t += row2(LR.equityNet, pick(bA, a.equityNet), pick(bB, b.equityNet), null, minusMoney);
    t += row2(LR.equityGross, pick(bA, a.equity), pick(bB, b.equity), "sub", minusMoney);
    t += row2(LR.selling, pick(bA, -a.selling), pick(bB, -b.selling), "sub", signedMoney);
  }
  const invested = a.basis > 0 || b.basis > 0, saved = a.savBasis > 0 || b.savBasis > 0;
  if (invested || saved) t += row2(invested && saved ? LR.growthBoth : (saved ? LR.growthSav : LR.growth),
                                   a.growth - a.gtax, b.growth - b.gtax, null, signedMoney);
  // a cash-stack icon on the lower net cost (edit list 8; a check mark from edit list 1); none on a wash, the
  // same rule as the verdict (no option is ahead within the wash band)
  t += row2(LR.net, -a.net, -b.net, "net", costMoney, wash ? null : [lead === "A", lead === "B"]);
  // money freed up: amount and what happened to it
  const freedText = function(z){
    if (Math.round(z.freedTotal) < 1) return Lg.freedNone;
    const parts = [], up = Math.round(z.freedUp) >= 1, mo = Math.round(z.freedMonthly) >= 1;
    if (up && mo && S.downUse === S.diffUse) parts.push(useWord(Lg.freedUse, S.downUse));
    else {
      if (up) parts.push(fill(Lg.freedUp, { use: useWord(Lg.freedUse, S.downUse) }));
      if (mo) parts.push(fill(Lg.freedMonthly, { use: useWord(Lg.freedUse, S.diffUse) }));
    }
    if (z.basis > 0 || z.savBasis > 0)
      parts.push(fill(z.basis > 0 && z.savBasis > 0 ? Lg.freedGrewBoth : (z.basis > 0 ? Lg.freedGrew : Lg.freedGrewSav),
                      { amt: money(z.port - z.gtax + z.sav) }));
    // already counted: total paid A - total paid B = freed up B - freed up A
    const other = z === a ? b : a;
    parts.push(Math.round(other.freedTotal) < 1 ? fill(Lg.freedCounted, { amt: money(other.paid - z.paid) }) : Lg.freedCountedBoth);
    return parts.join("; ");
  };
  t += row2(LR.freed, a.freedTotal, b.freedTotal);
  t += row2("", freedText(a), freedText(b), "muted");
  $("ledger").innerHTML = t;
  signCheck();
  // the card's one note (edit list 1: the money-freed-up, rounding and
  // today's-dollars lines and the "What you'd have" card were removed)
  $("ledger-memo").textContent = Lg.memo;

  // (4) chart: the animated chart re-renders its current step in place
  paintAnim(sim, N, $("hero-be").textContent);
}

// =====================================================================
// ANIMATED CHART (Phase 2, Houston, 2026-10-07; revised the same day from
// ten click-through steps to six, each an automatic sequence of phases).
// Replaces the interim "Both paths / Difference only" toggle.
// NET COST ORIENTATION (Houston, 2026-10-07). The chart plots each option's
// NET COST = total paid - what comes back (home equity after the costs to
// sell, and investment growth after tax), which is the engine's net gain or
// loss with the sign reversed (sl.cost = -net). Costs go up; lower is
// better; a value below zero is a net gain. The engine and every number are
// unchanged: only the presentation sign flips.
//   1  the first option (A): its costs build upward from zero, one band at
//      a time;
//   2  they merge into one "Total paid" line (dashed, labelled, and kept on
//      the chart while what comes back stacks), then what comes back stacks
//      DOWN from it one layer at a time, pulling the line lower: money put
//      into the home, appreciation, investment growth after tax; then the
//      costs to sell (a hatched band, drawn over the bottom of that stack)
//      push the line back up to the net cost;
//   3  A's layers collapse into A's net-cost line (which stays), then the
//      second option's (B's) costs build up;
//   4  B's costs merge into B's Total paid line, then what comes back to B
//      stacks down;
//   5  B's layers collapse into B's net-cost line, the gap between the two
//      lines is shaded in the colour of the option ahead (the LOWER line),
//      then the "Pulls ahead" and "Your stay" lines appear, then the
//      takeaway box at the sale year;
//   6  B's line glides to zero while A's becomes net cost A minus net cost
//      B (below zero: A costs less); the shading is carried along and the
//      y-axis rescales.
// SKIPPED "TOTAL" STEP (Houston, 2026-10-07). An option "has gains" if it is
// a purchase (equity always shows) or a rental with nonzero interest or
// investment growth (money freed up, saved or invested). A rental whose
// freed-up money is spent has nothing to stack, so its "total" step would only
// merge the bands: that merge is folded into the step its costs drop in,
// straight into one line (its total paid AND its net, labelled
// netPaidLabel), and the chart has five steps, not six. The step list is
// built per model (stepList(): kinds aCosts, aBack, bCosts, bBack, compare,
// diff), so the track, captions, keys and ?step= follow it:
//   B is the no-gains rental: aCosts | aBack | bCosts (A collapses, B's
//     costs drop in, merge into B's net) | compare (no collapse phase) | diff
//   A is the no-gains rental: aCosts (A's costs drop in, merge into A's net)
//     | bCosts (no A collapse phase) | bBack | compare | diff
// When an input change alters the list (a toggle gives the rental
// investment growth, or takes it away), remapStep() keeps the reader on the
// same kind of step, at the frame with the same content where there is one
// (a dropped "back" step maps to the end of that option's costs step, where
// it now merges into its net), and the chart tweens there in place.
// Every x position is "if you sell in that year", so each year's costs
// include that year's costs to sell (as in the ledger).
//
// PHASES. A step is a list of frames (stepFrames()). Each frame says, for
// each option, its phase (0 hidden, 1 costs, 2 total paid, 3 what comes
// back, 4 net line, "diff") and how many bands of a staggered phase are in,
// plus the comparison layers (cmp: 1 shading, 2 the vertical lines, 3 the
// takeaway box). AN.step and AN.pi (the frame within the step; null = the
// step's end state; -1 = the empty chart before step 1 plays) say what is
// drawn. A step plays its frames on timers: about 700ms for a phase
// (PHASE_MS, then PHASE_GAP to the next), the shorter band stagger for bands.
//
// NAVIGATION. Next mid-sequence tweens to the current step's end state
// (FINISH_MS) and then plays the next step; a second Next while that runs
// moves on at once. Back and the track jump (tweened) to a step's end state;
// Replay folds back to the empty chart and plays step 1. Right/Left arrow =
// Next/Back whenever the chart is in view or focus is in the chart card,
// never while typing in a field. Reduced motion: every step shows its end
// state at once, with no tweening and no attention cue.
//
// AUTOPLAY (Houston, 2026-10-07). On by default: once a step's own phases
// have finished, the chart waits AUTO_DWELL_MS (5 seconds since 2026-10-08; 8 seconds since Houston's
// edit list 3, 2026-10-08, was 12; so the reader can read the finished step) and plays the next step; it stops on the last
// step (no loop). The first step starts when the chart scrolls into view,
// as before. Turned OFF (a pause, which only the reader can undo) by Pause,
// Back, the Left arrow, any track segment, Home / End and Skip to
// comparison: each says the reader wants to study a particular step. Turned
// back ON by Play, Next, the Right arrow (and Enter on the chart) and Replay
// (which starts again from step 1). Next mid-sequence still finishes the
// step and plays the next; the dwell restarts once that step has finished.
// Off by default under reduced motion (Play still turns it on; Next and
// Replay don't, since nothing was paused), with ?autoplay=0, and with
// ?step / ?chart=diff (the reader landed on a chosen step). The countdown
// HOLDS, without pausing autoplay, while: the pointer is over the chart (or
// a touch tooltip is open, until the next tap elsewhere); keyboard focus is
// in the chart card outside the step navigation; the chart is scrolled out
// of view; the tab is hidden; the page is printing. After a hover or focus
// hold it resumes with what was left (at least AUTO_RESUME_MIN_MS); after
// being out of view, hidden or printed it starts the full dwell again. An
// input edit (any refresh) keeps the step and restarts its dwell. The
// countdown is drawn along the bottom of Next. AN.log records the events
// (checked in the browser, 2026-10-07).
//
// PULLS AHEAD. The dashed vertical line sits where the two net lines cross,
// between year ends: x = y0 + gap0 / (gap0 - gap1) on the segment that ends
// at the crossover year the page reports (crossoverShown()), the same point
// the shared drawing grid already includes. The wording ("pulls ahead after
// N years") stays year-end based.
//
// CONTINUITY. One ECharts instance, never replaced. Every update is a
// setOption() with the same 42 series and stable ids, merged (notMerge:
// false), so each element tweens from where it is to where it goes. All
// bands, lines, labels and markers are custom series: ECharts animates their
// geometry AND their style (opacity, colour) between updates, and an update
// that arrives mid-tween starts from the element's current, half-way
// position (checked in the browser, 2026-10-07), so fast clicking or typing
// never makes anything jump. Bands never appear or disappear: they are kept
// at zero thickness, parked on the line they grow from or collapse into.
// The y-axis range is fixed across every step but the last (the difference)
// for a given set of inputs (it spans every layer of both options, both
// net costs and zero, so a net gain below zero fits) and changes only for
// that last step, where the axis and every
// element tween together. To keep the
// shading exact through crossings, every series is drawn on one shared grid
// of x positions: each year plus one point per year-to-year segment, placed
// where the two nets cross (A - B = 0) if they cross in that segment and at
// the midpoint otherwise. Because A - B is the same in steps 5 and 6, the
// crossing points do not move in the final morph.
//
// CHECK. After every render, checkAnim() reads the plotted values back from
// chart.getOption() and asserts, for every year, that they equal the
// engine's: each cost band is its component, stacked upward from zero, and
// the components add up to total paid; the Total paid line is total paid;
// total paid - what comes back + selling costs equals the net cost; each
// line is its option's net cost (= -net); in step 6 the line equals net
// cost A minus net cost B (= -gap); the shading spans the gap, in the
// colour of the lower line; once an option is at its net-cost line every
// band has zero thickness on it, and an option with no gains (merged
// straight from its costs) has one line that is both total paid and its
// net cost, with nothing stacked on it; the step list has a "back" step
// exactly for each option with gains. It also asserts three engine
// identities every year: total paid A - total paid B = money freed up by B
// - by A; net = equity after selling costs - total paid + investment growth
// after tax; and net cost = total paid - equity at sale + selling costs -
// investment growth after tax. Result in window.__chartCheck; any mismatch
// is logged with console.error.
// =====================================================================
const MAX_STEPS = 6;   // the most steps the chart ever has (track segments built up front)
// Costs are out of pocket during the stay. The costs to sell come out of the
// sale proceeds (Houston, 2026-10-07), so they are not a cost band: they are
// the last layer of "what comes back", a hatched band drawn over the bottom
// of the equity stack that pushes the line back up, so the line ends at the
// net cost after selling costs. Last, because a layer that reverses
// direction anywhere earlier would overlap the layers after it.
// agent, points and assess added 2026-10-07 (zero bands are dropped).
// movein and fees (a rental's move-in costs and other fees) added in edit list 4, 2026-10-08.
const COMP_KEYS = ["down", "closing", "agent", "points", "movein", "mort", "pmi", "tax", "ins", "hoa", "maint", "assess", "rent", "rins", "fees"];
const POS_KEYS = ["putIn", "app", "growth", "sell"];
// Layer colours. Money paid out is neutral grey (alternating lighter and

// option's line colour, so the full-strength net-cost line stays
// visible). Investment growth is the
// desaturated light red already used in other Inman tools (#f4a582), so it
// reads apart from both blues and from the rentals' reds. Swatches carry a
// faint outline so the lightest greys stay visible.
const COST_COLOR = { down: "#74747c", closing: "#c9c9cf", agent: "#8b8b93", points: "#d9d9de", mort: "#9a9aa2", pmi: "#e2e2e7",
                     tax: "#b1b1b8", ins: "#d7d7dc", hoa: "#85858d", maint: "#bfbfc6", assess: "#6a6a72",
                     rent: "#9a9aa2", rins: "#d0d0d6", movein: "#6f6f77", fees: "#8c8c94" };
const TOTAL_COLOR = "#c4c5ce";
// The Total paid line: a dashed dark grey, distinct from every option colour,
// drawn above the bands so the gains never hide it.
const PAID_COLOR = "#4d5266";
const EQUITY_COLOR = { buy_condo: { putIn: "#cde5ff", app: "#6cb4ff" }, buy_house: { putIn: "#cfd1e8", app: "#7c80b4" } };
const GROWTH_COLOR = "#f4a582";
// Selling costs: dark-blue hatching on a half-white wash, drawn over the top
// of the equity stack it trims (a plain translucent wash if canvas patterns
// are unavailable).
let sellFillCache = null;
function sellFill(){
  if (sellFillCache) return sellFillCache;
  try {
    const c = document.createElement("canvas"), n = 6; c.width = n; c.height = n;
    const x = c.getContext("2d");
    x.fillStyle = "rgba(255,255,255,0.6)"; x.fillRect(0, 0, n, n);
    x.strokeStyle = "rgba(22,26,72,0.6)"; x.lineWidth = 1.1; x.beginPath();
    [[-1, 1, 1, -1], [0, n, n, 0], [n - 1, n + 1, n + 1, n - 1]].forEach(l => { x.moveTo(l[0], l[1]); x.lineTo(l[2], l[3]); });
    x.stroke();
    sellFillCache = { image: c, repeat: "repeat" };
  } catch (e){ sellFillCache = "rgba(22,26,72,0.25)"; }

}
const ANIM_EASE = "cubicInOut";
const STEP_MS = 750;                    // a jump to a step's end state, and the final morph
const PHASE_MS = 700, PHASE_GAP = 780;  // a phase (merge, collapse, shading, lines, box), and the wait before the next
const SUB_MS = 430, SUB_GAP = 470;      // one band of a staggered phase, and the gap to the next
const FINISH_MS = 450;                  // Next mid-sequence: the quick tween to the step's end state
const CUE_IDLE_MS = 8000;               // the attention cue returns after this long idle
// Autoplay (Houston, 2026-10-07): the dwell on a finished step before the
// chart moves on by itself, counted from the end of that step's own phases;
// and the least a held countdown resumes with (see AUTOPLAY below).
// 5 seconds since 2026-10-08 (Houston; 8 in edit list 3, 12 before). The countdown
// bar on Next, the Play label and the chart note all derive from it.
const AUTO_DWELL_MS = 5000;
const AUTO_RESUME_MIN_MS = 3000;
const CHART_FONT = "Libre Franklin, Helvetica Neue, Arial, sans-serif";
const AN = { step: 1, pi: -1, playing: false, finishing: false, started: false, timers: [], m: null, cross: "",
             reduced: false, forceReduced: false, io: null, inView: false, advanced: false, lastAct: 0, cueTimer: 0,
             // autoplay: on (the reader's setting), why it is off ("user" =
             // paused by the reader, "param" = ?autoplay=0, "link" = ?step /
             // ?chart=diff, "reduced" = reduced motion), the countdown timer,
