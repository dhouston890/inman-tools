// --------------------------------------------------------- pair picker
// Choosing a new option resets that slot's inputs to its defaults; if the
// pair becomes invalid (an option against itself, or two rentals), option B
// moves to option A's counterpart and is reset too. Swap exchanges the two
// slots' values, so the reader's edits travel with their option.
function setPair(a, b, changed){
  const hadCondo = pairHasCondo();
  unlockMatch();       // a new pair ends a live match (edit list 8)
  S.optA = a; S.optB = b;
  if (!validPair(S.optA, S.optB)){ S.optB = COUNTERPART[S.optA]; changed = changed.concat(["b"]); }
  changed.forEach(function(sl){ applySlotDefaults(sl, "option"); });
  syncPairPicker();
  if (hadCondo !== pairHasCondo()) syncMetroPicker();      // the "*" thin-market marker
  refresh();
}
function swapPair(){
  Object.keys(SLOT_FIELDS).forEach(function(k){
    const ea = $("in-a-" + k), eb = $("in-b-" + k), t = ea.value;
    ea.value = eb.value; eb.value = t;
  });
  const tu = S.taxUnit.a; S.taxUnit.a = S.taxUnit.b; S.taxUnit.b = tu;
  const t = S.optA; S.optA = S.optB; S.optB = t;
  if (S.matchLock) S.matchLock = S.matchLock === "a" ? "b" : "a";   // the lock moves with its option (edit list 8)
  syncPairPicker(); refresh();
}
function initPairPicker(){
  syncPairPicker();
  // (an unexpected value leaves the pair as it was and redraws the lists)
  $("opt-a").addEventListener("change", function(){
    const v = $("opt-a").value;
    if (v !== S.optA && OPTION_TYPE[v]) setPair(v, S.optB, ["a"]); else syncPairPicker();
  });
  $("opt-b").addEventListener("change", function(){
    const v = $("opt-b").value;
    if (v !== S.optB && validPair(S.optA, v)) setPair(S.optA, v, ["b"]); else syncPairPicker();
  });
  $("swap").addEventListener("click", swapPair);
}

// ---------------------------------------------------------- live rate
// pmms.json since edit list 4 (2026-10-08): {"rate30", "rate15", "week",
// "source"}, both rates for the same week. The old one-rate shape {"rate",
// "week"} is still read: its rate is the 30-year, and the 15-year then stays
// the build-week reading only if the file's week is the build week (else the
// whole file is ignored, so the two terms never mix weeks).
function initRate(){
  S.rate = { rate: FALLBACK_RATE.rate, rate15: FALLBACK_RATE.rate15, week: FALLBACK_RATE.week, status: "pending" };
  const ctrl = window.AbortController ? new AbortController() : null;
  const timer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, PMMS_TIMEOUT_MS);
  fetch(PMMS_URL, { cache: "no-cache", signal: ctrl ? ctrl.signal : undefined })
    .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(j){
      const ok = function(v){ return typeof v === "number" && isFinite(v) && v > 0 && v < 20; };
      const okWeek = j && typeof j.week === "string" && /^\d{4}-\d{2}-\d{2}$/.test(j.week);
      // new shape: both rates; old shape: the 30-year only (same week as the build, or ignored)
      const r30 = j && ok(j.rate30) ? j.rate30 : (j && ok(j.rate) ? j.rate : NaN);
      const r15 = j && ok(j.rate15) ? j.rate15 : (okWeek && j.week === FALLBACK_RATE.week ? FALLBACK_RATE.rate15 : NaN);
      if (!isFinite(r30) || !isFinite(r15) || !okWeek) throw new Error("bad pmms.json");
      // A stale live file (e.g. a paused refresh) never replaces a newer
      // rate baked in at build time.
      // While the weekly refresh is inactive the build-week rates are kept, so
      // the label and the numbers always match.
      if (LIVE_RATE_ACTIVE && j.week >= FALLBACK_RATE.week) S.rate = { rate: r30, rate15: r15, week: j.week, status: "live" };
      else S.rate.status = "fallback";
    })
    .catch(function(){ S.rate.status = "fallback"; })
    .then(function(){
      clearTimeout(timer);
      if (!S.rateEdited) setField("rate", termRate(S.term));
      refresh();
    });
}

// ------------------------------------------------- shareable link (M11)
// Review M11 (2026-10-07). Every reader-edited input and toggle goes in the
// query, but only when it differs from its default, so a default link stays
// clean. The address bar follows along (standalone page only, debounced),
// and "Copy link" copies the same link; in an embed it copies the canonical
// tool URL (TOOL_URL) plus the query, not the WordPress page. readQuery() +
// applyQueryFields() restore everything, validated and clamped to each
// field's range. Parameter names (all optional):
//   a, b      the pair: buy-condo, buy-house, rent-apartment, rent-house
//   metro     a metro slug (miami-fl), a Zillow RegionID, or us
//   years     stay, 1-30            dp   down payment, %      rt  mortgage rate, %
//   term      loan term, 15 (the default 30 is left out; edit list 4, 2026-10-08)
//   lock      a | b: that option's price or rent is matched live to the other
//             option's monthly cost (edit list 8; no clash with any other
//             parameter); the value is re-solved on load, not carried
//   bud       optional monthly budget, $ (edit list 6, 2026-10-08; no clash:
//             no other parameter, and no slot parameter b + "ud")
//   dpd       down payment in dollars (edit list 5, 2026-10-08): its presence
//             opens the $ mode; written whenever the $ mode is on (dp is then
//             left out). No clash: dp, dd and the slot params (a*/b*) differ.
//   up        money not used up front: spend | save | invest
//   mo        monthly cost difference:  spend | save | invest
//             (legacy, 2026-10-07: up=cash / mo=cash, and use=cash or
//             use=<choice> for both pots when up / mo are absent, open on
//             spend, which gives identical numbers; see pageUse())
//   sav       savings yield, %       ret  investment return, %
//   account   brokerage | retirement (the switch on the tax-on-gains box)
//   (itx, the tax on savings interest, was retired in edit list 1; an old
//   link's itx= is ignored)
//   cgt       tax on investment gains, %
//   cl        closing costs, %       ag   buyer's agent fee, %
//   (pt, points, % of loan: field removed in edit list 10, 2026-10-08; an
//   old link's pt= is IGNORED, so it opens at the default, 0 points)
//   sell      costs to sell, %       ig   insurance growth, %    hg  HOA fee growth, %
//   pmi       PMI, % of loan a year (only when typed; else it follows dp)
//   ca        condo loan rate add-on, pct. pts; read and written only when a
//             condo is compared with a house since edit list 10 (an old
//             buy-vs-rent link's ca= is IGNORED: that pair uses the default, 0)
//   step      chart step, 1-6 (written when the reader is past step 1);
//             chart=diff still opens the last step
//   autoplay  0: open with the chart's autoplay paused (2026-10-07). Written
//             only when the reader paused it (or opened a link that had it);
//             not for reduced motion, where autoplay is simply off by default
//   motion    reduce (kept in the address bar; not in copied links)
//   Per option, the slot letter (a or b) then:
//     p price   r rent   h home value growth, %/yr   rg rent growth, %/yr
//     t property tax, % of value
//     (one flat growth rate per option since edit list 3, 2026-10-08; "ar"
//     and "ag" were taken (option A's rent, the agent fee), hence h / rg.
//     LEGACY LINKS: the old per-year h1 h2 h3 / r1 r2 r3 are read as follows:
//     h3 (year 3 on) becomes h and r3 becomes rg when h / rg are absent, and
//     h1, h2, r1, r2 are ignored: the flat rate replaces the old long-run
//     rate, and the early years no longer differ from it.)
//     tx property tax, $ a year (also switches that slot to dollars)
//     i insurance $/mo   f HOA fee $/mo   m maintenance, %
//     sa special assessment, $ (paid in year 1 since edit list 10)
//     (sy, the year it was paid, was removed in edit list 10: an old link's
//     asy= / bsy= is IGNORED, and its sa= amount is paid in year 1, inside
//     the stay)
//     mv a rental's move-in costs, $   fe its other monthly fees, $/mo

//     ag, the agent fee)
//   e.g. ?metro=miami-fl&ap=420000&af=950&atx=6100&dp=10&up=invest
//   Legacy ?view=condo|sfr still works.
const TOOL_URL = "https://dhouston890.github.io/inman-tools/buy-vs-rent-calculator/";
const Q_SHARED = { down: "dp", downusd: "dpd", rate: "rt", years: "years", sav: "sav", ret: "ret", cgt: "cgt",
                   closing: "cl", agent: "ag", selling: "sell", insg: "ig", hoag: "hg", pmi: "pmi", condoadd: "ca" };   // (no pt since edit list 10)
const Q_SLOT = { price: "p", rent: "r", app: "h", rg: "rg",
                 tax: "t", taxusd: "tx", ins: "i", hoa: "f", maint: "m", assess: "sa",   // (no sy since edit list 10)
                 movein: "mv", fees: "fe" };
// legacy per-year growth params (before 2026-10-08): year 3 on -> the flat rate
const Q_SLOT_LEGACY = { app: "h3", rg: "r3" };
function defaultMetroId(){ return METROS.slice().sort(function(a, b){ return a.o - b.o; })[0].id; }
// A metro in the link: "us", its slug if no other metro shares it, else its id.
function metroParam(m){
  if (m.us) return "us";
  const sl = slug(m.n);
  return METROS.filter(function(x){ return slug(x.n) === sl; }).length === 1 ? sl : String(m.id);
}
// A field's default under the current pair and metro.
function fieldDefault(k){
  const f = FIELDS[k];
  if (f.slot){
    const o = f.slot === "a" ? S.optA : S.optB;
    return Object.assign({}, metroDefaults(metroById(S.metroId), o), optionDefaults(o))[f.key];
  }
  return { down: DEF.down, rate: termRate(S.term), years: DEF.stay, sav: DEF.savYield, ret: DEF.ret,
           cgt: DEF.cgt, closing: DEF.closing, agent: DEF.agent, selling: DEF.selling,
           insg: DEF.insG, hoag: DEF.hoaG, pmi: defaultPmi(refDownPct()), condoadd: DEF.condoAdd }[k];

// The query for the current state. forCopy: a link to hand on (no motion).
function shareQuery(forCopy){
  const q = [], put = function(k, v){ q.push(k + "=" + encodeURIComponent(v)); };
  if (S.optA !== DEF.optionA || S.optB !== DEF.optionB){ put("a", S.optA.replace(/_/g, "-")); put("b", S.optB.replace(/_/g, "-")); }
  if (String(S.metroId) !== String(defaultMetroId())) put("metro", metroParam(metroById(S.metroId)));
  if (S.term !== DEF.term) put("term", S.term);
  if (readBudget() !== null) put("bud", readBudget());       // the optional budget (edit list 6)
  if (S.matchLock) put("lock", S.matchLock);                 // a live match (edit list 8); its value is re-solved on load
  const order = ["years", "down", "downusd", "rate"].concat(Object.keys(FIELDS).filter(function(k){ return ["years", "down", "downusd", "rate"].indexOf(k) < 0; }));
  order.forEach(function(k){
    const f = FIELDS[k];
    if (!fieldApplies(k)) return;
    if ((k === "rate" && !S.rateEdited) || (k === "pmi" && !S.pmiEdited)) return;
    if (S.matchLock && k === S.matchLock + "_" + slotMainKey(S.matchLock)) return;   // the locked field: lock= carries it
    const v = readField(k);
    if (!isFinite(v)) return;                       // an invalid entry is left out (its default applies)
    // a tax bill in dollars is always written: the unit is itself a toggle
    // (so is a dollar down payment, edit list 5)
    if (!(f.slot && f.key === "taxusd") && k !== "downusd" && Math.abs(v - fieldDefault(k)) < 1e-9) return;
    put(f.slot ? f.slot + Q_SLOT[f.key] : Q_SHARED[k], String(v));
  });
  if (S.downUse !== (pageUse(DEF.downUse) || "spend")) put("up", S.downUse);
  if (S.diffUse !== (pageUse(DEF.diffUse) || "spend")) put("mo", S.diffUse);
  if (S.account !== (DEF.accountRetirement ? "retirement" : "brokerage")) put("account", S.account);
  if (AN.m && AN.step > 1) put("step", AN.step);
  if (!AN.auto && (AN.autoWhy === "user" || AN.autoWhy === "param")) put("autoplay", "0");
  if (!forCopy && AN.forceReduced) put("motion", "reduce");
  return q.join("&");
}
function shareUrl(){
  const qs = shareQuery(true);
  const base = document.documentElement.classList.contains("embed") ? TOOL_URL : location.href.split(/[?#]/)[0];
  return base + (qs ? "?" + qs : "");
}
// Keep the address bar in step (standalone page only). Debounced, since
// Safari limits replaceState calls (about 100 per 30 seconds).
let urlTimer = 0;
function scheduleUrlSync(){
  if (!S.built || document.documentElement.classList.contains("embed") || !window.history || !history.replaceState) return;
  clearTimeout(urlTimer);
  urlTimer = setTimeout(function(){
    const qs = shareQuery(false), url = location.pathname + (qs ? "?" + qs : "") + location.hash;
    if (url !== location.pathname + location.search + location.hash){
      try { history.replaceState(history.state, "", url); } catch (e){}
    }
  }, 500);
}
// Restore the fields from the query (after applyDefaults("all")). Each value
// is parsed like a typed entry, rounded if the field takes whole numbers,
// clamped to the field's range and dropped if the field can't be zero.
function applyQueryFields(q){
  if (!q) return;
  let downSet = false, pmiSet = false;
  const take = function(k, name){
    const raw = q.get(name);
    if (raw === null || raw === "") return false;
    const f = FIELDS[k];
    let v = Number(String(raw).replace(/[,$%\s]/g, "").replace(/^−/, "-"));
    if (!isFinite(v)) return false;
    if (f.int) v = Math.round(v);
    v = Math.min(f.max, Math.max(f.min, v));
    if (!f.zeroOk && v <= 0) return false;
    setField(k, v);
    if (k === "rate") S.rateEdited = true;
    if (k === "pmi"){ S.pmiEdited = true; pmiSet = true; }
    if (k === "down") downSet = true;
    return true;
  };
  Object.keys(Q_SHARED).forEach(function(k){
    // years: readQuery(); ca= only where the field exists (condo vs. house,
    // edit list 10), so an old buy-vs-rent link's add-on is ignored
    if (k === "years" || (k === "condoadd" && !fieldApplies("condoadd"))) return;
    // dpd: the dollar down payment, which switches to $ mode (edit list 5)
    if (take(k, Q_SHARED[k]) && k === "downusd"){ S.downUnit = "usd"; S.downConv = null; downSet = true; }
  });
  ["a", "b"].forEach(function(sl){
    Object.keys(Q_SLOT).forEach(function(key){
      const k = sl + "_" + key;
      if (!slotUses(sl, FIELDS[k].for)) return;
      const got = take(k, sl + Q_SLOT[key]) || (Q_SLOT_LEGACY[key] ? take(k, sl + Q_SLOT_LEGACY[key]) : false);
      if (got && key === "taxusd") S.taxUnit[sl] = "usd";
    });
  });
  if (downSet && !pmiSet) syncPmiToDown();          // PMI follows the restored down payment
  // the optional budget (edit list 6): only a positive number is kept
  const bq = Number(String(q.get("bud") || "").replace(/[,$\s]/g, ""));
  if (isFinite(bq) && bq > 0) $("in-budget").value = fmtMoney(bq);
  // a live match (edit list 8): set the lock; refresh() re-solves the value
  const lk = q.get("lock");
  if (lk === "a" || lk === "b") S.matchLock = lk;
  // the money toggles; legacy "cash" (and an old use= for both pots) -> spend
  const both = pageUse(q.get("use"));
  const up = pageUse(q.get("up")) || both, mo = pageUse(q.get("mo")) || both;
  if (up) S.downUse = up;
  if (mo) S.diffUse = mo;
}
// Copy link: the async clipboard first; in an iframe without clipboard
// permission (or an older browser) a hidden textarea and execCommand; if both
// fail, the link is shown in a field, selected, to copy by hand. The button
// says "Link copied" for a moment (no height change); the fallback field
// changes the height, so it goes through refresh().
function copyLink(){
  const url = shareUrl(), btn = $("copy-link"), T = COPY.tools;
  const done = function(){
    btn.textContent = T.copied; btn.classList.add("ok"); $("share-status").textContent = T.copiedStatus;
    clearTimeout(btn._t);
    btn._t = setTimeout(function(){ btn.textContent = T.copy; btn.classList.remove("ok"); $("share-status").textContent = ""; }, 2200);
    if (!$("share-fb").hidden){ $("share-fb").hidden = true; refresh(); }
  };
  const legacy = function(){
    let ok = false;
    const ta = document.createElement("textarea");
    ta.value = url; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none";
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch (e){ ok = false; }
    ta.remove(); btn.focus({ preventScroll: true });
    if (ok){ done(); return; }
    $("share-url").value = url; $("share-fb").hidden = false; refresh();
    $("share-url").focus(); $("share-url").select();
  };
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) navigator.clipboard.writeText(url).then(done, legacy);
  else legacy();
}

// ------------------------------------------------------ print summary
// "Print summary" (and the browser's own Print): beforeprint switches the
// chart to its Compare step's end state with no tweening, sized for a letter
// page (PRINT_CHART, inside the ~710px card), and fills the print-only list
// of inputs; afterprint puts the chart back on the reader's step at screen
// size. The print layout itself is the @media print block in the CSS.
const PRINT_CHART = { w: 690, h: 185 };
let printSaved = null;
function buildPrintInputs(){
  if (!S.built) return;
  const P = COPY.print, items = [];
  const val = function(inp){
    const fld = inp.closest(".field"), pre = fld.querySelector(".pre"), suf = fld.querySelector(".suf");
    const s = suf ? suf.textContent : "";
    return (pre ? pre.textContent : "") + inp.value + (s ? (/^[A-Za-z]/.test(s) ? " " : "") + s : "");
  };
  const slotKeys = function(sl, keys){ return keys.map(function(k){ return sl + "_" + k; }); };
  // edit list 10: a condo's HOA fee and a rental's other fees follow its
  // price or rent (as in the main row); no points or assessment year
  const mainKeys = function(sl){ const o = sl === "a" ? S.optA : S.optB;
    return slotKeys(sl, o === "buy_condo" ? ["price", "hoa"] : ["price", "rent", "fees"]); };
  const costKeys = function(sl){ const o = sl === "a" ? S.optA : S.optB;
    return slotKeys(sl, ["tax", "taxusd", "ins"].concat(o === "buy_condo" ? [] : ["hoa"], ["maint", "assess", "movein"])); };
  const order = mainKeys("a").concat(mainKeys("b"), ["@lock", "down", "rate", "years", "@bud", "@use", "sav", "ret", "@acct", "cgt"],
    slotKeys("a", ["app", "rg"]), slotKeys("b", ["app", "rg"]),
    costKeys("a"), costKeys("b"),
    ["closing", "agent", "selling", "insg", "hoag", "pmi", "condoadd"]);
  order.forEach(function(k){
    if (k === "@use"){ items.push([P.upUse, useWord(P.use, S.downUse)], [P.diffUse, useWord(P.use, S.diffUse)]); return; }
    if (k === "@acct"){ items.push([P.account, COPY.account[S.account]]); return; }
    if (k === "@lock"){
      if (!S.matchLock) return;
      const sl = S.matchLock, o = sl === "a" ? S.optA : S.optB, oo = sl === "a" ? S.optB : S.optA, M = COPY.match;
      const what = slotMainKey(sl) === "rent" ? M.whatRent : fill(M.whatPrice, { noun: optCopy(o).noun });
      const w = isBuy(o) && isBuy(oo) ? fill(M.theNoun, { noun: optCopy(oo).noun }) : (isBuy(o) ? M.withRent : M.withBuy);
      items.push([M.print, fill(M.printText, { What: cap(what), with: w }) + (S.lockMsg ? " (" + msgForms(S.lockMsg.why, S.lockMsg.amt)[0] + ")" : "")]);
      return;
    }
    if (k === "@bud"){ const b = readBudget(); if (b !== null) items.push([COPY.budget.label, fill(COPY.budget.print, { amt: money(b) })]); return; }
    // a dollar down payment with its share(s) of the price (edit list 5)
    if (k === "down" && S.downUnit === "usd"){
      const lab = $("lab-down"), dsv = downShareVars(), u = readField("downusd");
      const F2 = COPY.fields.down;
      items.push([lab ? labText(lab) : k, dsv && isFinite(u) ? fill(F2.print, { amt: money(u), shares: fill(dsv.two ? F2.printTwo : F2.noteOne, dsv) }) : $("in-downusd").value]);
      return;
    }
    if (!fieldApplies(k)) return;
    if (k === "pmi" && refDownPct() >= DEF.pmiBelow) return;               // not charged (the reference purchase)
    // a rental's move-in costs and other fees: listed only when nonzero (edit list 4)
    if ((FIELDS[k].key === "movein" || FIELDS[k].key === "fees") && !(readField(k) > 0)) return;
    // the rate names its term: "15-year fixed at 6.60%" (edit list 4)
    if (k === "rate"){
      const lab = document.querySelector('label[for="' + FIELDS.rate.id + '"]'), rv = readField("rate");
      items.push([lab ? labText(lab) : k, isFinite(rv) ? fill(COPY.term.rate, { term: S.term, v: fmt2(rv) }) : $(FIELDS.rate.id).value + "%"]);
      return;
    }
    const f = FIELDS[k], lab = document.querySelector('label[for="' + f.id + '"]');
    let label = lab ? labText(lab) : k;
    // growth labels already name their option ("Condo value growth")
    if (f.slot && (f.key === "app" || f.key === "rg")) { /* label as is */ }
    else if (f.slot && f.key !== "price" && f.key !== "rent") label = fill(P.slot, { Col: optCopy(f.slot === "a" ? S.optA : S.optB).col, label: label });
    items.push([label, val($(f.id))]);
  });
  $("print-inputs").innerHTML = '<h2>' + esc(P.inputs) + '</h2><ul>' + items.map(function(i){
    return '<li><b>' + esc(i[0]) + ':</b> ' + esc(i[1]) + '</li>'; }).join("") + '</ul>' +
    '<p class="plink">' + esc(fill(P.link, { url: shareUrl() })) + '</p>';
}
function preparePrint(){
  autoHold("print", true);          // autoplay's countdown waits (2026-10-07)
  buildPrintInputs();
  if (printSaved || !chart || !AN.m || $("outputs").hidden) return;
  printSaved = { step: AN.step };
  document.documentElement.classList.add("printing");
  animClearTimers(); stopIntro();
  AN.playing = false; AN.finishing = false; AN.started = true;
  AN.step = AN.m.steps.indexOf("compare") + 1; AN.pi = null; finishDots();
  // Any tween still running (a refresh's 600ms re-render, a step) would keep
  // its elements from taking the static print geometry: tweens advance on
  // animation frames, and a page being printed (or a hidden tab) gets none.
  // So every running animation jumps to its end first.
  const zr = chart.getZr();
  try { zr.storage.traverse(function(el){ if (el.stopAnimation) el.stopAnimation(null, true); }); } catch (e){}
  chart.resize({ width: PRINT_CHART.w, height: PRINT_CHART.h });
  animRender(0); animCaption();
  try { zr.refreshImmediately(); } catch (e){}
}
function restorePrint(){
  autoHold("print", false);         // full dwell again once back on screen
  if (!printSaved) return;
  const st = printSaved.step; printSaved = null;
  document.documentElement.classList.remove("printing");
  // "auto": back to the container's size (a bare resize() would keep the
  // explicit print size, which zrender remembers)
  chart.resize({ width: "auto", height: "auto" });
  showEnd(st, 0); sizeCaption();
}
function printSummary(){ preparePrint(); window.print(); }

// ?a= / ?b= take option keys with hyphens (buy-condo); legacy ?view=condo /
// ?view=sfr map to the two original pairs. An invalid pair falls back to
// the defaults-file pair.
function readQuery(){
  const q = new URLSearchParams(location.search), out = {};
  const key = function(s){ return s ? String(s).toLowerCase().replace(/-/g, "_") : null; };
  const a = key(q.get("a")), b = key(q.get("b")), v = q.get("view");
  if (a || b){
    const pa = a || DEF.optionA, pb = b || (validPair(pa, DEF.optionB) ? DEF.optionB : COUNTERPART[pa]);
    if (validPair(pa, pb)){ out.optA = pa; out.optB = pb; }
  } else if (v === "condo"){ out.optA = "buy_condo"; out.optB = "rent_apartment"; }
  else if (v === "sfr"){ out.optA = "buy_house"; out.optB = "rent_house"; }
  const m = q.get("metro");
  if (m){
    const hit = METROS.filter(function(x){ return String(x.id) === m || slug(x.n) === m.toLowerCase(); })[0];   // ?metro=us: the U.S. typical
    if (hit) out.metroId = hit.id;
  }
  if (q.get("account") === "retirement" || q.get("account") === "brokerage") out.account = q.get("account");
  // ?term=15 (or 30): the loan term (edit list 4)
  const tq = Number(q.get("term"));
  if (TERMS.indexOf(tq) >= 0) out.term = tq;
  // ?chart=diff opens the chart on its last step (the difference line), as
  // the old "Difference only" view did; ?step=N opens it on step N. Numbers
  // above the step count (five or six, known once the model is built;
  // clamped in paintAnim()) open the last.
  if (q.get("chart") === "diff") out.step = MAX_STEPS;
  const st = Number(q.get("step"));
  if (st >= 1 && st === Math.round(st)) out.step = Math.min(st, MAX_STEPS);
  if (q.get("motion") === "reduce") out.reduceMotion = true;
  // ?autoplay=0 (also off / false): open with the chart's autoplay paused
  if (/^(0|off|false)$/i.test(q.get("autoplay") || "")) out.autoplayOff = true;
  // stay: rounded and clamped to the allowed range (2026-10-07)
  const y = Number(q.get("years"));
  if (q.get("years") && isFinite(y) && y > 0) out.years = Math.min(DEF.stayMax, Math.max(DEF.stayMin, Math.round(y)));
  out.params = q;                     // every other input: applyQueryFields()
  return out;
}

  window.addEventListener("beforeprint", preparePrint);
  window.addEventListener("afterprint", restorePrint);
  window.addEventListener("resize", animResize);

  $("loading").remove();
  $("res-body").hidden = false;
  S.built = true;
  refresh();
}

/* ---------- self-sizing embed ----------
   Copied from initEmbedHeight() in viz/holiday-effect/index.html. The timed
   retries and the initial report call send() DIRECTLY: browsers throttle
   requestAnimationFrame in an iframe that is not being painted, so with
   loading="lazy" a below-the-fold embed could otherwise never report. rAF
   is kept only for coalescing high-frequency resize/observer events. */
function initEmbedHeight(){
  if(!document.documentElement.classList.contains('embed')) return;
  let last=0, raf=0;
  const send=()=>{ const h=Math.ceil(document.documentElement.getBoundingClientRect().height);
    if(h && Math.abs(h-last)>1){ last=h; try{ window.parent.postMessage({type:'inman-embed-height',height:h},'*'); }catch(e){} } };
  const schedule=()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(send); };
  window.addEventListener('resize',schedule);
  if(window.ResizeObserver) new ResizeObserver(schedule).observe(document.body);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(send);
  [0,300,800,1800,3000].forEach(ms=>setTimeout(send,ms));
  // exposed so a state change that alters page height can report immediately
  window.__inmanEmbedSend = send;
  send();
}
// init() first, so the first height report is of the filled page rather
// than the empty shell.
init();
initEmbedHeight();
})();
</script>
