<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buying vs. renting calculator — Inman</title>
<!-- =====================================================================
     PLACEHOLDER COPY. Every piece of visible text on this page (kicker,
     title, standfirst, labels, help text, option names, badges, verdict
     sentences, notes, method text) is draft wording kept in ONE block:
     `const COPY = {...}` at the top of the page script below. Rewrite it
     there. The <title> above is overwritten at load by COPY.pageTitle. The
     credit line is NOT placeholder: it is required wording, kept in
     `const CREDIT`.

     NUMBERS. No rate, growth figure or forecast is typed into this file.
     Every assumption is inlined at build time from
       clean_data/condo_study/calculator_defaults.csv  (-> DEF)
       clean_data/condo_study/pmms_latest.csv          (-> FALLBACK_RATE)
     COPY refers to them with {placeholders}.

     BUILD. index.html is generated from template.html by
       active_workspace/scripts/condo_study/60_build_pitch2_data.R
     which inlines the per-metro inputs, the defaults and the fallback
     mortgage rate at the @@METROS@@, @@META@@, @@DEFAULTS@@ and @@RATE@@
     markers, and checks this page's MATH block against the R engine
     (scripts/condo_study/horizon_engine.R) for every metro, every ordered
     pair of options and every control setting. Edit template.html, then
     rerun the script; hand edits to index.html are overwritten.
     template.html holds no Zillow data.

     ANY PAIR (Houston, 2026-10-07). Four options: buy a condo, buy a house,
     rent an apartment, rent a house. Any two can be compared except two
     rentals. Each is scored on its own terms. The engine computes net gain
     or loss = what you keep minus everything you paid, plus investment
     growth (after tax) on money it frees up compared with the other option,
     if invested. The page presents its negative, NET COST (Houston,
     2026-10-07): total paid - home equity after selling costs - investment
     growth after tax. Lower is better; below zero is a net gain.

     URL OPTIONS. ?embed (set by the WordPress snippet);
     ?a=<option>&b=<option> to open on a pair, options written buy-condo,
     buy-house, rent-apartment, rent-house (e.g. ?a=buy-condo&b=buy-house);
     legacy ?view=condo (buy a condo vs. rent an apartment) and ?view=sfr
     (buy a house vs. rent a house) still work, so existing embeds keep
     their pair; ?metro=<Zillow RegionID or slug such as miami-fl> to open on
     a metro (?metro=us: the United States (typical) option, the default
     since 2026-10-07); ?years=<1-30> to open on a stay; ?account=retirement to open
     with the Retirement account setting; ?chart=diff to open the animated
     chart on its last step (the difference line); ?step=<1-6> to open it on
     a step (the chart has five or six steps, depending on the pair and the
     toggles; larger numbers open the last step); ?motion=reduce to switch
     steps without tweening (as under the reader's prefers-reduced-motion
     setting); ?autoplay=0 to open with the chart's autoplay paused (?step
     and ?chart=diff open paused too, since the reader chose a step).
     AUTOPLAY (Houston, 2026-10-07): the chart moves to its next step
     AUTO_DWELL_MS (5 seconds since 2026-10-08; 8 in edit list 3, 12 before) after
     each step's own phases finish; see
     AUTOPLAY in the script for what pauses, holds and resumes it.
     MONEY TOGGLES (Houston, 2026-10-07): "Spend it | Save it | Invest it".
     "Kept as cash" is no longer offered (the engine still has it, and 60's
     checks use it); legacy links with up=cash, mo=cash or use=cash open on
     "Spend it", which gives identical numbers (cash at 0% and money spent
     are both counted at face value).
     SHAREABLE LINKS (review M11, 2026-10-07): every other input and toggle
     has a short parameter too, written only when it differs from its
     default; the full list is above shareQuery() in the script. The address
     bar follows the reader's edits (standalone page), "Copy link" copies the
     same link (in an embed: the canonical tool URL plus the query), and the
     link restores every field, validated and clamped.
     PRINT (2026-10-07): "Print summary" (or the browser's Print) prints a
     one-page letter summary; see the @media print block and preparePrint().
     EDIT LIST 1 (Houston, 2026-10-07): new masthead title; "Money not used
     up front"; shorter help (no help under the five main inputs, whose
     default sources moved to the method notes); the tax on savings
     interest retired (the input, ?itx and the math: interest is untaxed in
     both engines); the account switch built into the top of the "Tax on
     investment gains" box; one note under the ledger and a check mark (a cash-stack icon since edit list 8) on
     the lower net cost; the "What you'd have" card removed; the chart
     titled "Your choices, visualized", with an x-axis name and title-only
     step captions (the explanation stays for screen readers) whose
     ellipsis fills in dot by dot; Houston's "How to read this chart"; and a
     much shorter "How this calculator works".
     EDIT LIST 4 (Houston, 2026-10-08): a 30-year | 15-year fixed switch built
     into the bottom of the mortgage-rate box (?term=15; the rate follows
     the term's PMMS default unless the reader typed one; both engines
     amortize over the term and pay no P&I after payoff); renter-side costs
     per rental in Adjust costs (move-in costs you won't get back, other
     monthly rental fees; $0 by default; ?amv / ?bmv, ?afe / ?bfe), in the
     ledger and the chart; the first-month card relabelled "Recurring costs,
     first month", with a note that up-front costs are in the totals; "tax
     advisor" (Inman style) in the disclaimer.
     EDIT LIST 5 (Houston, 2026-10-08): a % / $ switch on the down payment
     (the property-tax unit-switch pattern; ?dpd=<dollars>). In $ mode one
     amount applies to every purchase, each at its own share of its price
     with its own PMI band (both engines take the down share and PMI rate
     per option, opt_down_pct / opt_pmi_pct); a line under the field shows
     the share(s).
     EDIT LIST 6 (Houston, 2026-10-08): an optional monthly budget under the
     money questions (?bud=), compared with each option's first-month
     recurring cost: a line in the verdict box and a flag under the
     over-budget total(s) in the first-month card; and a "Match ... monthly
     cost" / "Back to typical ..." button under each option's price or rent
     that sets it so the two first-month costs are equal (rent solved
     directly; price by bisection on the page's own cost). Neither changes
     any calculation.
     EDIT LIST 8 (Houston, 2026-10-08): match labels name what they match
     ("Match monthly cost with renting / buying / house / condo"); a match is
     now LIVE (S.matchLock, ?lock=a|b): refresh() re-solves the locked
     field before every render, the field is read-only with a link icon, and
     "Back to typical ..." unlocks; the PMI help is one fixed sentence; the
     lower net cost is marked with a small stack-of-cash icon (was a check).
     EDIT LIST 9 (Houston, 2026-10-08): closing costs default 2.0% (was
     2.5%) and renters insurance in dollars (NAIC HO-4 average, $14.25/mo,
     growing at CPI; was 1% of rent), both from DEF; a one-sentence
     transfer-tax note under "Costs to sell"; shorter "Can't match" messages,
     held with the last matched value until a match is possible (the field's
     link icon also stops matching); the method sources add closing and
     selling costs, PMI rules, renters insurance and taxes on gains.
     EDIT LIST 10 (Houston, 2026-10-08; second independent review,
     documentation/condo_study/calculator_review_2_2026-10-08.md): default
     rates moved to the PMMS week of Oct. 8, 2026 (7.40% / 6.73%; the live
     feed stays off, LIVE_RATE_ACTIVE = false); "Savings yield: FDIC."
     dropped from the method sources (0.5% is an Inman assumption); three
     inputs removed from the page, the engines keeping them at their
     defaults: Points (0), the special assessment's "Paid in year" (now
     always year 1, inside any stay) and, except when a condo is compared
     with a house, the condo loan rate add-on (relabelled "Extra rate on the
     condo loan"); old ?pt=, ?asy= / ?bsy= and buy-vs-rent ?ca= are
     ignored. The main inputs are two rows: each option's fields (a condo's
     HOA fee beside its price, moved out of Adjust costs by placeHoa(); a
     rental's other monthly fees beside its rent), then the shared down
     payment, rate and stay. A nonzero buyer's agent fee shows a note on the
     costs to sell; the costs-to-sell help says what the 6% covers; the condo
     fee's default source moved to the method notes.
     ===================================================================== -->
<!-- Detect iframe/embed context early so the page flows to its true height -->
<script>
  if (window.self !== window.top || /[?&]embed\b/.test(location.search)) {
    document.documentElement.classList.add("embed");
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js@11.2.3/public/assets/styles/choices.min.css">
<style>
  :root{
    --inman-blue:#0a84ff; --inman-dark:#161a48; --inman-dark-2:#20275c;
    --inman-red:#ff0a0a; --ink:#1b1f3b; --muted:#5b6180; --line:#e5e8f0;
    --field:#ccd2e2; --tint:#f5f7fb;
    --warn-ink:#9c3d10;   /* over-budget flags (edit list 6): 7.2:1 on white */
    /* Option colours, fixed per option (2026-10-07), from .claude/inman_branding.md:
       Bright Blue, Dark Blue and Red, plus a desaturated variant of the Red
       (the brand doc's "legible desaturated variants" for additional
       series) for the fourth option. Two rentals are never compared, so
       the two reds never meet. Mirrored in OPTION_COLOR in the script. */
    --opt-buy-condo:#0a84ff; --opt-buy-house:#161a48; --opt-rent-apartment:#ff0a0a; --opt-rent-house:#b8474f;
    --font-ui:"Libre Franklin","HEX Franklin","Helvetica Neue",Arial,sans-serif;
    --font-head:Georgia,serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  html:not(.embed),html:not(.embed) body{min-height:100%}
  html.embed,html.embed body{height:auto}
  body{font-family:var(--font-ui);color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column}

  /* ---- masthead ---- */
  .masthead{background:var(--inman-dark);border-bottom:2px solid var(--inman-blue);padding:14px 18px 16px}
  .masthead .kicker{color:#8ea2c8;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;margin:0 0 4px}
  .masthead h1{font-family:var(--font-head);color:#fff;font-size:24px;line-height:1.15;margin:0;font-weight:700}
  .masthead p.stand{color:#c7cef0;font-size:13px;line-height:1.45;margin:7px 0 0}

  /* ---- controls ---- */
  .controls{padding:12px 18px 4px;border-bottom:1px solid var(--line)}
  .ctl{display:flex;flex-direction:column;gap:4px;min-width:0}
  .ctl > label,.ctl > .lab{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  /* a label carrying its option's swatch (the growth boxes, 2026-10-08) */
  .ctl > label.swlab{display:flex;align-items:center;gap:6px;min-width:0}
  .ctl > label.swlab .sw{width:9px;height:9px}
  .seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--field);border-radius:3px;overflow:hidden}
  .seg button{font-family:var(--font-ui);font-size:13px;padding:7px 13px;border:0;background:#fff;color:var(--muted);cursor:pointer}
  .seg button.active{background:var(--inman-blue);color:#fff;font-weight:600}
  .seg button+button{border-left:1px solid var(--field)}
  .viewnote{font-size:11.5px;color:var(--muted);line-height:1.45;margin:7px 0 0}
  .resetbtn{font-family:var(--font-ui);font-size:12px;color:var(--inman-blue);background:none;border:0;
    cursor:pointer;padding:0 0 4px;text-decoration:underline;white-space:nowrap}

  /* metro selector: the first and most prominent control (Houston, 2026-10-07) */
  .metrobox{background:#f2f7ff;border:1px solid rgba(10,132,255,.28);border-left:4px solid var(--inman-blue);
    border-radius:4px;padding:11px 14px 12px;margin:0 0 12px}
  .metrobox > label{display:block;font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--inman-dark);
    letter-spacing:.01em;margin:0 0 6px}
  .metrobox .pick{max-width:560px}
  .metrobox .choices__inner{min-height:48px;padding:8px 12px 7px;border:1px solid #9fc4f0;border-radius:4px;background:#fff}
  .metrobox .choices__list--single{padding:2px 22px 2px 2px}
  .metrobox .choices__list--single .choices__item{font-size:19px;font-weight:600;color:var(--inman-dark);line-height:1.3}
  .metrobox .choices.is-focused .choices__inner,.metrobox .choices.is-open .choices__inner{border-color:var(--inman-blue);
    box-shadow:0 0 0 3px rgba(10,132,255,.2)}
  .metrobox .choices[data-type*=select-one]::after{border-color:var(--inman-dark) transparent transparent;right:14px;margin-top:-2px;border-width:6px}
  .metrobox .choices[data-type*=select-one].is-open::after{border-color:transparent transparent var(--inman-dark);margin-top:-8px}
  .metrobox .choices__list--dropdown .choices__item{font-size:15px}
  .metrobox select#metro-select{height:48px;font-size:18px;font-weight:600}

  /* pair picker: a sentence, "Compare [option] with [option] [swap]" (2026-10-07) */
  .pairrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px}
  .pairline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 9px;font-size:15px;font-weight:600;color:var(--inman-dark);min-width:0}
  .pairline .word{white-space:nowrap}
  .optsel{position:relative;display:inline-flex;align-items:center;max-width:100%}
  .optsel .sw{position:absolute;left:10px;top:50%;margin-top:-5px;pointer-events:none}
  .optsel select{font-family:var(--font-ui);font-size:15px;font-weight:600;color:var(--inman-dark);height:40px;max-width:100%;
    padding:0 30px 0 27px;border:1px solid var(--field);border-radius:4px;background:#fff;cursor:pointer;
    -webkit-appearance:none;appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--inman-dark) 50%),linear-gradient(135deg,var(--inman-dark) 50%,transparent 50%);
    background-position:calc(100% - 15px) 17px,calc(100% - 10px) 17px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  .optsel select:focus{outline:0;border-color:var(--inman-blue);box-shadow:0 0 0 3px rgba(10,132,255,.2)}
  .swapbtn{font-family:var(--font-ui);font-size:13px;font-weight:600;height:40px;padding:0 12px;border:1px solid var(--field);
    border-radius:4px;background:#fff;color:var(--inman-blue);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .swapbtn:hover{border-color:var(--inman-blue)}
  .swapbtn .ic{font-size:17px;line-height:1}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none;vertical-align:baseline}

  /* Main inputs (edit list 10, 2026-10-08): two rows (see the markup's
     comment). .optrow: each option's fields in option order, one column per
     visible field (--nopt, 3 or 4, set by paintStatic()); .sharedrow: down
     payment, rate and stay in three columns. Both rows are grids of equal
     columns with the same gaps; their items stretch to the row's height, so
     the reserved match and share lines keep every field on one line. */
  .inputs{display:flex;flex-direction:column;gap:12px;margin-top:12px}
  .optrow{display:grid;grid-template-columns:repeat(var(--nopt,4),minmax(0,1fr));gap:12px 12px}
  .sharedrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 12px}
  /* main-row labels stay on one line (a wrapped label would drop its field
     below its neighbour's); the rental-fee label has a short form for a
     narrow column, swapped by a container query on its box. The long form
     stays in the accessible name (visually hidden, not display:none), and
     the short one is aria-hidden. */
  .optrow .ctl > label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  /* every main-row label one 13px line, the height of the down payment's
     label-and-switch row, so all fields in both rows start level (a plain
     label was 12.5px, half a pixel off) */
  .inputs .ctl > label{height:13px}
  .optrow .ctl > label > span:not(.sw){overflow:hidden;text-overflow:ellipsis}
  .optrow .ctl.optsec{container:optsec / inline-size}
  .optrow .ls{display:none}
  @container optsec (max-width:200px){
    .optrow .ll{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    .optrow .ls{display:inline}
  }
  /* the HOA box in Adjust costs (a house) shows no swatch: the block's subhead has it */
  #adjust .ctl > label.swlab .sw{display:none}
  /* the note under the buyer's agent fee (edit list 10) */
  .help.agentnote{color:var(--warn-ink);margin:2px 0 0}
  .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px;padding:2px 0 12px}
  .subhead{grid-column:1 / -1;font-size:12px;font-weight:600;color:var(--ink);margin:4px 0 -4px;display:flex;align-items:center;gap:7px}
  /* Editable values (Houston, 2026-10-07): the number a reader can change is
     the most important text in the control, so it is set larger (16px, which
     also stops iOS Safari zooming on focus), semibold and in the dark brand
     ink, with tabular figures; the $ / % affixes, labels and help text stay
     small, regular and muted so the value stands apart from them. Same
     typeface (Libre Franklin): serif is never used for UI. */
  .field{display:flex;align-items:center;height:40px;border:1px solid var(--field);border-radius:4px;background:#fff}
  .field:focus-within{border-color:var(--inman-blue);box-shadow:0 0 0 2px rgba(10,132,255,.18)}
  .field.bad{border-color:var(--inman-red);box-shadow:0 0 0 1px var(--inman-red) inset}
  .field input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;padding:0 8px;
    font-family:var(--font-ui);font-size:16px;font-weight:600;color:var(--inman-dark);font-variant-numeric:tabular-nums;letter-spacing:.005em}
  .field .pre{padding-left:10px;color:var(--muted);font-size:14px;font-weight:400}
  .field .pre + input{padding-left:3px}
  .field .suf{padding-right:10px;color:var(--muted);font-size:12.5px;font-weight:400;white-space:nowrap}
  .help{font-size:11px;color:var(--muted);line-height:1.35}
  .grid4 > .help{grid-column:1 / -1;margin-top:-6px}
  input[type=range]{width:100%;margin:2px 0 0;accent-color:var(--inman-blue)}

  details.panel{border-top:1px solid var(--line);margin:0 -18px;padding:0 18px}
  details.panel summary{cursor:pointer;list-style:none;padding:10px 0;font-size:13px;font-weight:600;color:var(--inman-blue);
    display:flex;align-items:center;gap:8px;user-select:none}
  details.panel summary::-webkit-details-marker{display:none}
  details.panel summary::before{content:"";width:0;height:0;border-left:5px solid currentColor;
    border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .12s}
  details.panel[open] summary::before{transform:rotate(90deg)}
  .controls > .usage + details.panel,.controls > .budgetrow + details.panel{margin-top:16px}
  /* Optional monthly budget (edit list 6): a main-row-width field, its help
     beside it in the next columns (under it on phones) */
  .budgetrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px 12px;margin-top:16px;align-items:end}
  .budgetrow .budgethelp{grid-column:span 3;margin:0 0 12px}
  .budgetrow .field input::placeholder{color:var(--muted);font-weight:400;opacity:.8}
  /* "Match ... monthly cost" / "Back to typical ..." under each option's price
     or rent (edit list 6): one line, always reserved, so the row never moves */
  .matchline{min-height:16px;line-height:16px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .matchbtn{font-family:var(--font-ui);font-size:11.5px;line-height:16px;color:var(--inman-blue);background:none;border:0;padding:0;
    cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .matchmsg{color:var(--warn-ink)}
  /* a live-matched field (edit list 8): read-only, tinted, a link icon */
  .field.locked{background:var(--tint);border-style:dashed}
  .field.locked input{cursor:default}
  .locktag{display:inline-flex;align-items:center;padding:0 8px 0 2px;color:var(--inman-blue);background:none;border:0;cursor:pointer;font:inherit}
  .locktag:focus-visible{outline:2px solid var(--inman-blue);outline-offset:-2px;border-radius:3px}
  .field .locktag + .suf{padding-left:0}
  .locktag svg{width:14px;height:14px}
  .locktag.miss{color:var(--warn-ink)}
  .matchmsg:empty{display:none}
  /* over budget (edit list 6): a muted burnt orange, 7:1 on white */
  .hero .overbud{font-size:12px;line-height:1.45;margin:5px 0 0;color:var(--warn-ink)}
  table.bd tr.overbud td{padding-top:2px;border:0;font-size:11px;color:var(--warn-ink);font-weight:600}
  /* compact segmented toggles: money not used up front / monthly cost difference, account */
  .seg.compact{align-self:flex-start}
  .seg.compact button{font-size:12.5px;padding:6px 11px}
  /* The two money questions (2026-10-08, Houston): asked in sentence case
     in the UI sans, larger and darker than the uppercase field labels, so
     they read as questions to the reader. Two equal columns; each toggle
     sits at the bottom of its column so the pair lines up whatever the
     questions' wrapping. One column on phones. */
  .usage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 32px;margin-top:18px}
  .usage .ctl{gap:8px;justify-content:space-between}
  .usage .q{font-size:14px;line-height:1.4;font-weight:600;color:var(--inman-dark);max-width:44ch}
  .usage .seg.compact button{font-size:13px;padding:7px 14px}
  .field.off{background:var(--tint)}
  .field.off input{color:var(--muted);font-weight:400}
  /* property tax: a small unit switch (% of value / $ per year) beside the
     label (2026-10-07) */
  .labrow{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0;height:13px}
  .labrow > label{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .seg.compact.unit{flex:none;flex-wrap:nowrap}
  .seg.compact.unit button{font-size:10.5px;padding:0 6px;line-height:15px}
  /* Account type built into the top of the "Tax on investment gains" box
     (Houston, edit list 1, 2026-10-07): one bordered box, a full-width
     Brokerage | Retirement switch on top, the rate field below. */
  .fieldbox{border:1px solid var(--field);border-radius:4px;background:#fff;overflow:hidden}
  .fieldbox:focus-within{border-color:var(--inman-blue);box-shadow:0 0 0 2px rgba(10,132,255,.18)}
  .fieldbox .seg.compact{display:flex;flex-wrap:nowrap;width:100%;border:0;border-bottom:1px solid var(--field);border-radius:0;background:var(--tint)}
  .fieldbox .seg.compact button{flex:1 1 50%;font-size:12px;padding:5px 6px;text-align:center;background:var(--tint)}
  .fieldbox .seg.compact button.active{background:var(--inman-blue)}
  .fieldbox .seg.compact button+button{border-left:1px solid var(--field);border-top:0}
  .fieldbox .field{border:0;border-radius:0;height:38px}
  .fieldbox .field:focus-within{box-shadow:none}
  /* Loan term built into the BOTTOM of the mortgage-rate box (edit list 4,
     2026-10-08): the rate field keeps the row's 40px line (38px + the box's
     border), so its value lines up with its neighbours, and the switch runs
     along the bottom, like the stay's slider in the next column. Long labels
     ("30-year fixed") where the column allows, short ones ("30-year") where it
     doesn't; the full wording stays in each button's accessible name. */
  .fieldbox.termbox .seg.compact{border-bottom:0;border-top:1px solid var(--field)}
  .fieldbox.termbox .seg.compact button{font-size:11.5px;padding:4px 4px;line-height:1.25;white-space:nowrap}
  .fieldbox.termbox .ts{display:none}
  @container termbox (max-width:170px){
    .fieldbox.termbox .tl{display:none}
    .fieldbox.termbox .ts{display:inline}
  }
  .fieldbox.termbox{container:termbox / inline-size}
  /* (edit list 4's two-line label rule for the renter-side cost pair, .rentcost,
     was removed in edit list 10: "Other monthly rental fees" moved to the
     main row, so "Move-in costs you won't get back" stands alone) */
  /* down payment in dollars (edit list 5): the share of the price under the
     field, one line always reserved (hidden in % mode) so nothing moves */
  .downnote{font-size:11px;line-height:14px;min-height:14px;color:var(--muted);font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* one line at every width: in a narrow column (two purchases at 320px)
     the line steps down to 10px rather than wrap and push the row taller */
  #down-ctl{container:downctl / inline-size}
  @container downctl (max-width:150px){ .downnote{font-size:10px;letter-spacing:-.01em} }
  .downnote.off{visibility:hidden}
  .downnote.warn{color:var(--inman-red)}

  /* ---- results ---- */
  .results{padding:14px 18px 16px}
  .reshead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:12px}
  .reshead .where{font-size:15px;font-weight:700}
  .reshead .what{font-size:12.5px;color:var(--muted)}
  .badges{display:flex;flex-wrap:wrap;gap:6px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;line-height:1.3;color:var(--ink);
    background:var(--tint);border:1px solid var(--line);border-radius:12px;padding:3px 9px 3px 8px}
  .badge .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .badge.tierb .dot{background:var(--inman-blue)}
  .badge.fl .dot{background:var(--inman-red)}
  .badge.thin .dot{display:none}

  .hero{border:1px solid var(--line);border-left:4px solid var(--inman-blue);border-radius:4px;padding:13px 16px 14px;margin-bottom:14px}
  .hero.wash{border-left-color:var(--muted)}
  .hero .verdict{font-size:20px;line-height:1.3;font-weight:700;margin:0;color:var(--inman-dark)}
  .hero .sub{font-size:14px;line-height:1.45;margin:6px 0 0}
  .hero .warn{font-size:12px;line-height:1.45;margin:7px 0 0;color:var(--muted)}
  /* Assumptions line (review H5, 2026-10-07): a row of chips right under the
     verdict naming the drivers behind it; each chip jumps to its input. */
  .assume{display:flex;flex-wrap:wrap;align-items:center;gap:5px 6px;margin:8px 0 0}
  .assume .alead{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:2px}
  .chip{font-family:var(--font-ui);font-size:12px;line-height:1.3;color:var(--inman-dark);background:var(--tint);
    border:1px solid var(--field);border-radius:12px;padding:3px 9px;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
  .chip:hover{border-color:var(--inman-blue);color:var(--inman-blue)}
  .chip:focus-visible{outline:2px solid var(--inman-blue);outline-offset:1px}
  /* the control a chip jumped to flashes once */
  .ctl.flash .field,.ctl.flash .seg{box-shadow:0 0 0 3px rgba(10,132,255,.35);transition:box-shadow .2s}
  /* Copy link / Print summary (review M11, 2026-10-07) */
  .restools{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-left:auto}
  .toolbtn{font-family:var(--font-ui);font-size:12.5px;font-weight:600;height:30px;padding:0 11px;border:1px solid var(--field);
    border-radius:4px;background:#fff;color:var(--inman-blue);cursor:pointer;white-space:nowrap}
  .toolbtn:hover{border-color:var(--inman-blue)}
  .toolbtn.ok{color:#0b7a3e;border-color:#0b7a3e}
  .sharefb{flex-basis:100%;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
  .sharefb input{flex:1;min-width:0;height:28px;font-family:var(--font-ui);font-size:12px;border:1px solid var(--field);border-radius:3px;padding:0 6px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .printonly{display:none}

  .cards{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px}
  .card{border:1px solid var(--line);border-radius:4px;padding:13px 15px 14px;min-width:0}
  .card.chart{grid-column:1 / -1}
  .card h2{font-family:var(--font-ui);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    font-weight:600;margin:0 0 9px}
  .verdict2{font-size:14px;line-height:1.4;font-weight:600;margin:0 0 4px}
  table.bd{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;font-variant-numeric:tabular-nums}
  table.bd td,table.bd th{padding:5px 0;border-top:1px solid var(--line);text-align:left;font-weight:400;vertical-align:top}
  table.bd th{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;border-top:0;line-height:1.3}
  table.bd th .sw{margin-right:5px;vertical-align:-1px}
  table.bd .amt{text-align:right;white-space:nowrap;padding-left:10px}
  table.bd th.amt{white-space:normal}
  table.bd tr.total td{font-weight:700;border-top:1.5px solid var(--ink)}
  table.bd tr.net td{font-weight:700;border-top:1.5px solid var(--ink);font-size:14px}
  /* the lower net cost gets a small stack of cash at its left (Houston, edit
     list 8; a check mark from edit list 1): an inline SVG sized to the
     text, in green #0b7a3e (5.5:1 on white); the figures stay right-aligned */
  table.bd .ck{display:inline-block;width:1.3em;height:1em;vertical-align:-0.12em;margin-right:5px;color:#0b7a3e}
  table.bd tr.sec td{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:12px;border-top:0}
  table.bd tr.muted td{color:var(--muted);font-size:11.5px;border-top:0;padding-top:0;white-space:normal}
  table.bd tr.sub td{color:var(--muted);font-size:12px;border-top:0;padding-top:0}
  table.bd tr.sub td:first-child{padding-left:12px}
  table.bd tr.muted td.amt{white-space:normal}
  .small{font-size:11.5px;color:var(--muted);line-height:1.45;margin:8px 0 0}
  /* Animated, click-through chart (Phase 2, 2026-10-07). Every block has a
     height that does not depend on the step: the chart is fixed, the caption
     gets a min-height equal to its tallest step (set by sizeCaption()), and
     the takeaway box is an overlay. So the embed height never moves between
     steps. */
  .charthead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;margin:0 0 6px}
  .charthead h2{margin:0}
  /* Skip to comparison (2026-10-07): a link-style control at the right of
     the chart heading, so the stepper row keeps its layout on phones */
  .skipbtn{font-family:var(--font-ui);font-size:12.5px;font-weight:600;color:var(--inman-blue);background:none;border:0;
    padding:2px 0;cursor:pointer;white-space:nowrap}
  .skipbtn:hover:not(:disabled){text-decoration:underline}
  .skipbtn:disabled{color:var(--muted);opacity:.55;cursor:default}
  .skipbtn .arr{margin-left:3px}
  .skipbtn:focus-visible{outline:2px solid var(--inman-blue);outline-offset:2px}
  /* collapsible notes (2026-10-07): the chart note and, in the footer, the method */
  details.more{margin:8px 0 0}
  details.more summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--inman-blue);list-style:none;display:inline-flex;align-items:center;gap:6px}
  details.more summary::-webkit-details-marker,.foot details summary::-webkit-details-marker{display:none}
  details.more summary::before,.foot details summary::before{content:"";width:0;height:0;border-left:5px solid currentColor;
    border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .12s}
  details.more[open] summary::before,.foot details[open] summary::before{transform:rotate(90deg)}
  details.more .small{margin-top:5px}
  .stepcap{margin:0 0 6px}
  .stepcap .snum{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 2px}
  .stepcap .stitle{display:block;font-family:var(--font-head);font-size:17px;line-height:1.25;font-weight:700;color:var(--inman-dark);margin:0 0 3px}
  /* The explanatory text is visually hidden (Houston, edit list 1): it stays
     for screen readers (aria-live caption) and the chart's aria-label. */
  .stepcap .stext{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  /* The title's ellipsis (edit list 1): three dots that appear one by one,
     DOT_MS apart, as part of the step's sequence; opacity only, so the
     height never moves. #step-cap's data-dots (0-3) says how many show. */
  .stepcap .ell i{font-style:normal;opacity:0;transition:opacity .14s ease-out}
  .stepcap .ell.static i,.stepcap[data-dots="3"] .ell i,.stepcap[data-dots="2"] .ell i:nth-child(-n+2),
  .stepcap[data-dots="1"] .ell i:nth-child(1){opacity:1}
  .chartbox{position:relative}
  #chart{width:100%;height:380px;border-radius:3px}
  .takeaway{position:absolute;left:0;top:0;width:204px;background:rgba(255,255,255,.95);border:1px solid var(--line);
    border-left:3px solid var(--inman-dark);border-radius:3px;padding:7px 10px 8px;font-size:12px;line-height:1.4;color:var(--ink);
    pointer-events:none;opacity:0;font-variant-numeric:tabular-nums;box-shadow:0 1px 4px rgba(22,26,72,.08);
    transition:opacity .75s cubic-bezier(.645,.045,.355,1),transform .75s cubic-bezier(.645,.045,.355,1),border-color .75s}
  .takeaway.on{opacity:1}
  .takeaway .tk-h{font-weight:700;color:var(--inman-dark);margin:0 0 3px}
  .takeaway .tk-r{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .takeaway .tk-r > span:first-child{min-width:0}
  .takeaway .tk-r > span:last-child{white-space:nowrap}
  .takeaway .tk-r .sw{margin-right:5px;vertical-align:0}
  .takeaway .tk-m{font-weight:700;margin-top:4px;padding-top:4px;border-top:1px solid var(--line)}
  /* Step navigation (2026-10-07, revised): above the caption. Back | a
     labelled progress track, one segment per step | Next | Replay. The
     current segment fills as its phases play. The attention cue (.cue on
     #stepper: a pulsing Next button with a nudging arrow, and a shimmer
     sweeping the upcoming segments) shows until the reader's first advance
     and again after about 8 seconds idle; never under reduced motion, and
     (since autoplay, 2026-10-07) only while autoplay is off, since the
     countdown on Next does the same job while it runs. */
  .stepper{display:flex;align-items:center;gap:8px 10px;margin:0 0 10px}
  .stepbtn{font-family:var(--font-ui);font-size:13px;font-weight:600;height:36px;padding:0 14px;border:1px solid var(--field);
    border-radius:4px;background:#fff;color:var(--inman-dark);cursor:pointer;white-space:nowrap;flex:none}
  .stepbtn.primary{background:var(--inman-blue);border-color:var(--inman-blue);color:#fff}
  .stepbtn:hover:not(:disabled){border-color:var(--inman-blue)}
  .stepbtn.primary:hover:not(:disabled){background:#0070e0;border-color:#0070e0}
  .stepbtn:disabled{opacity:.4;cursor:default}
  .stepbtn.replay{color:var(--inman-blue)}
  .stepbtn .arr{display:inline-block;margin-left:5px;font-size:15px;line-height:1}
  .stepbtn .arl{display:inline-block;margin-right:5px;font-size:15px;line-height:1}
  /* Autoplay (Houston, 2026-10-07). Pause / Play, first in the row (WCAG
     2.2.2: a way to pause auto-advancing content), its label switching with
     its state; a min-width stops the row shifting when the label changes.
     The countdown is a thin white bar along the bottom of Next, filling over
     the dwell; dimmed while the countdown is held (pointer over the chart,
     keyboard focus in it), hidden while autoplay is off. */
  .stepbtn.auto{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:82px}
  .stepbtn.auto svg{width:10px;height:11px;flex:none;fill:currentColor}
  .stepbtn.auto .ic-play,.stepbtn.auto.paused .ic-pause{display:none}
  .stepbtn.auto.paused .ic-play{display:block}
  .stepbtn.primary{position:relative;overflow:hidden}
  .ncount{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.28);opacity:0;transition:opacity .2s;pointer-events:none}
  .ncount.on{opacity:1}
  .ncount i{display:block;height:100%;background:#fff;transform-origin:0 50%;transform:scaleX(0)}
  .ncount.held i{opacity:.55}
  .stepbtn.primary:disabled .ncount{opacity:0}
  .track{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .tsegs{display:flex;gap:3px;margin:0;padding:0;list-style:none}
  .tsegs li{flex:1;min-width:0}
  .tseg{display:flex;flex-direction:column;align-items:stretch;gap:5px;width:100%;padding:6px 0 4px;border:0;background:none;
    cursor:pointer;font-family:var(--font-ui);text-align:left;color:var(--muted)}
  .tbar{position:relative;display:block;height:5px;border-radius:3px;background:#e1e4ee;overflow:hidden}
  .tbar .tfill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--inman-blue);border-radius:3px;transition:width .45s ease-out}
  .tseg.done .tfill{background:#8ebff5}
  .tlab{display:block;font-size:11px;line-height:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tseg.on .tlab{color:var(--inman-dark);font-weight:700}
  .tseg.done .tlab{color:var(--ink)}
  .tseg:hover .tlab{color:var(--inman-blue)}
  .tcur{display:none;font-size:11.5px;line-height:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tcur b{color:var(--inman-dark);font-weight:700}
  /* the cue */
  .stepper.cue .stepbtn.primary:not(:disabled){animation:nudgePulse 2.2s ease-out infinite}
  .stepper.cue .stepbtn.primary:not(:disabled) .arr{animation:nudgeArr 1.1s ease-in-out infinite}
  .stepper.cue .tseg.up .tbar::after{content:"";position:absolute;top:0;bottom:0;left:0;width:60%;
    background:linear-gradient(90deg,rgba(10,132,255,0),rgba(10,132,255,.5),rgba(10,132,255,0));
    transform:translateX(-110%);animation:shimmer 2.2s ease-in-out infinite;animation-delay:calc(var(--u,0) * .18s)}
  @keyframes nudgePulse{0%{box-shadow:0 0 0 0 rgba(10,132,255,.5)}60%{box-shadow:0 0 0 9px rgba(10,132,255,0)}100%{box-shadow:0 0 0 0 rgba(10,132,255,0)}}
  @keyframes nudgeArr{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
  @keyframes shimmer{0%{transform:translateX(-110%)}55%,100%{transform:translateX(190%)}}
  .stepbtn:focus-visible,.tseg:focus-visible,#chart:focus-visible{outline:2px solid var(--inman-blue);outline-offset:2px}
  .tseg:focus-visible{outline-offset:0;border-radius:3px}
  @media (prefers-reduced-motion:reduce){
    .takeaway,.tbar .tfill{transition:none}
    .stepcap .ell i{opacity:1;transition:none}
    .stepper.cue .stepbtn.primary,.stepper.cue .stepbtn.primary .arr,.stepper.cue .tseg.up .tbar::after{animation:none}
    .stepper.cue .tseg.up .tbar::after{display:none}
  }
  html.rm .takeaway,html.rm .tbar .tfill{transition:none}
  html.rm .stepcap .ell i{opacity:1;transition:none}
  html.rm .stepper.cue .stepbtn.primary,html.rm .stepper.cue .stepbtn.primary .arr{animation:none}
  html.rm .stepper.cue .tseg.up .tbar::after{display:none;animation:none}
  .invalid{border:1px solid var(--inman-red);border-radius:4px;padding:12px 14px;font-size:13.5px;margin:0}
  .loading{padding:28px 0;color:var(--muted);font-size:13px}

  .foot{background:var(--inman-dark);color:#aab2da;padding:11px 18px 14px;font-size:11px;line-height:1.55}
  .foot .credit{color:#c7cef0}
  .foot .method p{margin:5px 0 0;color:#8ea2c8}
  .foot .method ul{margin:3px 0 0;padding:0 0 0 16px;color:#8ea2c8}
  .foot .method li{margin:1px 0 0}
  .foot .method .mh{color:#c7cef0;font-weight:600}
  .foot details summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:7px;color:#c7cef0;font-weight:600;font-size:11.5px;padding:2px 0}
  .foot details[open]{margin-bottom:6px}
  .foot .disclaimer{margin:6px 0 2px;color:#aab2da}

  /* ---- Choices.js ---- */
  .choices{margin-bottom:0;font-size:14px}
  .choices__inner{background:#fff;border:1px solid var(--field);border-radius:3px;min-height:36px;padding:4px 7px 3px;font-size:14px}
  .choices__list--dropdown,.choices__list[aria-expanded]{border-color:var(--field);font-size:13.5px;z-index:20}
  .choices[data-type*=select-one] .choices__inner{padding-bottom:3px}
  .choices[data-type*=select-one] .choices__input{font-family:var(--font-ui)}
  select#metro-select{height:36px;font-family:var(--font-ui);font-size:14px;border:1px solid var(--field);border-radius:3px;background:#fff;width:100%}

  /* edit list 10: when the fields would get narrower than about 150px, two
     columns, each option on its own line (its main field always starts a
     line): four fields at 700px and below, three at 520px and below */
  @media (max-width:700px){
    .optrow[data-n="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}
    .optrow[data-n="4"] .ctl.optmain{grid-column-start:1}
  }
  @media (max-width:520px){
    .optrow{grid-template-columns:repeat(2,minmax(0,1fr))}
    .optrow .ctl.optmain{grid-column-start:1}
  }
  @media (max-width:860px){
    .budgetrow{grid-template-columns:repeat(3,minmax(0,1fr))}
    .budgetrow .budgethelp{grid-column:span 2}
  }
  /* the step track gets its own row above the buttons */
  @media (max-width:700px){
    .stepper{flex-wrap:wrap}
    .track{order:-1;flex:1 1 100%}
    .stepbtn.replay{margin-left:auto}
  }
  /* The Spend it / Save it / Invest it toggles (Houston, edit list 3,
     2026-10-08): in a row only while all three fit on one line in their
     column (the row needs about 230px; a column is (width - 68px) / 2, so
     the row starts to wrap just above 520px, sooner with a scrollbar). At
     700px and below they stack: one bordered group, one column, each button
     the width of the widest label (sized to the content, never stretched
     across the page), text centred, horizontal rules between buttons. The
     specificity (.usage .seg.compact) beats the generic phone rules for
     .seg and .seg.compact in the 520px block below. */
  @media (max-width:700px){
    .usage .seg.compact{display:inline-flex;flex-direction:column;flex-wrap:nowrap;width:auto;align-self:flex-start}
    .usage .seg.compact button{text-align:center;padding:7px 20px}
    .usage .seg.compact button+button{border-left:0;border-top:1px solid var(--field)}
  }
  @media (max-width:760px){
    .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
    .cards{grid-template-columns:minmax(0,1fr)}
  }
  @media (max-width:520px){
    .sharedrow{grid-template-columns:repeat(2,minmax(0,1fr))}
    .budgetrow{grid-template-columns:repeat(2,minmax(0,1fr))}
    .budgetrow .budgethelp{grid-column:span 1}
    .pairline{width:100%}
    .pairline .optsel{flex:1 1 100%}
    .pairline .optsel select{width:100%}
    .seg{display:flex;flex-direction:column;width:100%}
    .seg button{text-align:left}
    .seg button+button{border-left:0;border-top:1px solid var(--field)}
    .seg.compact{display:inline-flex;flex-direction:row;width:auto}
    .seg.compact button{text-align:center;padding:6px 10px}
    .seg.compact button+button{border-top:0;border-left:1px solid var(--field)}
    .seg.compact.unit button{padding:0 6px}
    .metrobox .pick{max-width:none}
    .usage{grid-template-columns:minmax(0,1fr);gap:16px}
    .usage .ctl{align-items:flex-start}
    .hero .verdict{font-size:18px}
    #chart{height:340px}
    .tlab{display:none}
    .tcur{display:block}
    .tseg{padding:5px 0 3px}
    .stepbtn{padding:0 12px}
    /* phones: Pause / Play shows its icon only; its accessible name and
       tooltip still say Pause or Play */
    .stepbtn.auto{min-width:40px;padding:0 13px}
    .stepbtn.auto .alab{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    .takeaway{width:150px;font-size:11px;padding:5px 8px 6px}
    /* phones: the margin only (2026-10-07: the heading, "Net cost if you
       sell after N years", is dropped too, since the caption already says
       it); each option's net is in the tooltip and the ledger. The smaller
       box fits without covering the difference line. */
    .takeaway .tk-h,.takeaway .tk-r{display:none}
    .takeaway .tk-m{margin-top:0;padding-top:0;border-top:0}
    .restools{margin-left:0}
  }
  @media (max-width:380px){
    .masthead h1{font-size:20px}
  }

  /* ---- print / one-page summary (2026-10-07) ----
     Letter paper. Shows the title, metro and pair, the verdict and its
     assumptions, the first month beside the ledger (the "What you'd have"
     card was removed in edit list 1; the first-month card now runs the
     ledger's full height), the chart at its Compare step (preparePrint() switches the chart there
     and sizes it for the page; afterprint restores it), the inputs used, the
     disclaimer and the credit. Controls and navigation are hidden. Placed
     last so it overrides the narrow-screen rules (a letter page is about
     730px wide, inside the 760px breakpoint). */
  @media print{
    @page{size:letter;margin:.3in .4in}
    html,body{background:#fff !important}
    body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .wrap{max-width:none}
    .masthead{background:#fff;border-bottom:2px solid var(--inman-dark);padding:0 0 5px}
    .masthead .kicker{color:var(--muted);margin:0 0 2px;font-size:9px}
    .masthead h1{color:var(--inman-dark);font-size:17px}
    .masthead p.stand,.controls,.restools,.stepper,.skipbtn,details.more,.foot details,.loading,#invalid{display:none !important}
    .results{padding:7px 0 0}
    .reshead{margin-bottom:6px}
    .reshead .where{font-size:13px}
    .badge{font-size:9px;padding:1px 7px}
    .hero{padding:6px 11px 7px;margin-bottom:6px;break-inside:avoid}
    .hero .verdict{font-size:15px}
    .hero .sub{font-size:11px;margin-top:3px}
    .hero .warn,.hero .overbud{font-size:9.5px;margin-top:3px}
    .assume{margin-top:5px;gap:3px 4px}
    .assume .alead{font-size:8.5px}
    .chip{font-size:9.5px;padding:1px 6px;background:#fff;border-color:var(--line)}
    .cards{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:6px 8px}
    /* long explanations stay on screen; the printout keeps the figures and
       the one-line net-cost note under the ledger */
    #m1-note,#ledger tr.muted,.stepcap .stext,.masthead .kicker{display:none}
    .card{padding:6px 9px 7px;break-inside:avoid}
    .card h2{font-size:8.5px;margin:0 0 4px}
    .verdict2{font-size:11px;margin:0 0 2px}
    table.bd{font-size:9.5px;margin-top:3px}
    table.bd td,table.bd th{padding:1.5px 0}
    table.bd th{font-size:8px}
    table.bd tr.sec td{font-size:8px;padding-top:5px}
    table.bd tr.net td{font-size:10px}
    table.bd tr.muted td{font-size:8.5px}
    table.bd tr.sub td{font-size:9px}
    .small{font-size:8px;line-height:1.35;margin:4px 0 0}
    .card.chart{break-inside:avoid;margin-top:0}
    .charthead{margin:0 0 2px}
    .stepcap{min-height:0 !important;margin:0 0 3px}
    .stepcap .snum{display:none}
    .stepcap .stitle{font-size:12px;margin:0 0 1px}
    .stepcap .stext{font-size:9.5px;line-height:1.35}
    .takeaway{transition:none !important}
    .printonly{display:block}
    .pinputs{margin:6px 0 0;break-inside:avoid}
    .pinputs h2{font-family:var(--font-ui);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 3px}
    .pinputs ul{margin:0;padding:0;list-style:none;columns:4;column-gap:12px;font-size:8px;line-height:1.38;color:var(--ink)}
    .pinputs li{break-inside:avoid}
    .pinputs li b{font-weight:600}
    .pinputs .plink{font-size:8px;color:var(--muted);margin:4px 0 0;word-break:break-all}
    .foot{background:#fff;color:var(--ink);padding:4px 0 0;margin-top:5px;border-top:1px solid var(--line);font-size:8.5px;line-height:1.4;break-inside:avoid}
    .foot .disclaimer{color:var(--ink);margin:0 0 2px}
    .foot .credit{color:var(--ink)}
  }
  /* set while printing, so placeTakeaway() measures the print-size box */
  html.printing .takeaway{transition:none !important;box-shadow:none;width:168px;font-size:9.5px;line-height:1.35;padding:4px 7px 5px}
  html.printing #chart{height:185px !important}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <p class="kicker" data-copy="kicker"></p>
    <h1 data-copy="title"></h1>
    <p class="stand" data-copy="standfirst"></p>
  </header>

  <section class="controls" id="controls">
    <div class="metrobox">
      <label for="metro-select" id="metro-lab" data-copy="metroLabel"></label>
      <div class="pick"><select id="metro-select"></select></div>
    </div>

    <!-- Pair picker (2026-10-07): option B's list excludes option A, and
         excludes both rentals when A is a rental. -->
    <div class="pairrow">
      <div class="pairline" role="group" aria-labelledby="pair-lab">
        <span class="word" id="pair-lab" data-copy="pair.compare"></span>
        <span class="optsel"><span class="sw" id="sw-a"></span><select id="opt-a"></select></span>
        <span class="word" data-copy="pair.with"></span>
        <span class="optsel"><span class="sw" id="sw-b"></span><select id="opt-b"></select></span>
        <button type="button" class="swapbtn" id="swap"><span class="ic" aria-hidden="true">&#8644;</span><span data-copy="pair.swap"></span></button>
      </div>
      <button type="button" class="resetbtn" id="reset" data-copy="reset"></button>
    </div>

    <!-- Main inputs (edit list 10, Houston, 2026-10-08): two rows.
         ROW 1, .optrow: each option's own fields, side by side in option
         order: a purchase's price, and for a CONDO purchase its HOA fee
         beside it (the #ctl-a-hoa / #ctl-b-hoa box, moved here from Adjust
         costs by placeHoa(); a house keeps its HOA field in Adjust costs); a
         rental's rent, then its other monthly fees (moved here from Adjust
         costs). Each label carries its option's swatch, so a field's option
         is visible from its colour. The row has one column per visible
         field (3 or 4, set by paintStatic() as --nopt and data-n); where the
         fields would get narrower than about 150px (four fields at 700px and
         below, three at 520px and below) it has two columns, and each
         option's main field starts a new line, so each option keeps its
         pair together on its own line.
         ROW 2, .sharedrow: the shared down payment (% / $ switch and its
         one reserved share line), rate (30 / 15-year switch) and stay
         (slider), three columns (two at 520px and below).
         Price and rent keep their one reserved line for the match buttons,
         and the share line is always reserved, so nothing moves when a
         button, message or share line appears. No help text under the main
         inputs (edit list 1): their default sources are in the method notes
         ("How this calculator works"), including the condo fee's (methodFee),
         and the rental fees' help is the field's screen-reader description. -->
    <div class="inputs">
      <div class="optrow" id="optrow">
      <div class="ctl optmain" data-slot="a" data-for="buy" id="ctl-a-price">
        <label for="in-a-price" class="swlab"><span class="sw" data-sw="a"></span><span id="lab-a-price"></span></label>
        <div class="field"><span class="pre">$</span><input id="in-a-price" type="text" inputmode="numeric" autocomplete="off"><button type="button" class="locktag" id="locktag-a-price" hidden><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M6.5 9.5l3-3M7 4.5l1.2-1.2a2.6 2.6 0 0 1 3.7 3.7L10.7 8.2M9 11.5l-1.2 1.2a2.6 2.6 0 0 1-3.7-3.7L5.3 7.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="sr"></span></button></div>
        <div class="matchline"><button type="button" class="matchbtn" id="match-a-price" data-mslot="a" data-mkey="price"></button><span class="matchmsg" id="matchmsg-a-price" role="status"></span></div>
      </div>
      <!-- (a condo purchase's HOA fee ctl, #ctl-a-hoa, is moved here by placeHoa()) -->
      <div class="ctl optmain" data-slot="a" data-for="rent">
        <label for="in-a-rent" class="swlab"><span class="sw" data-sw="a"></span><span id="lab-a-rent"></span></label>
        <div class="field"><span class="pre">$</span><input id="in-a-rent" type="text" inputmode="decimal" autocomplete="off"><button type="button" class="locktag" id="locktag-a-rent" hidden><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M6.5 9.5l3-3M7 4.5l1.2-1.2a2.6 2.6 0 0 1 3.7 3.7L10.7 8.2M9 11.5l-1.2 1.2a2.6 2.6 0 0 1-3.7-3.7L5.3 7.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="sr"></span></button><span class="suf" data-copy="perMonth"></span></div>
        <div class="matchline"><button type="button" class="matchbtn" id="match-a-rent" data-mslot="a" data-mkey="rent"></button><span class="matchmsg" id="matchmsg-a-rent" role="status"></span></div>
      </div>
      <!-- a rental's other monthly fees, beside its rent (edit list 10) -->
      <div class="ctl optsec" data-slot="a" data-for="rent">
        <label for="in-a-fees" class="swlab"><span class="sw" data-sw="a"></span><span class="ll" id="lab-a-fees" data-copy="fields.fees.label"></span><span class="ls" aria-hidden="true" data-copy="fields.fees.short"></span></label>
        <div class="field"><span class="pre">$</span><input id="in-a-fees" type="text" inputmode="decimal" autocomplete="off" aria-describedby="help-a-fees"><span class="suf" data-copy="perMonth"></span></div>
        <span class="sr" id="help-a-fees"></span>
      </div>
      <div class="ctl optmain" data-slot="b" data-for="buy" id="ctl-b-price">
        <label for="in-b-price" class="swlab"><span class="sw" data-sw="b"></span><span id="lab-b-price"></span></label>
        <div class="field"><span class="pre">$</span><input id="in-b-price" type="text" inputmode="numeric" autocomplete="off"><button type="button" class="locktag" id="locktag-b-price" hidden><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M6.5 9.5l3-3M7 4.5l1.2-1.2a2.6 2.6 0 0 1 3.7 3.7L10.7 8.2M9 11.5l-1.2 1.2a2.6 2.6 0 0 1-3.7-3.7L5.3 7.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="sr"></span></button></div>
        <div class="matchline"><button type="button" class="matchbtn" id="match-b-price" data-mslot="b" data-mkey="price"></button><span class="matchmsg" id="matchmsg-b-price" role="status"></span></div>
      </div>
      <!-- (a condo purchase's HOA fee ctl, #ctl-b-hoa, is moved here by placeHoa()) -->
      <div class="ctl optmain" data-slot="b" data-for="rent">
        <label for="in-b-rent" class="swlab"><span class="sw" data-sw="b"></span><span id="lab-b-rent"></span></label>
        <div class="field"><span class="pre">$</span><input id="in-b-rent" type="text" inputmode="decimal" autocomplete="off"><button type="button" class="locktag" id="locktag-b-rent" hidden><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M6.5 9.5l3-3M7 4.5l1.2-1.2a2.6 2.6 0 0 1 3.7 3.7L10.7 8.2M9 11.5l-1.2 1.2a2.6 2.6 0 0 1-3.7-3.7L5.3 7.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="sr"></span></button><span class="suf" data-copy="perMonth"></span></div>
        <div class="matchline"><button type="button" class="matchbtn" id="match-b-rent" data-mslot="b" data-mkey="rent"></button><span class="matchmsg" id="matchmsg-b-rent" role="status"></span></div>
      </div>
      <!-- a rental's other monthly fees, beside its rent (edit list 10) -->
      <div class="ctl optsec" data-slot="b" data-for="rent">
        <label for="in-b-fees" class="swlab"><span class="sw" data-sw="b"></span><span class="ll" id="lab-b-fees" data-copy="fields.fees.label"></span><span class="ls" aria-hidden="true" data-copy="fields.fees.short"></span></label>
        <div class="field"><span class="pre">$</span><input id="in-b-fees" type="text" inputmode="decimal" autocomplete="off" aria-describedby="help-b-fees"><span class="suf" data-copy="perMonth"></span></div>
        <span class="sr" id="help-b-fees"></span>
      </div>
      </div>
      <div class="sharedrow">
      <!-- Down payment as a percent or in dollars (Houston, edit list 5,
           2026-10-08): the same small unit switch as property tax. In $
           mode the line under the field shows the share of each purchase's
           price; it always keeps its one line of space (hidden in % mode),
           so switching never moves the fields below. -->
      <div class="ctl" id="down-ctl">
        <div class="labrow"><label for="in-down" id="lab-down" data-copy="fields.down.label"></label>
          <span class="seg compact unit" id="downunit" role="group" aria-labelledby="lab-down">
            <button type="button" data-unit="pct" data-copy="fields.down.unitPct"></button>
            <button type="button" data-unit="usd" data-copy="fields.down.unitUsd"></button>
          </span></div>
        <div class="field" data-downunit="pct"><input id="in-down" type="text" inputmode="decimal" autocomplete="off"><span class="suf">%</span></div>
        <div class="field" data-downunit="usd" hidden><span class="pre">$</span><input id="in-downusd" type="text" inputmode="numeric" autocomplete="off"></div>
        <div class="downnote" id="down-note" aria-live="polite"></div>
      </div>
      <!-- Mortgage rate with the loan term built into its box (Houston, edit
           list 4, 2026-10-08): the 30-year | 15-year switch sits along the
           BOTTOM of the box, not the top as on the tax-on-gains box, so the
           rate's value lines up with the other fields in the row; the
           switch then takes the place the stay's slider takes beside it.
           Switching moves the rate to that term's PMMS default unless the
           reader typed a rate (setTerm()). -->
      <div class="ctl" id="rate-ctl">
        <label for="in-rate" data-copy="fields.rate.label"></label>
        <div class="fieldbox termbox">
          <div class="field"><input id="in-rate" type="text" inputmode="decimal" autocomplete="off"><span class="suf">%</span></div>
          <div class="seg compact" id="term-seg" role="group">
            <button type="button" data-term="30"><span class="tl" data-copy="term.y30"></span><span class="ts" data-copy="term.s30"></span></button>
            <button type="button" data-term="15"><span class="tl" data-copy="term.y15"></span><span class="ts" data-copy="term.s15"></span></button>
          </div>
        </div>
      </div>
      <div class="ctl">
        <label for="in-years" data-copy="fields.years.label"></label>
        <div class="field"><input id="in-years" type="text" inputmode="numeric" autocomplete="off"><span class="suf" data-copy="yearsUnit"></span></div>
        <input type="range" id="in-years-range" step="1" aria-labelledby="years-range-lab">
        <span id="years-range-lab" hidden data-copy="fields.years.label"></span>
      </div>
      </div>
    </div>

    <!-- What happens to money one option frees up compared with the other,
         up front and month by month (Houston, 2026-10-07). Defaults:
         DEF.downUse, DEF.diffUse (calculator_defaults.csv). Since
         2026-10-07: Spend it | Save it | Invest it, left to right; "Kept as
         cash" is no longer offered (pageUse() maps it to spend). Labels
         since edit list 1: "Money not used up front", "Monthly cost
         difference". -->
    <div class="usage">
      <div class="ctl">
        <span class="q" id="down-lab" data-copy="use.downLabel"></span>
        <div class="seg compact" id="down-seg" role="group" aria-labelledby="down-lab">
          <button type="button" data-use="spend" data-copy="use.spend"></button>
          <button type="button" data-use="save" data-copy="use.save"></button>
          <button type="button" data-use="invest" data-copy="use.invest"></button>
        </div>
      </div>
      <div class="ctl">
        <span class="q" id="diff-lab" data-copy="use.diffLabel"></span>
        <div class="seg compact" id="diff-seg" role="group" aria-labelledby="diff-lab">
          <button type="button" data-use="spend" data-copy="use.spend"></button>
          <button type="button" data-use="save" data-copy="use.save"></button>
          <button type="button" data-use="invest" data-copy="use.invest"></button>
        </div>
      </div>
    </div>

    <!-- Optional monthly budget (Houston, edit list 6, 2026-10-08): one
         main-row-width field under the money questions, its one help line
         beside it (below it on phones). Blank by default; it flags options
         whose first-month recurring cost is over it and changes no figure. -->
    <div class="budgetrow">
      <div class="ctl">
        <label for="in-budget" data-copy="budget.label"></label>
        <div class="field"><span class="pre">$</span><input id="in-budget" type="text" inputmode="decimal" autocomplete="off"><span class="suf" data-copy="perMonth"></span></div>
      </div>
      <p class="help budgethelp" data-copy="budget.help"></p>
    </div>

    <!-- Growth: one box per option (Houston, edit list 3, 2026-10-08): home
         value growth for each purchase and rent growth for the rental, one
         flat rate a year each (was three boxes per option: year 1, year 2,
         year 3 on, with forecast help lines, now gone), labelled with the
         option and its swatch; then investing. -->
    <details class="panel" id="growth">
      <summary data-copy="growthSummary"></summary>
      <div class="grid4">
        <div class="subhead" id="head-growth"></div>
        <div class="ctl" data-slot="a" data-for="buy"><label for="in-a-app" class="swlab"><span class="sw" data-sw="a"></span><span id="lab-a-app"></span></label>
          <div class="field"><input id="in-a-app" type="text" inputmode="decimal" autocomplete="off"><span class="suf" data-copy="pctPerYear"></span></div></div>
        <div class="ctl" data-slot="a" data-for="rent"><label for="in-a-rg" class="swlab"><span class="sw" data-sw="a"></span><span id="lab-a-rg"></span></label>
          <div class="field"><input id="in-a-rg" type="text" inputmode="decimal" autocomplete="off"><span class="suf" data-copy="pctPerYear"></span></div></div>
        <div class="ctl" data-slot="b" data-for="buy"><label for="in-b-app" class="swlab"><span class="sw" data-sw="b"></span><span id="lab-b-app"></span></label>
          <div class="field"><input id="in-b-app" type="text" inputmode="decimal" autocomplete="off"><span class="suf" data-copy="pctPerYear"></span></div></div>
        <div class="ctl" data-slot="b" data-for="rent"><label for="in-b-rg" class="swlab"><span class="sw" data-sw="b"></span><span id="lab-b-rg"></span></label>
          <div class="field"><input id="in-b-rg" type="text" inputmode="decimal" autocomplete="off"><span class="suf" data-copy="pctPerYear"></span></div></div>

        <div class="subhead" data-copy="growthHead.invest"></div>
        <div class="ctl">
          <label for="in-sav" data-copy="fields.sav.label"></label>
          <div class="field"><input id="in-sav" type="text" inputmode="decimal" autocomplete="off"><span class="suf" data-copy="pctPerYear"></span></div>
          <div class="help" id="help-sav"></div>
        </div>
        <div class="ctl">
          <label for="in-ret" data-copy="fields.ret.label"></label>
          <div class="field"><input id="in-ret" type="text" inputmode="decimal" autocomplete="off"><span class="suf" data-copy="pctPerYear"></span></div>
          <div class="help" id="help-ret"></div>
        </div>
        <!-- Tax on investment gains, with the account type built into the
             top of its box (Houston, edit list 1, 2026-10-07; the separate
             "Account" selector is gone). Retirement untaxes the invested
             monthly cost difference only; the rate field stays editable,
             since it still taxes invested money not used up front. -->
        <div class="ctl">
          <label for="in-cgt" data-copy="fields.cgt.label"></label>
          <div class="fieldbox">
            <div class="seg compact" id="acct-seg" role="group">
              <button type="button" data-acct="brokerage" data-copy="account.brokerage"></button>
              <button type="button" data-acct="retirement" data-copy="account.retirement"></button>
            </div>
            <div class="field"><input id="in-cgt" type="text" inputmode="decimal" autocomplete="off"><span class="suf">%</span></div>
          </div>
          <div class="help" id="help-cgt"></div>
        </div>
      </div>
    </details>

    <!-- Adjust costs: one block per purchase, then the shared loan and
         transaction settings. -->
    <details class="panel" id="adjust">
      <summary data-copy="adjustSummary"></summary>
      <div class="grid4">
        <div class="subhead" data-slot="a" data-for="buy"><span class="sw" data-sw="a"></span><span id="head-a-cost"></span></div>
        <div class="ctl" data-slot="a" data-for="buy">
          <div class="labrow"><label for="in-a-tax" id="lab-a-tax" data-copy="fields.tax.label"></label>
            <span class="seg compact unit" id="a-taxunit" role="group" aria-labelledby="lab-a-tax">
              <button type="button" data-unit="pct" data-copy="fields.tax.unitPct"></button>
              <button type="button" data-unit="usd" data-copy="fields.tax.unitUsd"></button>
            </span></div>
          <div class="field" data-taxunit="pct"><input id="in-a-tax" type="text" inputmode="decimal" autocomplete="off"><span class="suf" data-copy="pctPerYear"></span></div>
          <div class="field" data-taxunit="usd" hidden><span class="pre">$</span><input id="in-a-taxusd" type="text" inputmode="numeric" autocomplete="off"><span class="suf" data-copy="perYear"></span></div>
          <div class="help" id="help-a-tax"></div>
        </div>
        <div class="ctl" data-slot="a" data-for="buy">
          <label for="in-a-ins" data-copy="fields.ins.label"></label>
          <div class="field"><span class="pre">$</span><input id="in-a-ins" type="text" inputmode="decimal" autocomplete="off"><span class="suf" data-copy="perMonth"></span></div>
          <div class="help" id="help-a-ins"></div>
        </div>
        <!-- HOA fee (edit list 10): this box sits here for a HOUSE purchase;
             for a condo purchase placeHoa() moves it into the main row,
             beside the price (one field, one value, wherever it is shown) -->
        <span class="hoa-home" id="hoa-home-a" hidden></span>
        <div class="ctl" data-slot="a" data-for="buy" id="ctl-a-hoa">
          <label for="in-a-hoa" class="swlab"><span class="sw" data-sw="a"></span><span data-copy="fields.hoa.label"></span></label>
          <div class="field"><span class="pre">$</span><input id="in-a-hoa" type="text" inputmode="decimal" autocomplete="off"><span class="suf" data-copy="perMonth"></span></div>
          <div class="help" id="help-a-hoa"></div>
        </div>
        <div class="ctl" data-slot="a" data-for="buy">
          <label for="in-a-maint" data-copy="fields.maint.label"></label>
          <div class="field"><input id="in-a-maint" type="text" inputmode="decimal" autocomplete="off"><span class="suf" data-copy="pctPerYear"></span></div>
          <div class="help" id="help-a-maint"></div>
        </div>
        <div class="ctl" data-slot="a" data-for="buy">
          <label for="in-a-assess" data-copy="fields.assess.label"></label>
          <div class="field"><span class="pre">$</span><input id="in-a-assess" type="text" inputmode="numeric" autocomplete="off"></div>
          <div class="help" id="help-a-assess"></div>
        </div>
        <!-- Renter-side costs for a rental in slot a (Houston, edit list 4,
             2026-10-08), mirroring the purchase blocks; both $0 by default -->

function readField(key){
